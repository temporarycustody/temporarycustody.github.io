html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d5cc;margin-bottom:.9em;text-shadow:0 0 10px #05060a,0 0 4px #05060a,0 0 2px #05060a,0 0 1px #000}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   S calm still  as A, but the planet is its still picture: no shader, no turning

<script>
const DATA={"intro": ["Alex looks directly into the camera.", "He tells you what kind of evening it’s going to be.", "The viewer may not have noticed."], "beats": [{"i": 1, "html": "Alex looks directly into the camera.", "words": 6}, {"i": 2, "html": "The screenplay gives the voice. <span class=\"q\" data-q=\"There was me, that is Alex, and my three droogs\">“There was me, that is Alex, and my three droogs”<\/span>", "words": 15}, {"i": 3, "html": "He introduces himself and his droogs, then tells you what kind of evening it’s going to be, in the tone of someone sharing a pleasure.", "words": 25}, {"i": 4, "html": "The Purcell on the soundtrack is slow and processional, a funeral march rendered through a synthesizer.", "words": 16}, {"i": 5, "html": "By the time the first act of <span class=\"mo\" data-k=\"violence\">violence<\/span> begins, the film has seated the <span class=\"mo\" data-k=\"viewer\">viewer<\/span> inside Alex’s position.", "words": 18}, {"i": 6, "html": "The world arrives through his address, and no other position has been offered. The <span class=\"mo\" data-k=\"viewer\">viewer<\/span> may not have noticed.", "words": 19}, {"i": 7, "html": "Alex’s position in the field is unusual. He’s the agent of the film’s <span class=\"mo\" data-k=\"violence\">violence<\/span>, its primary victim, and a man who hears <span class=\"mo\" data-k=\"music\">Beethoven<\/span>’s Ninth as transport.", "words": 28}, {"i": 8, "html": "Over the <span class=\"mo\" data-k=\"music\">Ninth<\/span> his voice-over sees people screaming on the ground and women pinned against walls. It narrates them in the rapture it gives the sound.", "words": 26}, {"i": 9, "html": "The voice-over says what comes. <span class=\"q\" data-q=\"veeks and ptitsas laying on the ground screaming for mercy\">“veeks and ptitsas laying on the ground screaming for mercy”<\/span>", "words": 15}, {"i": 10, "html": "He sings <span class=\"q\" data-q=\"Singin’ in the Rain\">“Singin’ in the Rain”<\/span> through the <span class=\"mo\" data-k=\"violence\">attack<\/span> on the writer’s house, tap-dancing, each kick falling on a lyric. Dim holds the writer’s wife.", "words": 25}, {"i": 11, "html": "Whether he’s kicking a man on the floor, clubbing him in time with a <span class=\"mo\" data-k=\"music\">song<\/span>, or listening in his flat while the Ninth goes through fifty small loudspeakers, Alex is fully present in the act, undivided, the same total absorption running through all of it with no seam anywhere he could use to tell one occasion from another.", "words": 59}, {"i": 12, "html": "He never names the absorption as one capacity. This is his limit.", "words": 12}, {"i": 13, "html": "The State’s position is simpler and more lethal. <span class=\"mo\" data-k=\"violence\">Violence<\/span> is a behavioural problem, and behavioural problems have technical solutions. The Minister of the Interior calls the aim the end of the criminal reflex.", "words": 33}, {"i": 14, "html": "The Minister’s phrase is short. <span class=\"q\" data-q=\"Kill the criminal reflex\">“Kill the criminal reflex”<\/span>", "words": 9}, {"i": 15, "html": "The Ludovico <span class=\"mo\" data-k=\"technique\">technique<\/span> pairs <span class=\"mo\" data-k=\"violence\">violence<\/span> with nausea, terror, and helplessness until the subject can’t contemplate violence without suffering.", "words": 18}, {"i": 16, "html": "The Minister watches a staged demonstration from a seat among a hall of officials, and he reads the nausea as proof that the <span class=\"mo\" data-k=\"technique\">treatment<\/span> works.", "words": 25}, {"i": 17, "html": "What the State can’t see is its own target. It strikes the structure that produces Alex’s capacity for <span class=\"mo\" data-k=\"violence\">violence<\/span>, and that structure also produces his response to <span class=\"mo\" data-k=\"music\">Beethoven<\/span>. You can’t <span class=\"mo\" data-k=\"technique\">condition<\/span> away the one without poisoning the other. The State doesn’t know this.", "words": 45}, {"i": 18, "html": "Seated again, the Minister (he has just called the moment historic) leans toward his Junior Minister, who says their necks are out a long way.", "words": 25}, {"i": 19, "html": "The Junior Minister’s words are plain. <span class=\"q\" data-q=\"Our necks are out a long way on this\">“Our necks are out a long way on this”<\/span>", "words": 15}, {"i": 20, "html": "The Minister says there’s nothing to lose if the polls are right.", "words": 12}, {"i": 21, "html": "The chaplain sees the thing the State misses.", "words": 8}, {"i": 22, "html": "In the prison he tells Alex that goodness is <span class=\"mo\" data-k=\"choice\">chosen<\/span>, and that a man who can’t choose has stopped being a man.", "words": 23}, {"i": 23, "html": "He says it to Alex, in the library. <span class=\"q\" data-q=\"Goodness is chosen\">“Goodness is chosen”<\/span>", "words": 11}, {"i": 24, "html": "At the demonstration he rises, crosses to Alex, and says it again, with the <span class=\"mo\" data-k=\"technique\">treatment<\/span> finished and the officials seated.", "words": 20}, {"i": 25, "html": "<span class=\"q\" data-q=\"Choice! The boy has no real choice, has he?\">“Choice! The boy has no real choice, has he?”<\/span>", "words": 9}, {"i": 26, "html": "A man <span class=\"mo\" data-k=\"technique\">conditioned<\/span> against <span class=\"mo\" data-k=\"violence\">violence<\/span> can’t <span class=\"mo\" data-k=\"choice\">choose<\/span> not to be violent. He can only not be violent, the choice already removed before he gets to it. Compliance without moral weight is what’s left.", "words": 33}, {"i": 27, "html": "The Minister has a word for the objection. Subtleties.", "words": 9}, {"i": 28, "html": "The chaplain names what’s being lost with precision and can’t stop it, and his limit comes from the institution around him. He doesn’t appear again.", "words": 25}, {"i": 29, "html": "The Ludovico <span class=\"mo\" data-k=\"technique\">technique<\/span> works as the Minister says it will. Alex, bound in a chair with his eyelids locked open, watches films of <span class=\"mo\" data-k=\"violence\">violence<\/span> while a drug produces terror, helplessness, and nausea.", "words": 32}, {"i": 30, "html": "The doctors are after an association, and they get one. <span class=\"mo\" data-k=\"music\">Beethoven<\/span> enters by accident.", "words": 14}, {"i": 31, "html": "The soundtrack of one of the films carries the <span class=\"mo\" data-k=\"music\">Ninth<\/span>, and the <span class=\"mo\" data-k=\"technique\">conditioning<\/span> binds to the music too. Alex cries out that the music did no harm to anyone.", "words": 30}, {"i": 32, "html": "He cries out. <span class=\"q\" data-q=\"Using Ludwig van like that!\">“Using Ludwig van like that!”<\/span>", "words": 8}, {"i": 33, "html": "Dr. Brodsky says it can’t be helped, calls it a punishment element, and proceeds.", "words": 14}, {"i": 34, "html": "At the demonstration a naked girl walks toward Alex. His voice-over takes her in order. She comes as a kind of grace.", "words": 22}, {"i": 35, "html": "The voice-over keeps the order. <span class=\"q\" data-q=\"quick as a shot came the sickness\">“quick as a shot came the sickness”<\/span>", "words": 12}, {"i": 36, "html": "He wants her on the floor. The sickness arrives before the wanting has finished. The <span class=\"mo\" data-k=\"technique\">technique<\/span> uncovers what the State couldn’t see going in: <span class=\"mo\" data-k=\"violence\">violence<\/span>, desire, and <span class=\"mo\" data-k=\"music\">music<\/span> are one capacity meeting different occasions.", "words": 35}, {"i": 37, "html": "Later, questioned by a man who takes notes, Alex says the doctors hadn’t planned for the <span class=\"mo\" data-k=\"music\">music<\/span>.", "words": 18}, {"i": 38, "html": "Alex says so himself. <span class=\"q\" data-q=\"they hadn’t planned for\">“they hadn’t planned for”<\/span>", "words": 8}, {"i": 39, "html": "The State set out to remove Alex’s <span class=\"mo\" data-k=\"violence\">violence<\/span>. It removed his <span class=\"mo\" data-k=\"music\">Beethoven<\/span>. Nobody in the screenplay says these are the same operation.", "words": 24}, {"i": 40, "html": "Anthony Burgess’s 1962 novel has twenty-one chapters, and the last follows Alex at eighteen, tired of ultra-<span class=\"mo\" data-k=\"violence\">violence<\/span>, imagining a wife and a son. Burgess called twenty-one the symbol of human maturity. The chapter shows maturation, with no <span class=\"mo\" data-k=\"technique\">treatment<\/span> in sight.", "words": 42}, {"i": 41, "html": "The novel gives his age. <span class=\"q\" data-q=\"I was eighteen now, just gone\">“I was eighteen now, just gone”<\/span>", "words": 11}, {"i": 42, "html": "The American edition, which Kubrick followed, omitted it, because Burgess’s New York publisher insisted on cutting it.", "words": 17}, {"i": 43, "html": "The film therefore has no room for the possibility that Alex’s absorption might, with time and no <span class=\"mo\" data-k=\"technique\">treatment<\/span>, turn toward something other than <span class=\"mo\" data-k=\"violence\">violence<\/span>.", "words": 26}, {"i": 44, "html": "The screenplay ends with the <span class=\"mo\" data-k=\"music\">Ninth<\/span> playing and Alex, in his own vision, running again with a cut-throat razor. He calls that cured.", "words": 23}, {"i": 45, "html": "The screenplay stages the <span class=\"mo\" data-k=\"violence\">violence<\/span> as performance. Alex sings and dances through the attack on the writer’s house, each kick landing on a lyric. His last words in the scene order the gagged writer to watch. A <span class=\"mo\" data-k=\"music\">song<\/span>, a dance, and an onlooker are built into it.", "words": 48}, {"i": 46, "html": "Kubrick uses <span class=\"mo\" data-k=\"music\">Beethoven<\/span>’s music and the choreography of <span class=\"mo\" data-k=\"violence\">violence<\/span> to produce in the <span class=\"mo\" data-k=\"viewer\">viewer<\/span> the <span class=\"mo\" data-k=\"technique\">condition<\/span> Alex occupies.", "words": 19}, {"i": 47, "html": "The <span class=\"mo\" data-k=\"violence\">attack<\/span> is funny, and the <span class=\"mo\" data-k=\"viewer\">viewer<\/span> laughs, and then has to decide where the laughter goes. The <span class=\"mo\" data-k=\"music\">Beethoven<\/span> passages move. The film keeps the two responses together.", "words": 28}, {"i": 48, "html": "It seats the <span class=\"mo\" data-k=\"viewer\">viewer<\/span> inside Alex’s address from the first shot. It choreographs <span class=\"mo\" data-k=\"violence\">violence<\/span> as beauty and scores horror with <span class=\"mo\" data-k=\"music\">music<\/span> that arrives as transport. By its end it has produced the <span class=\"mo\" data-k=\"technique\">condition<\/span> it depicts. The viewer sits inside it too, alongside him. The film makes the viewer inhabit what the chaplain only names.", "words": 54}, {"i": 49, "html": "The Minister takes <span class=\"mo\" data-k=\"violence\">violence<\/span> for a reflex and wants the reflex killed.", "words": 12}, {"i": 50, "html": "Dr. Brodsky hears Alex cry out over the <span class=\"mo\" data-k=\"music\">Ninth<\/span> and calls it a punishment element.", "words": 15}, {"i": 51, "html": "Alex tells Rubinstein the doctors hadn’t planned for the <span class=\"mo\" data-k=\"music\">music<\/span>.", "words": 11}, {"i": 52, "html": "The chaplain says the boy has no real <span class=\"mo\" data-k=\"choice\">choice<\/span>.", "words": 10}, {"i": 53, "html": "Mr. Alexander says the <span class=\"mo\" data-k=\"technique\">treatment<\/span> took away Alex’s power to <span class=\"mo\" data-k=\"choice\">choose<\/span>.", "words": 12}, {"i": 54, "html": "Each of them names one piece of a loss, and none names the whole.", "words": 14}, {"i": 55, "html": "The State believes <span class=\"mo\" data-k=\"violence\">violence<\/span> is a separable behavioural module, removable with the rest of the person left intact. The doctors have the evidence in front of them and file it under punishment.", "words": 32}, {"i": 56, "html": "The <span class=\"mo\" data-k=\"viewer\">viewer<\/span> ends up holding it. The formal apparatus produces that holding. The viewer can’t separate the pleasure of the <span class=\"mo\" data-k=\"music\">Beethoven<\/span> from the nausea of the <span class=\"mo\" data-k=\"technique\">conditioning<\/span>, because the film spends its length demonstrating why.", "words": 36}, {"i": 57, "html": "The <span class=\"mo\" data-k=\"viewer\">viewer<\/span> is left where Alex is left after the <span class=\"mo\" data-k=\"technique\">technique<\/span>. The world is organized by a capacity whose expressions can’t be sorted into the acceptable and the unacceptable. The State did the sorting and poisoned everything in the act.", "words": 41}, {"i": 58, "html": "The chaplain saw that the sorting was wrong and couldn’t stop it. Neither Alex nor the film has the structure in view. The film also lacks the chapter in which that structure might have resolved on its own.", "words": 38}, {"i": 59, "html": "What remains is the <span class=\"mo\" data-k=\"viewer\">viewer<\/span>, holding the laughter and the nausea and the <span class=\"mo\" data-k=\"music\">Beethoven<\/span>, unable to put any of them down.", "words": 23}, {"i": 60, "html": "And we, whether we’ve watched the film once or know every cut of it, or have laughed at some other picture before we knew its cost, may find that a picture seated us there too before we noticed.", "words": 38}], "seg": [{"k": "beat", "i": 1, "g": 0, "ch": null}, {"k": "beat", "i": 2, "g": 0, "ch": "Block 1"}, {"k": "beat", "i": 3, "g": 0, "ch": "Block 1"}, {"k": "beat", "i": 4, "g": 0, "ch": null}, {"k": "beat", "i": 5, "g": 0, "ch": null}, {"k": "beat", "i": 6, "g": 0, "ch": null}, {"k": "beat", "i": 7, "g": 1, "ch": null}, {"k": "beat  if(MODE==='E'){const S=Math.min(W*.56,H*.28,280),e=root.querySelector('.ecl'),d=S/1.16,o=(S-d)/2;Object.assign(e.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H*.11)+'px'});
  Object.assign(e.querySelector('.rim').style,{left:o+'px',top:o+'px',width:d+'px',height:d+'px'});const c=d*2.1;Object.assign(e.querySelector('.cor').style,{left:(S-c)/2+'px',top:(S-c)/2+'px',width:c+'px',height:c+'px'});
  Object.assign(pass.style,{top:(H*.11+S+26)+'px',bottom:'92px'});return}
 if(MODE==='B'){const S=Math.min(W*.62,H*.3,300);if(pl)Object.assign(pl.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H*.1)+'px'});
  const top=H*.1+S+22;Object.assign(pass.style,{top:top+'px',bottom:'92px'})}
 else{const S=Math.max(W*2.3,H*1.1),vis=Math.min(H*.24,S*.2);if(pl)Object.assign(pl.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H-vis)+'px'});
  Object.assign(pass.style,{top:'64px',bottom:(vis+20)+'px',display:'flex',flexDirection:'column'})}}
addEventListener('resize',layout);layout();
function tones(cb){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(im,0,0,40,40);const d=x.getImageData(0,0,40,40).data,px=[];
  for(let i=0;i<d.length;i+=4)if(d[i+3]>220)px.push([d[i],d[i+1],d[i+2],d[i]*.3+d[i+1]*.59+d[i+2]*.11]);px.sort((a,b)=>a[3]-b[3]);
  const avg=a=>{const s=[0,0,0];a.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2]});return s.map(v=>v/Math.max(1,a.length))};
  const sat=(c,k)=>{const m=(c[0]+c[1]+c[2])/3;return c.map(v=>Math.max(0,Math.min(255,m+(v-m)*k)))};
  cb(sat(avg(px.slice(Math.floor(px.length*.75))),1.5),sat(avg(px.slice(0,Math.floor(px.length*.4))),1.6))};im.src=STILL}
if(MODE==='N')tones((hi,lo)=>{const cv=root.querySelector('.neb'),W=innerWidth*1.24,H=innerHeight*1.24,w=180,h=Math.round(w*H/W);cv.width=w;cv.height=h;const x=cv.getContext('2d'),img=x.createImageData(w,h);
  let sd=(FILE.length*7919)%1000;const P=new Float32Array(512);for(let i=0;i<512;i++){sd=(sd*16807+11)%2147483647;P[i]=sd/2147483647}
  const hs=(i,j)=>P[((i*57+j*131)%512+512)%512];const sm=t=>t*t*(3-2*t);
  const vn=(X,Y)=>{const i=Math.floor(X),j=Math.floor(Y),fx=sm(X-i),fy=sm(Y-j);const a=hs(i,j),b=hs(i+1,j),c=hs(i,j+1),d=hs(i+1,j+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
  const fbm=(X,Y)=>{let v=0,a=.5;for(let o=0;o<5;o++){v+=a*vn(X,Y);X*=2.03;Y*=2.03;a*=.5}return v};
  const deep=[12,10,24];
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=i/w*3.2,v=j/h*3.2*H/W;const q=fbm(u+1.7,v+.3),r=fbm(u+3*q+.4,v+3*q+5.2);let f=fbm(u+2.2*r,v+2.2*r);
   const cy=(j/h-.42),cx=(i/w-.5),fall=Math.max(0,1-Math.hypot(cx*1.1,cy*1.6)*1.35);let den=Math.max(0,(f-.3)*2.5)*fall;den=Math.min(1,den);const fil=Math.pow(Math.max(0,1-Math.abs(r-.55)*7),3)*fall*.6;
   const k=(j*w+i)*4,t=Math.min(1,f*1.25);for(let ch=0;ch<3;ch++){const base=lo[ch]+(hi[ch]-lo[ch])*t;img.data[k+ch]=Math.min(255,deep[ch]*(1-den)+base*den*1.15+hi[ch]*fil*.6)}
   img.data[k+3]=Math.round(Math.min(1,den*.85+fil)*240)}
  x.putImageData(img,0,0);requestAnimationFrame(()=>cv.classList.add('on'))});
if(MODE==='E')tones((hi)=>{const e=root.querySelector('.ecl'),c=hi.map(Math.round).join(',');
  e.querySelector('.cor').style.background=`radial-gradient(circle closest-side,rgba(${c},0) 45%,rgba(${c},.42) 48%,rgba(${c},.16) 56%,rgba(${c},.05) 72%,rgba(${c},0) 100%)`;
  e.querySelector('.rim').style.boxShadow=`0 0 0 1px rgba(255,244,230,.55),0 0 14px 3px rgba(${c},.45),inset 0 0 18px rgba(${c},.25)`});
let k=-1,timer=null,paused=false,started=false,ended=false;
const holdOf=it=>it.title?7:Math.min(26,4.5+it.words*.3);
function center(){/* the passage sits in the middle of its space unless it is too long, then it scrolls from the top */
 if(MODE==='D'||MODE==='N'){const inner=pass.firstElementChild;if(inner)inner.style.margin=pass.scrollHeight>pass.clientHeight+2?'0':'auto 0'}
 else{const inner=pass.firstElementChild;if(inner){inner.style.marginTop='0';const room=pass.clientHeight-inner.offsetHeight;inner.style.marginTop=room>0?(room*.35)+'px':'0'}}}
function show(j,user){if(j<0||j>=ITEMS.length)return;if(ended)ended=false;k=j;save(j);clearTimeout(timer);
 TK.forEach((t,i)=>t.classList.toggle('cur',i===j));
 pass.classList.add('out');setTimeout(()=>{pass.innerHTML=`<div>${passHTML(ITEMS[j],true)}</div>`;pass.scrollTop=0;center();pass.classList.remove('out');snd.bell(j)},reduce?0:user?450:900);
 schedule()}
function schedule(){clearTimeout(timer);if(paused||!started)return;timer=setTimeout(()=>{if(k>=ITEMS.length-1)end();else show(k+1)},(holdOf(ITEMS[k])+1)*1000)}
function end(){ended=true;seen();const nx=nextStudy();pass.classList.add('out');
 setTimeout(()=>{pass.innerHTML=`<div class="endp"><div class="k mono">End of the study</div><div class="tx">${esc(DATA.__title)}</div><button type="button" id="eA">Read again</button>${nx?`<button type="button" id="eN">Next study<b>${esc(nx[0])}</b></button>`:''}<button type="button" id="eS">Back to the sky</button></div>`;center();pass.classList.remove('out');
  pass.querySelector('#eA').onclick=()=>show(0,true);pass.querySelector('#eS').onclick=toSky;if(nx)pass.querySelector('#eN').onclick=()=>goNext(nx)},reduce?0:900)}
function begin(withSound){if(started)return;started=true;root.querySelector('.gate').classList.add('gone');
 if(withSound)snd.start();else{snd.toggle();root.querySelector('#mSnd').textContent='Sound off'}
 const r=resumeAt();show(r);}
root.querySelector('#mGo').onclick=()=>begin(true);root.querySelector('#mQuiet').onclick=()=>begin(false);
root.querySelector('.back').addEventListener('click',toSky);
root.querySelector('#mNext').onclick=()=>{if(!started)begin(true);else if(k>=ITEMS.length-1)end();else show(k+1,true)};
root.querySelector('#mBack').onclick=()=>{if(!started)begin(true);else show(Math.max(0,k-1),true)};
root.querySelector('#mPause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';schedule()};
root.querySelector('#mSnd').onclick=e=>{e.target.textContent=snd.toggle()?'Sound on':'Sound off'};
let sx=null,sy=0;root.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
root.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){if(!started){begin(true);return}if(dx<0){if(k>=ITEMS.length-1)end();else show(k+1,true)}else show(Math.max(0,k-1),true)}},{passive:true});
/* before beginning, the title sits under the gate */
pass.innerHTML=`<div>${passHTML(ITEMS[0],true)}</div>`;requestAnimationFrame(center);
if(FRAMED&&GO)setTimeout(()=>begin(true),60);
ready();
})();
</script>
<script>
/* In place of the planet: a nebula that drifts, turns and breathes, in the planet's own colours. At each new section of
   the study the gas re-forms in a shifted colour and the sky behind it takes a new tint, so the key turns of the study
   are felt in the field. NEB picks the form:
     drift  one slow cloud mass where the planet was, three layers turning against each other
     veils  long veils of gas crossing the whole sky at different speeds, like weather seen from far off
     core   a small hot star inside a shell and two lobes of gas, the whole turning slowly on its axis
   Phones (window.__MOB) and #lite get the light form: fewer, smaller layers, 30 frames a second, no inner churn. */
(function(){const STYLE=window.__NEB;if(!STYLE)return;
const cv=document.getElementById('neb'),g=cv.getContext('2d');
const LITE=!!window.__MOB||/lite/.test(location.hash),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const RES=LITE?120:240;
let W=0,H=0,D=1;function size(){W=innerWidth;H=innerHeight;D=LITE?.5:Math.min(1.5,devicePixelRatio||1);cv.width=Math.round(W*D);cv.height=Math.round(H*D);cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',size);size();

/* ---- colour: two tones from the planet's still, turned a little at each section ---- */
let HI=[220,140,110],LO=[60,40,70];
function rgb2hsl([r,g2,b]){r/=255;g2/=255;b/=255;const mx=Math.max(r,g2,b),mn=Math.min(r,g2,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g2-b)/d+(g2<b?6:0):mx===g2?(b-r)/d+2:(r-g2)/d+4;h/=6}return [h,s,l]}
function hsl2rgb([h,s,l]){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return 255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))};return [f(0),f(8),f(4)]}
const TURN=[0,.075,-.06,.13,-.11,.04,.19,-.16];
function tone(base,gi,ds,dl){const h=rgb2hsl(base);return hsl2rgb([(h[0]+TURN[gi%TURN.length]+1)%1,Math.min(1,h[1]*ds),Math.max(.04,Math.min(.92,h[2]*dl))])}
/* muted planets (a murky river world) still need gas that reads: the bright tone keeps some colour and light */
function lift(c,smin,lmin){const h=rgb2hsl(c);return hsl2rgb([h[0],Math.max(smin,h[1]),Math.max(lmin,h[2])])}
function pal(gi){return {hi:lift(tone(HI,gi,1.15,1.05),.32,.56),lo:tone(LO,gi,1.25,1),mid:hsl2rgb((h=>[(h[0]+TURN[gi%TURN.length]+.035)%1,Math.min(1,h[1]*.9),h[2]*.7])(rgb2hsl(HI))),deep:tone(LO,gi,1,.32)}}

/* ---- noise ---- */
function noise(seed){const P=new Float32Array(1024);let s=seed*9301+49297;for(let i=0;i<1024;i++){s=(s*16807)%2147483647;P[i]=s/2147483647}
 const hs=(i,j)=>P[((i*73+j*151)%1024+1024)%1024],sm=t=>t*t*(3-2*t);
 const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j),a=hs(i,j),b=hs(i+1,j),c=hs(i,j+1),d=hs(i+1,j+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
 return (x,y,o=5)=>{let v=0,a=.5,n=0;for(let k=0;k<o;k++){v+=a*vn(x,y);n+=a;x=x*2.02+3.1;y=y*2.02+1.7;a*=.5}return v/n}}
/* one layer: a shape (where the gas may be) times warped noise (how it lies), coloured between two tones */
const SHAPE={
 cloud:(u,v)=>Math.exp(-(u*u+v*v)*2.6),
 wisp:(u,v)=>Math.exp(-(u*u*1.4+v*v*3.2)*2),
 veil:(u,v)=>Math.exp(-v*v*9)*Math.min(1,(1-Math.abs(u))*3),
 shell:(u,v)=>{const r=Math.hypot(u,v);return Math.exp(-Math.pow((r-.52)/.13,2))},
 lobes:(u,v)=>Math.exp(-(u*u/.16+Math.pow((Math.abs(v)-.48)/.36,2))),
 halo:(u,v)=>Math.exp(-(u*u+v*v)*1.4)};
function layer(seed,shape,c1,c2,opt){const w=Math.round(RES*(opt.ax||1)),h=RES,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),n=noise(seed),sh=SHAPE[shape];
 const sc=opt.scale||3,ridge=opt.ridge||0,gain=opt.gain||1;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=(i/w)*2-1,v=(j/h)*2-1;
  /* every layer fades to nothing well inside its own square, so no edge or corner of it can show when it turns */
  const nb=n(u*1.15+7.3,v*1.15+2.9,3),wk=shape==='veil'?1:1+(nb-.5)*1.1   /* the warp may shrink the blob, but the window below never lets gas reach the square's edge */,uu=u*wk,vv=v*wk;
  const win=shape==='veil'?Math.min(1,Math.max(0,(1-Math.abs(u))/.35))*Math.min(1,Math.max(0,(1-Math.abs(v))/.45)):(r=>{const t=Math.max(0,Math.min(1,(.96-r)/.42));return t*t*(3-2*t)})(Math.max(Math.hypot(uu,vv),Math.hypot(u,v)*1.04+.02));
  const m=sh(uu,vv)*win*win;const k=(j*w+i)*4;if(m<.01){im.data[k+3]=0;continue}
  const X=i/h*sc,Y=j/h*sc,q=n(X+5.2,Y+1.3,4),r=n(X+q*2.4+1.7,Y+q*2.4+9.2,4);let f=n(X+r*2.2,Y+r*2.2,5);
  if(ridge)f=f*(1-ridge)+ridge*Math.pow(1-Math.abs(r*2-1),3);
  const d=Math.max(0,Math.min(1,(f-.36)*2.6))*m*gain,t=Math.min(1,f*1.3);
  for(let ch=0;ch<3;ch++)im.data[k+ch]=Math.min(255,c2[ch]+(c1[ch]-c2[ch])*t);im.data[k+3]=Math.round(Math.min(1,d)*255)}
 x.putImageData(im,0,0);return c}

/* ---- the forms ---- */
const MIN=()=>Math.max(Math.min(W,H),Math.max(W,H)*.6);
const FSEED=[...(location.pathname.split('/').pop()||'x')].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);   // each study its own gas
function plan(gi){const p=pal(gi),sd=gi*101+7+FSEED*17,L=[];
 if(STYLE==='drift'){
  L.push({c:['cloud',p.lo,p.deep,{scale:2.2}],s:1.55,rot:.004,a:.85});
  L.push({c:['wisp',p.hi,p.lo,{scale:3.4,ridge:.5}],s:1.15,rot:-.007,a:.75});
  if(!LITE)L.push({c:['cloud',p.hi,p.mid,{scale:4.6,ridge:.7,gain:.8}],s:.8,rot:.011,a:.6});}
 else if(STYLE==='veils'){
  const n=LITE?3:5;for(let k=0;k<n;k++)L.push({c:['veil',k%2?p.hi:p.mid,k%2?p.lo:p.deep,{ax:2.6,scale:3,ridge:k%2?.55:.2}],veil:true,y:-.32+.64*k/(n-1)+(k%2?.05:-.04),s:1.9+.3*(k%3),v:(k%2?-1:1)*(6+k*3.5),a:.55+.1*(k%2)});}
 else{ // core
  L.push({c:['halo',p.deep,p.lo,{scale:2,gain:.7}],s:1.7,rot:.002,a:.7});
  L.push({c:['lobes',p.lo,p.mid,{scale:3,ridge:.4}],s:1.25,rot:.006,a:.85,axis:true});
  L.push({c:['shell',p.hi,p.lo,{scale:5,ridge:.6}],s:.7,rot:-.01,a:.85});
  if(!LITE)L.push({c:['lobes',p.hi,p.lo,{scale:5.5,ridge:.8,gain:.8}],s:1.05,rot:.006,a:.5,axis:true});}
 L.forEach((l,k)=>{l.seed=sd+k*13;l.ph=k*1.7});return {gi,p,L,ready:false}}
const sets={},queue=[];
function want(gi){if(sets[gi])return sets[gi];const s=sets[gi]=plan(gi);queue.push(s);pump();return s}
let pumping=false;function pump(){if(pumping)return;pumping=true;(function step(){const s=queue[0];if(!s){pumping=false;return}
  const l=s.L.find(l=>!l.img||(!LITE&&!l.img2));if(!l){s.ready=true;queue.shift();setTimeout(step,30);return}
  if(!l.img)l.img=layer(l.seed,...l.c);else l.img2=layer(l.seed+500,...l.c);setTimeout(step,16)})()}

/* ---- the section in hand, read from the page's own label ---- */
function secOf(){const t=(document.getElementById('where')||{}).textContent||'';const i=(DATA.gname||[]).indexOf(t);return i<0?0:i}
let cur=null,prev=null,mix=1,shift=0;HI=HI;
let pend=null;
function setSec(gi){if(cur&&cur.gi===gi){pend=null;return}const s=want(gi);if(!cur){cur=s;mix=1;return}
 if(!s.ready||(prev&&mix<1)){pend=s;return}      // keep the gas in hand until the next has formed and any exchange has finished
 prev=cur;cur=s;mix=0;pend=null;want(gi+1)}
const XF=9;   // seconds for one gas to give way to the next
const ez=x=>x*x*(3-2*x);

/* ---- drawing ---- */
let last=performance.now(),T=0,frameL=0,axis=0,axisT=0;
function drawSet(s,alpha,t){if(!s||!s.ready||alpha<=0)return;const m=MIN(),cx=W/2,cy=H/2,br=(1+.035*Math.sin(t*.21))*(s.sc||1);
 for(const l of s.L){const A=alpha*l.a;g.save();
  if(l.veil){const w=W*l.s,h=w/2.6,x=((t*l.v+l.ph*W*.37)%(W+w)+W+w)%(W+w)-w*.5,y=cy+l.y*H;g.globalAlpha=A;g.translate(0,y);g.drawImage(l.img,x-w/2,-h/2,w,h);g.drawImage(l.img,x-w/2-(W+w),-h/2,w,h);
   if(l.img2){g.globalAlpha=A*(.5+.5*Math.sin(t*.06+l.ph));g.drawImage(l.img2,x-w/2,-h/2,w,h);g.drawImage(l.img2,x-w/2-(W+w),-h/2,w,h)}g.restore();continue}
  const S=m*l.s*br;g.translate(cx+Math.sin(t*.031+l.ph)*m*.03,cy+Math.cos(t*.027+l.ph)*m*.025);g.rotate((reduce?0:t*l.rot)+(l.axis?axis:0)+l.ph);
  g.globalAlpha=A;g.drawImage(l.img,-S/2,-S/2,S,S);
  if(l.img2){g.globalAlpha=A*(.5+.5*Math.sin(t*.07+l.ph));g.drawImage(l.img2,-S/2,-S/2,S,S)}g.restore()}
 if(STYLE==='core'){const r=m*(.05+.006*Math.sin(t*1.3)),c=s.p.hi.map(Math.round).join(','),gr=g.createRadialGradient(cx,cy,0,cx,cy,r*4);
  gr.addColorStop(0,`rgba(255,250,240,${.95*alpha})`);gr.addColorStop(.12,`rgba(${c},${.6*alpha})`);gr.addColorStop(1,`rgba(${c},0)`);g.globalAlpha=1;g.fillStyle=gr;g.fillRect(cx-r*4,cy-r*4,r*8,r*8)}}
function tint(s,alpha){if(!s)return;const c=s.p.deep.map(Math.round).join(','),gr=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.hypot(W,H)*.7);
 gr.addColorStop(0,`rgba(${c},${.2*alpha})`);gr.addColorStop(.6,`rgba(${c},${.13*alpha})`);gr.addColorStop(1,`rgba(${c},${.1*alpha})`);g.globalAlpha=1;g.fillStyle=gr;g.fillRect(0,0,W,H)}
const FRAMED=document.documentElement.classList.contains('framed')||(window.parent!==window&&/[#?&]frame/.test(location.href));   // the page drops its #frame on arrival, but marks <html> framed
let fadeIn=FRAMED?.35:0,told=false;
function frame(now){requestAnimationFrame(frame);if(LITE&&now-frameL<40)return;frameL=now;const dt=Math.min(.1,(now-last)/1000);last=now;if(!reduce)T+=dt;
 setSec(secOf());if(!cur||!cur.ready)return;
 if(pend&&pend.ready&&!(prev&&mix<1))setSec(pend.gi);
 if(mix<1)mix=Math.min(1,mix+dt/XF);if(mix>=1)prev=null;const e=ez(mix);if(prev)prev.sc=1+.1*e;cur.sc=prev?.94+.06*e:1;fadeIn=Math.min(1,fadeIn+dt/3);if(FRAMED&&!told&&fadeIn>.55){told=true;try{parent.postMessage({tc:'planetReady'},'*')}catch(_){}}
 if(STYLE==='core'){const target=cur.gi*.9;axis+=(target-axis)*Math.min(1,dt*.4)}
 g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);g.globalCompositeOperation='source-over';
 tint(prev,(1-e)*fadeIn);tint(cur,e*fadeIn);
 g.globalCompositeOperation='screen';drawSet(prev,(1-e)*fadeIn,T);drawSet(cur,e*fadeIn,T);g.globalCompositeOperation='source-over'}
/* the tones come from the planet's still once it has loaded */
const st=document.getElementById('arrive');
function start(){try{const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(st,0,0,40,40);const d=x.getImageData(0,0,40,40).data,px=[];
  for(let i=0;i<d.length;i+=4)if(d[i+3]>220)px.push([d[i],d[i+1],d[i+2],d[i]*.3+d[i+1]*.59+d[i+2]*.11]);px.sort((a,b)=>a[3]-b[3]);
  const avg=a=>{const s=[0,0,0];a.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2]});return s.map(v=>v/Math.max(1,a.length))};
  if(px.length>20){HI=avg(px.slice(Math.floor(px.length*.7)));LO=avg(px.slice(0,Math.floor(px.length*.45)))}}catch(_){}
 want(0);requestAnimationFrame(frame);setTimeout(()=>{(DATA.gname||[]).forEach((_,i)=>want(i))},2500)}
if(st&&st.complete&&st.naturalWidth)start();else if(st){st.addEventListener('load',start);st.addEventListener('error',start)}else start();
})();
</script>
