html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d5cc;margin-bottom:.9em;text-shadow:0 0 10px #05060a,0 0 4px #05060a,0 0 2px #05060a,0 0 1px #000}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   A calm  the same live planet, drawn at lower resolution and 30 frames a second, slower turning, a still sky, no blur
   B still the planet as a still image, the passage beneath it, one passage at a time with a soft crossfade
   C read  no motion at all: the study as one scrolling column under a small still planet

(function(){

let W=0,H=0,D=1,stars=[],t0=performance.now(),seed=7;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
function build(){W=innerWidth;H=innerHeight;D=Math.min(2,devicePixelRatio||1);c.width=W*D;c.height=H*D;seed=7;stars=[];
 const n=Math.round(W*H/900);
 for(let i=0;i<n;i++){// more stars along a diagonal band
  let x=rnd()*W,y=rnd()*H;if(rnd()<.45){const u=rnd();x=u*W;y=H*(.15+.55*u)+(rnd()+rnd()+rnd()-1.5)*H*.12}
  const m=rnd();stars.push({x,y,r:m<.97?.35+rnd()*.55:1+rnd()*.9,a:.25+rnd()*.7,ph:rnd()*6.28,sp:.4+rnd()*1.4,warm:rnd()<.18})}}
function draw(now){const t=(now-t0)/1000;g.setTransform(D,0,0,D,0,0);g.fillStyle='#05060a';g.fillRect(0,0,W,H);
 // the band: a few soft clouds along the diagonal
 for(let i=0;i<7;i++){const u=i/6,x=u*W,y=H*(.15+.55*u),R=Math.max(W,H)*.22;const gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,'rgba(120,128,150,.07)');gr.addColorStop(1,'rgba(120,128,150,0)');g.fillStyle=gr;g.fillRect(x-R,y-R,R*2,R*2)}

 const k=still?0:t*.05,ga=g.createLinearGradient(0,H,0,H*.68);const m=.5+.5*Math.sin(k);
 ga.addColorStop(0,'rgba('+Math.round(26+50*m)+','+Math.round(110-60*m)+','+Math.round(80+40*m)+',.20)');ga.addColorStop(1,'rgba(20,60,50,0)');g.fillStyle=ga;g.fillRect(0,H*.68,W,H*.32);

  if(s.r>1){const gr=g.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);gr.addColorStop(0,g.fillStyle);gr.addColorStop(1,'rgba(238,241,255,0)');g.fillStyle=gr;g.beginPath();g.arc(s.x,s.y,s.r*4,0,6.283);g.fill()}
  else{g.beginPath();g.arc(s.x,s.y,s.r,0,6.283);g.fill()}}

document.getElementById('toastB').addEventListener('click',e=>{e.stopPropagation();document.getElementById('toast').classList.remove('on');resumed=0;jump(0)});
/* the end of a study (v2): read again, go on to the next study in the issue, or return to the sky */
let ended=false;const SIBS=(DATA.__sibs||[]);
function endCard(){ended=true;const c=cur();if(c)release(c);try{localStorage.removeItem(POSKEY);const seen=JSON.parse(localStorage.getItem('tcSeen')||'[]');if(!seen.includes(FILE)){seen.push(FILE);localStorage.setItem('tcSeen',JSON.stringify(seen))}}catch(_){}
 document.getElementById('endt').textContent=DATA.__title;const i=SIBS.findIndex(s=>s[1]===FILE),nx=i>=0?SIBS[i+1]:null,b=document.getElementById('eNext');
 if(nx){b.hidden=false;b.querySelector('b').textContent=nx[0];b.onclick=e=>{e.stopPropagation();SND.fade();if(FRAMED){try{parent.postMessage({tc:'planetNext',key:nx[1]},'*')}catch(_){}}else location.href=nx[1]+'#arrive&v2'}}else b.hidden=true;
 document.getElementById('endc').classList.add('on')}
function hideEnd(){ended=false;document.getElementById('endc').classList.remove('on')}
document.getElementById('eAgain').addEventListener('click',e=>{e.stopPropagation();hideEnd();jump(0)});
document.getElementById('eSky').addEventListener('click',e=>{e.stopPropagation();leaveSky(e)});
if(V2){let sx=null,sy=0;addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
 addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){if(!started)begin();dx<0?next():back()}},{passive:true})}
if(FRAMED&&GO)setTimeout(()=>begin(),60);

/* leaving for the sky: in a frame, the index closes it and zooms back out; on its own, the index opens zoomed in and pulls back */
let gone=false;
function leaveSky(e){if(e)e.preventDefault();if(gone)return;gone=true;SND.fade();document.body.classList.add('leaving');
 if(FRAMED){try{parent.postMessage({tc:'planetClose'},'*')}catch(_){};return}
 let back='index.html';try{back=sessionStorage.getItem('tcReturn')||back;sessionStorage.setItem('tcBack',location.pathname.split('/').pop())}catch(_){}
 setTimeout(()=>{location.href=back+'#issues'},560)}
document.querySelector('#top a').addEventListener('click',leaveSky);
addEventListener('keydown',e=>{if(e.key==='Escape'&&FRAMED)leaveSky(e)});
addEventListener('pageshow',ev=>{if(ev.persisted){gone=false;document.body.classList.remove('leaving')}});
const bs=document.getElementById('bSnd');bs.addEventListener('click',e=>{e.stopPropagation();if(!started){begin();return}bs.textContent=SND.toggle()?'Sound on':'Sound off'});
window.__planet={next,back,state:()=>({T,live:live.map(l=>[l.k,l.slot]),intro}),seek:k=>{live=[];T+=20;spawn(k)},pose:(k,tau,sp)=>{intro=1;started=true;document.getElementById('begin').classList.add('gone');frozen=true;live=[];spawn(k);cur().t0=T-tau;if(sp!=null)spin=sp}};
(document.fonts&&document.fonts.load?Promise.all(["40px 'TeX Gyre Pagella'","italic 40px 'TeX Gyre Pagella'","40px 'Liberation Mono'"].map(f=>document.fonts.load(f))):Promise.resolve()).then(()=>requestAnimationFrame(t=>{last=t;frame(t)}));

<style>

#mob .col .sec{margin:3.2em 0 1.6em;color:#ee4a64}
#mob .col .p{margin:0 auto 2.6em;max-width:34em;opacity:1;transition:opacity 1.2s ease}#mob .col .p.dim{opacity:.25}
#mob .col .p .n{color:#7d7b75;margin-bottom:.7em}
#mob .col .p .tx{font-size:18px}

<script>
(function(){const MODE=window.__MOBALT;if(!MODE)return;
const strip=h=>h.replace(/<[^>]+>/g,'').replace(/&#8217;/g,'’').replace(/&amp;/g,'&');
const ITEMS=[{title:true,words:10}];
DATA.beats.forEach(b=>{const sg=DATA.seg.find(s=>s.k==='beat'&&s.i===b.i),an=DATA.annot[String(b.i)]||{};ITEMS.push({i:b.i,name:strip((DATA.names||{})[String(b.i)]||''),text:strip(b.html),words:b.words,label:DATA.gname[sg?sg.g:0],tags:(an.tags||[]).map(([k,l])=>[k,strip(l)]),does:an.does?strip(an.does):null})});
const FILE=location.pathname.split('/').pop()||'',POSKEY='tcPos:'+FILE,HREF=location.href;
const FRAMED=window.parent!==window&&/[#?&]frame/.test(HREF),GO=/[#?&]go\b/.test(HREF),PNUM=+((HREF.match(/[#?&]p(\d+)\b/)||[])[1]||0);
const SIBS=DATA.__sibs||[],ROOT=146.83,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STILL=(document.getElementById('arrive')||{}).src||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secStart=k=>{const it=ITEMS[k];return it.title||k===1||(ITEMS[k-1]&&!ITEMS[k-1].title&&ITEMS[k-1].label!==it.label)};
function passHTML(it,withLabel){
 if(it.title)return `<div class="ttl"><div class="lb mono">Temporary Custody · ${esc(DATA.__issue)}</div><div class="tx">${esc(DATA.__title)}<span class="dk">${esc(DATA.__deck||'')}</span></div></div>`;
 return (withLabel?`<div class="lb mono">${esc(it.label)}</div>`:'')+`<div class="tx">${esc(it.text)}</div>`+
  (it.tags.length?`<div class="chips">${it.tags.map(([k,l])=>`<span class="chip k${k}">${esc(l)}</span>`).join('')}</div>`:'')+
  (it.does?`<div class="does"><b>Does</b>${esc(it.does)}</div>`:'')}
function save(k){try{localStorage.setItem(POSKEY,String(k))}catch(_){}}
function seen(){try{localStorage.removeItem(POSKEY);const s=JSON.parse(localStorage.getItem('tcSeen')||'[]');if(!s.includes(FILE)){s.push(FILE);localStorage.setItem('tcSeen',JSON.stringify(s))}}catch(_){}}
function resumeAt(){if(PNUM){const j=ITEMS.findIndex(it=>it.i===PNUM);if(j>0)return j}let s=0;try{s=+(localStorage.getItem(POSKEY)||0)}catch(_){}return s>1&&s<ITEMS.length-1?s:0}
let left=false;function toSky(e){if(e)e.preventDefault();if(left)return;left=true;snd.fade();
 if(FRAMED){try{parent.postMessage({tc:'planetClose'},'*')}catch(_){}return}location.href='index.html#issues'}
function nextStudy(){const i=SIBS.findIndex(s=>s[1]===FILE);return i>=0?SIBS[i+1]:null}
function goNext(nx){snd.fade();if(FRAMED){try{parent.postMessage({tc:'planetNext',key:nx[1]},'*')}catch(_){}}else location.href=nx[1]+'#v2'}
function ready(){let n=0;(function f(){if(++n<3)return requestAnimationFrame(f);if(FRAMED)try{parent.postMessage({tc:'planetReady'},'*')}catch(_){}})()}
addEventListener('keydown',e=>{if(e.key==='Escape')toSky()});

/* sound: a low open fifth in the study's key and a soft bell for each passage; no noise */
const snd=(()=>{let ac=null,m=null,on=true;
 function start(){if(ac)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;try{ac=new A()}catch(_){return}m=ac.createGain();m.gain.value=0;m.connect(ac.destination);m.gain.setTargetAtTime(on?.9:0,ac.currentTime,1.2);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;const bg=ac.createGain();bg.gain.value=.05;lp.connect(bg);bg.connect(m);
  [[ROOT/2,1],[ROOT*.75,.55],[ROOT,.25]].forEach(([f,a],i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.detune.value=(i-1)*4;g.gain.value=a;o.connect(g);g.connect(lp);o.start();
   const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=.05+i*.03;lg.gain.value=a*.35;l.connect(lg);lg.connect(g.gain);l.start()})}
 const PENT=[1,9/8,5/4,3/2,5/3,2];
 function bell(k){if(!ac||!on)return;const t=ac.currentTime+.05,f=ROOT*2*PENT[(k*3)%PENT.length];
  [[f,.05,2.8],[f*2.01,.012,1.4]].forEach(([fr,a,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.1)})}
 function toggle(){on=!on;if(!ac)start();else m.gain.setTargetAtTime(on?.9:0,ac.currentTime,.4);return on}
 function fade(){if(ac)m.gain.setTargetAtTime(0,ac.currentTime,.2)}
 return {start,bell,toggle,fade,get on(){return on},get ac(){return ac}}})();

const root=document.createElement('div');root.id='mob';document.body.appendChild(root);
const bar=`<div class="bar"><a href="index.html#issues" class="mono back">‹ Temporary Custody</a><span class="mono iss">${esc(DATA.__issue||'')}</span></div>`;

if(MODE==='C'){
 /* the reader: everything in one column, nothing moves but the page */
 let h=bar+`<div class="col"><div class="hd">${STILL?`<img alt="" src="${STILL}">`:''}${passHTML(ITEMS[0])}</div>`;
 ITEMS.forEach((it,k)=>{if(it.title)return;if(secStart(k))h+=`<div class="sec mono">${esc(it.label)}</div>`;
  h+=`<div class="p${reduce?'':' dim'}" data-k="${k}">${it.i?`<div class="n mono">¶${it.i}${it.name?' · '+esc(it.name):''}</div>`:''}${passHTML(it,false)}</div>`});
 const nx=nextStudy();
 h+=`<div class="endp" id="mEnd"><div class="k mono">End of the study</div>${nx?`<button type="button" id="mNext">Next study<b>${esc(nx[0])}</b></button>`:''}<button type="button" id="mSky">Back to the sky</button></div></div>`;
 root.innerHTML=h;root.querySelector('.back').addEventListener('click',toSky);root.querySelector('#mSky').addEventListener('click',toSky);
 if(nx)root.querySelector('#mNext').addEventListener('click',()=>goNext(nx));
 const ps=[...root.querySelectorAll('.p')];
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('dim')}}),{root,rootMargin:'0px 0px -12% 0px'});ps.forEach(p=>io.observe(p));
 const endIO=new IntersectionObserver(es=>{if(es[0].isIntersecting)seen()},{root});endIO.observe(root.querySelector('#mEnd'));
 let st=0;root.addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{const y=root.scrollTop+innerHeight*.3;let k=0;for(const p of ps){if(p.offsetTop<=y)k=+p.dataset.k;else break}save(k)},300)},{passive:true});
 const r=resumeAt();if(r){const p=ps.find(p=>+p.dataset.k===r);if(p)requestAnimationFrame(()=>{root.scrollTop=p.offsetTop-innerHeight*.18;p.classList.remove('dim')})}
 ready();return}

/* B and D: one passage at a time, crossfading */
root.innerHTML=bar+(STILL?`<img class="pl" alt="" src="${STILL}">`:'')+`<div class="pass" aria-live="polite"></div>`+
 `<div class="foot"><div class="prog"><div class="base"></div></div><div class="ctl mono"><button type="button" id="mBack">‹ Back</button><button type="button" id="mPause">Pause</button><button type="button" id="mNext">Next ›</button><button type="button" id="mSnd">Sound on</button></div></div>`+
 `<div class="gate"><button type="button" class="mono" id="mGo">Tap to begin, with sound</button><button type="button" class="mono q" id="mQuiet">or read in silence</button></div>`;
const pl=root.querySelector('.pl'),pass=root.querySelector('.pass'),prog=root.querySelector('.prog'),TK=[];
ITEMS.forEach((it,k)=>{const t=document.createElement('i');t.style.left=(k/(ITEMS.length-1)*100)+'%';if(secStart(k))t.className='g';prog.appendChild(t);TK.push(t)});
prog.addEventListener('click',e=>{const r=prog.getBoundingClientRect();show(Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(ITEMS.length-1)),true)});
function layout(){const W=innerWidth,H=innerHeight;
 if(MODE==='B'){const S=Math.min(W*.62,H*.3,300);if(pl)Object.assign(pl.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H*.1)+'px'});
  const top=H*.1+S+22;Object.assign(pass.style,{top:top+'px',bottom:'92px'})}
 else{const S=Math.max(W*2.3,H*1.1),vis=Math.min(H*.24,S*.2);if(pl)Object.assign(pl.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H-vis)+'px'});
  Object.assign(pass.style,{top:'64px',bottom:(vis+20)+'px',display:'flex',flexDirection:'column'})}}
addEventListener('resize',layout);layout();
let k=-1,timer=null,paused=false,started=false,ended=false;
const holdOf=it=>it.title?7:Math.min(26,4.5+it.words*.3);
function center(){/* the passage sits in the middle of its space unless it is too long, then it scrolls from the top */
 if(MODE==='D'){const inner=pass.firstElementChild;if(inner)inner.style.margin=pass.scrollHeight>pass.clientHeight+2?'0':'auto 0'}
 else{const inner=pass.firstElementChild;if(inner){inner.style.marginTop='0';const room=pass.clientHeight-inner.offsetHeight;inner.style.marginTop=room>0?(room*.35)+'px':'0'}}}
function show(j,user){if(j<0||j>=ITEMS.length)return;if(ended)ended=false;k=j;save(j);clearTimeout(timer);
 TK.forEach((t,i)=>t.classList.toggle('cur',i===j));
 pass.classList.add('out');setTimeout(()=>{pass.innerHTML=`<div>${passHTML(ITEMS[j],true)}</div>`;pass.scrollTop=0;center();pass.classList.remove('out');snd.bell(j)},reduce?0:user?450:900);
 schedule()}
function schedule(){clearTimeout(timer);if(paused||!started)return;timer=setTimeout(()=>{if(k>=ITEMS.length-1)end();else show(k+1)},(holdOf(ITEMS[k])+1)*1000)}
function end(){ended=true;seen();const nx=nextStudy();pass.classList.add('out');
 setTimeout(()=>{pass.innerHTML=`<div class="endp"><div class="k mono">End of the study</div><div class="tx">${esc(DATA.__title)}</div><button type="button" id="eA">Read again</button>${nx?`<button type="button" id="eN">Next study<b>${esc(nx[0])}</b></button>`:''}<button type="button" id="eS">Back to the sky</button></div>`;center();pass.classList.remove('out');
  pass.querySelector('#eA').onclick=()=>show(0,true);pass.querySelector('#eS').onclick=toSky;if(nx)pass.querySelector('#eN').onclick=()=>goNext(nx)},reduce?0:900)}
function begin(withSound){if(started)return;started=true;root.querySelector('.gate').classList.add('gone');
 if(withSound)snd.start();else{snd.toggle();root.querySelector('#mSnd').textContent='Sound off'}
 const r=resumeAt();show(r);}
root.querySelector('#mGo').onclick=()=>begin(true);root.querySelector('#mQuiet').onclick=()=>begin(false);
root.querySelector('.back').addEventListener('click',toSky);
root.querySelector('#mNext').onclick=()=>{if(!started)begin(true);else if(k>=ITEMS.length-1)end();else show(k+1,true)};
root.querySelector('#mBack').onclick=()=>{if(!started)begin(true);else show(Math.max(0,k-1),true)};
root.querySelector('#mPause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';schedule()};
root.querySelector('#mSnd').onclick=e=>{e.target.textContent=snd.toggle()?'Sound on':'Sound off'};
let sx=null,sy=0;root.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
root.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){if(!started){begin(true);return}if(dx<0){if(k>=ITEMS.length-1)end();else show(k+1,true)}else show(Math.max(0,k-1),true)}},{passive:true});
/* before beginning, the title sits under the gate */
pass.innerHTML=`<div>${passHTML(ITEMS[0],true)}</div>`;requestAnimationFrame(center);
if(FRAMED&&GO)setTimeout(()=>begin(true),60);
ready();
})();
</script>
