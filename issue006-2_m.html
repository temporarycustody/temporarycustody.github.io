html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d5cc;margin-bottom:.9em;text-shadow:0 0 10px #05060a,0 0 4px #05060a,0 0 2px #05060a,0 0 1px #000}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   S calm still  as A, but the planet is its still picture: no shader, no turning

<script>
const DATA={"intro": [], "beats": [{"i": 1, "html": "The novel describes Patrick Bateman’s morning routine across an extended early sequence. The toner, the exfoliant, the sequence of applications, the brand names listed with the neutrality of a <span class=\"mo\" data-k=\"comp\">pharmacopoeia</span>.", "words": 30}, {"i": 2, "html": "The prose moves through the products at the same pace it will later move through a restaurant meal, a business meeting, an act of violence. <span class=\"mo\" data-k=\"comp\">The reader follows</span>.", "words": 28}, {"i": 3, "html": "The novel conditions the reader into the catalogue’s assumptions <span class=\"mo\" data-k=\"guar\">before those assumptions become visible</span> as assumptions.", "words": 16}, {"i": 4, "html": "The catalogue, the brand names, the restaurants, all of it’s real. The conventions of the world Bateman moves through are the conventions of a world that exists, and the reader comes to the novel already <span class=\"mo\" data-k=\"comp\">half-organized</span> by them, because the reader inhabits a world in which those conventions have purchase.", "words": 50}, {"i": 5, "html": "The novel doesn’t have to teach the reader the language. It only has to sustain the register long enough for the reader to notice, <span class=\"mo\" data-k=\"guar\">too late</span>, what the register has been doing.", "words": 32}, {"i": 6, "html": "<span class=\"mo\" data-k=\"actor\">The catalogue constitutes the world Bateman moves through</span>. A world organized entirely through brand names, product specifications, restaurant rankings, and the calibration of social status has no beneath to those categories at all.", "words": 38}, {"i": 7, "html": "<span class=\"mo\" data-k=\"actor\">The Valentino jacket is Bateman’s wealth</span>, his position, his presence in the field.", "words": 19}, {"i": 8, "html": "When Bateman pulls out his new business card and invites comparison, Van Patten’s eggshell card with Romalian type is better. Price’s raised lettering pale nimbus white card is better still. Then there’s <span class=\"mo\" data-k=\"comp\">Montgomery’s</span>, with its subtle off-white colouring and tasteful thickness. Bateman’s card ends the scene lying on the table next to an orchid in a blue glass vase (the vase getting more careful attention than most of the people in the room). The crisis is real because the card is real. And the reader has been reading the catalogue before violence first appears in it.", "words": 96}, {"i": 9, "html": "The <span class=\"mo\" data-k=\"actor\">violence arrives in the catalogue’s register</span>. The catalogue has organized the reader through its pace, its precision, its neutrality toward the object described.", "words": 24}, {"i": 10, "html": "When the violence appears in that prose, in that register, with that neutrality, the reader has <span class=\"mo\" data-k=\"guar\">no position outside the catalogue</span> from which to receive it differently. The language isn’t invented and the reader already speaks it.", "words": 37}, {"i": 11, "html": "When Ellis writes that a knife has a <span class=\"mo\" data-k=\"comp\">serrated blade</span> with the same declarative neutrality he applies to a Luciano Soprani jacket or an Interplak tooth polisher’s rpm, the register doesn’t shift, because nothing in the catalogue’s grammar permits it.", "words": 40}, {"i": 12, "html": "The reader has already accepted the register’s terms, because the reader accepted them on page one. The acceptance was <span class=\"mo\" data-k=\"actor\">the price of following along</span>.", "words": 24}, {"i": 13, "html": "Bateman narrates from inside a sealed interiority that his own narration can’t confirm. The prose gives the reader access to his consciousness, and his consciousness has nothing inside it, only the catalogue, the ranking, the performance. When he reaches for something beneath the performance, he finds <span class=\"mo\" data-k=\"guar\">the performance extending in every direction</span>.", "words": 52}, {"i": 14, "html": "He tells the reader directly that there is an idea of a Patrick Bateman, some kind of abstraction, but there is <span class=\"mo\" data-k=\"guar\">no real me</span>.", "words": 24}, {"i": 15, "html": "What the statement says is a confession of vacancy. What the statement does is more precise still. The statement is itself a catalogue entry, applying to his interiority the same neutral descriptive register the prose applies to the toner and the restaurant. <span class=\"mo\" data-k=\"actor\">The confession is in the catalogue’s form</span>, unable to take any other form because the catalogue is the only language available.", "words": 63}, {"i": 16, "html": "The world Bateman moves through occupies the second position. Its own limit mirrors his from the opposite direction. The world has <span class=\"mo\" data-k=\"guar\">no instrument for registering what is beneath the surface</span>, because it’s constituted entirely on the surface.", "words": 37}, {"i": 17, "html": "The colleagues don’t distinguish between Bateman and the others because the conventions of the world don’t require the distinction. <span class=\"mo\" data-k=\"actor\">Everyone performs the same performance</span>. The performance is the convention.", "words": 29}, {"i": 18, "html": "The world knows the card and the reservation and the tie. It has no category for what is underneath them, including whether there’s anything underneath them.", "words": 26}, {"i": 19, "html": "The novel’s third position is the reader, whom the catalogue organizes and who discovers the terms of that organization only gradually. The discovery comes <span class=\"mo\" data-k=\"guar\">too late to be useful</span>.", "words": 29}, {"i": 20, "html": "By the time the reader can name what the catalogue has been doing, applying the same register to violence as to brand names, producing a continuity between the product and the atrocity, the reader has spent the whole novel inside that continuity.", "words": 42}, {"i": 21, "html": "The fourth position is the novel itself, writing from Ellis’s specific situational pressure. That pressure is the late 1980s Manhattan world in which a failed reservation at Dorsia produces sweating palms, trembling fingers, and something the prose calls an <span class=\"mo\" data-k=\"comp\">adrenaline rush</span>.", "words": 41}, {"i": 22, "html": "The catalogue is the language in which this world actually runs. The position forecloses direct moral statement, because direct moral statement would require the kind of outside position the novel’s formal apparatus has demonstrated is unavailable.", "words": 43}, {"i": 23, "html": "<span class=\"mo\" data-k=\"actor\">The novel never steps outside the catalogue</span> to condemn it. <span class=\"mo\" data-k=\"reg\">The catalogue is the only language the novel leaves itself</span>.", "words": 20}, {"i": 24, "html": "The formal flatness of the prose is the formal trace of a position that has understood what it would cost to apply a different register. The position has applied the catalogue’s register as the only honest instrument it makes available.", "words": 40}, {"i": 25, "html": "Held together, the novel’s four positions reveal something none of them can say alone, the novel’s real finding. A world organized entirely through the catalogue produces a specific epistemic condition. In that condition the distinction between the product and the atrocity <span class=\"mo\" data-k=\"actor\">can’t be maintained from inside the catalogue’s own terms</span>.", "words": 50}, {"i": 26, "html": "The reader holds this as <span class=\"mo\" data-k=\"reg\">a structural fact</span> about what the reading produced. By the time the first sustained violence appears, violence has arrived in the same prose as the exfoliant and the reservation.", "words": 34}, {"i": 27, "html": "The film places the viewer outside Bateman’s interiority through the camera’s flatness. The novel places the reader inside the catalogue’s assumptions through sustained immersion. <span class=\"mo\" data-k=\"reg\">The distance the film maintains is real and insufficient</span>. <span class=\"mo\" data-k=\"actor\">The proximity the novel produces is irreversible</span>.", "words": 40}, {"i": 28, "html": "The novel ends where it began, in the catalogue, in the performance, in the sealed interiority that narrates everything and confirms nothing.", "words": 22}, {"i": 29, "html": "The final words are a sign above a door in Harry’s bar, observed in the last sentence. <span class=\"mo\" data-k=\"guar\">THIS IS NOT AN EXIT</span>.", "words": 31}, {"i": 30, "html": "The world’s décor carries that toward which the novel has been pressing. The catalogue doesn’t need the narrator to state what it knows. The catalogue <span class=\"mo\" data-k=\"actor\">has always known it from the surface</span>, and the surface is where the novel ends.", "words": 40}, {"i": 31, "html": "The reader is left inside the catalogue, holding the brand names, <span class=\"mo\" data-k=\"comp\">weightless</span>; the products, interchangeable; the register, indifferent to which is which; unable to find the position from which any of it could be put down.", "words": 36}, {"i": 32, "html": "That position doesn’t exist inside the novel’s field. The catalogue is the only language the novel has, the only language the world it constitutes has ever needed. The novel ends where it has always been. <span class=\"mo\" data-k=\"actor\">The reader ends there too</span>.", "words": 40}], "seg": [{"k": "beat", "i": 1, "g": 0}, {"k": "beat", "i": 2, "g": 0}, {"k": "beat", "i": 3, "g": 0}, {"k": "beat", "i": 4, "g": 0}, {"k": "beat", "i": 5, "g": 0}, {"k": "beat", "i": 6, "g": 0}, {"k": "beat", "i": 7, "g": 0}, {"k": "beat", "i": 8, "g": 0}, {"k": "beat", "i": 9, "g": 0}, {"k": "beat", "i": 10, "g": 0}, {"k": "beat", "i": 11, "g": 0}, {"k": "beat", "i": 12, "g": 0}, {"k": "beat", "i": 13, "g": 1}, {"k": "beat", "i": 14, "g": 1},   const l=s.L.find(l=>!l.img||(!LITE&&!l.img2));if(!l){s.ready=true;queue.shift();setTimeout(step,30);return}
