html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d5cc;margin-bottom:.9em;text-shadow:0 0 10px #05060a,0 0 4px #05060a,0 0 2px #05060a,0 0 1px #000}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   S calm still  as A, but the planet is its still picture: no shader, no turning
   N nebula  no planet: a slow nebula in the planet's colours behind the passage
   E eclipse  the planet as a dark disc with a lit rim, the passage beneath

<script>
const DATA={"intro": [], "beats": [{"i": 1, "html": "The court of Denmark is in session. Claudius has the throne.", "words": 11}, {"i": 2, "html": "He has taken his brother’s widow to wife, and he thanks the court for going along with it. <span class=\"q\" data-q=\"For all, our thanks.\">“For all, our thanks.”<\/span>", "words": 22}, {"i": 3, "html": "He dispatches Cornelius and Voltemand to the old King of Norway.", "words": 11}, {"i": 4, "html": "He settles Laertes’s petition. <span class=\"q\" data-q=\"Your leave and favour to return to France\">“Your leave and favour to return to France”<\/span>", "words": 12}, {"i": 5, "html": "Then he turns to Hamlet, his <span class=\"mo\" data-k=\"kin\">cousin and son<\/span>. <span class=\"q\" data-q=\"But now, my cousin Hamlet, and my son\">“But now, my cousin Hamlet, and my son”<\/span>", "words": 18}, {"i": 6, "html": "Everything in the scene proceeds as scenes of this kind proceed. The forms are being satisfied (whatever else is not).", "words": 20}, {"i": 7, "html": "Hamlet is there, in his mourning clothes. He hasn’t said a word.", "words": 12}, {"i": 8, "html": "The clothes are the visible sign of a position from which the court’s <span class=\"mo\" data-k=\"seeming\">fluency<\/span> can’t be entered.", "words": 17}, {"i": 9, "html": "Hamlet himself says the black can only seem. <span class=\"q\" data-q=\"they are actions that a man might play\">“they are actions that a man might play”<\/span>", "words": 16}, {"i": 10, "html": "His first words go to no one. <span class=\"q\" data-q=\"A little more than kin, and less than kind.\">“A little more than kin, and less than kind.”<\/span>", "words": 16}, {"i": 11, "html": "It’s the form of address open to a position for which the court scene has no room.", "words": 17}, {"i": 12, "html": "Alone with Hamlet, the Ghost names the murderer. <span class=\"q\" data-q=\"The serpent that did sting thy father’s life Now wears his crown.\">“The serpent that did sting thy father’s life Now wears his crown.”<\/span>", "words": 20}, {"i": 13, "html": "Hamlet asks to know it fast, so that he <span class=\"q\" data-q=\"May sweep to my revenge\">“May sweep to my revenge”<\/span>.", "words": 15}, {"i": 14, "html": "Later he doubts the Ghost. <span class=\"q\" data-q=\"The spirit that I have seen May be the devil\">“The spirit that I have seen May be the devil”<\/span>", "words": 15}, {"i": 15, "html": "He sets a play to test the King. <span class=\"q\" data-q=\"The play’s the thing\">“The play’s the thing”<\/span>", "words": 12}, {"i": 16, "html": "At the play the King rises. <span class=\"q\" data-q=\"Give me some light. Away.\">“Give me some light. Away.”<\/span>", "words": 11}, {"i": 17, "html": "Hamlet has his proof. <span class=\"q\" data-q=\"I’ll take the ghost’s word for a thousand pound.\">“I’ll take the ghost’s word for a thousand pound.”<\/span>", "words": 13}, {"i": 18, "html": "On the ship to England, he tells Horatio later, he rewrote the King’s commission. <span class=\"q\" data-q=\"I had my father’s signet in my purse\">“I had my father’s signet in my purse”<\/span>", "words": 22}, {"i": 19, "html": "In the play-within-the-play, with Rosencrantz and Guildenstern, on the ship, he’s capable of decisive action when the conditions for it are right.", "words": 22}, {"i": 20, "html": "What action would require hasn’t yet been constituted. The <span class=\"mo\" data-k=\"moment\">moment<\/span> that would justify the sword is still gathering itself somewhere ahead of him.", "words": 23}, {"i": 21, "html": "Not yet arrived. Not yet his.", "words": 6}, {"i": 22, "html": "Claudius is alone, attempting to pray.", "words": 6}, {"i": 23, "html": "He has already said he can’t. <span class=\"q\" data-q=\"Pray can I not\">“Pray can I not”<\/span>", "words": 10}, {"i": 24, "html": "He kneels anyway.", "words": 3}, {"i": 25, "html": "Hamlet enters and takes the kneeling for prayer. <span class=\"q\" data-q=\"Now might I do it pat, now he is praying.\">“Now might I do it pat, now he is praying.”<\/span>", "words": 18}, {"i": 26, "html": "He gives his reason. The King would <span class=\"q\" data-q=\"do this same villain send To heaven\">“do this same villain send To heaven”<\/span>", "words": 14}, {"i": 27, "html": "He doesn’t use the <span class=\"mo\" data-k=\"sword\">sword<\/span>. <span class=\"q\" data-q=\"Up, sword, and know thou a more horrid hent\">“Up, sword, and know thou a more horrid hent”<\/span>", "words": 15}, {"i": 28, "html": "He holds back for the reason he gives. That reason rests on the kneeling, and he can’t see what lies beneath it.", "words": 22}, {"i": 29, "html": "The <span class=\"mo\" data-k=\"moment\">moment<\/span> toward which he’s been pressing requires that the act be fully his, fully right.", "words": 16}, {"i": 30, "html": "Only after Hamlet has gone does the King say it. <span class=\"q\" data-q=\"My words fly up, my thoughts remain below.\">“My words fly up, my thoughts remain below.”<\/span>", "words": 18}, {"i": 31, "html": "<span class=\"q\" data-q=\"Words without thoughts never to heaven go.\">“Words without thoughts never to heaven go.”<\/span> The audience hears it. Hamlet doesn’t.", "words": 13}, {"i": 32, "html": "Holding the sword is the only authentic response when the conditions for the act haven’t been established.", "words": 17}, {"i": 33, "html": "By Act V the conditions have been established.", "words": 8}, {"i": 34, "html": "In the graveyard the grave-maker shows Hamlet a skull. <span class=\"q\" data-q=\"This same skull, sir, was Yorick’s skull, the King’s jester.\">“This same skull, sir, was Yorick’s skull, the King’s jester.”<\/span>", "words": 19}, {"i": 35, "html": "Hamlet knew him. <span class=\"q\" data-q=\"Alas, poor Yorick. I knew him, Horatio\">“Alas, poor Yorick. I knew him, Horatio”<\/span>", "words": 10}, {"i": 36, "html": "He asks Horatio whether Alexander looked like this in the earth. <span class=\"q\" data-q=\"And smelt so? Pah!\">“And smelt so? Pah!”<\/span>", "words": 15}, {"i": 37, "html": "He throws the skull down.", "words": 5}, {"i": 38, "html": "Every human pretension arrives here. Rank undone in the skull; flesh undone in the smell; grandeur undone in the dirt.", "words": 20}, {"i": 39, "html": "Osric brings word that the King has laid a wager on Hamlet against Laertes.", "words": 14}, {"i": 40, "html": "Hamlet admits a misgiving. <span class=\"q\" data-q=\"thou wouldst not think how ill all’s here about my heart\">“thou wouldst not think how ill all’s here about my heart”<\/span>", "words": 15}, {"i": 41, "html": "Horatio urges him to heed it. <span class=\"q\" data-q=\"If your mind dislike anything, obey it.\">“If your mind dislike anything, obey it.”<\/span>", "words": 13}, {"i": 42, "html": "Hamlet answers him. <span class=\"q\" data-q=\"Not a whit, we defy augury.\">“Not a whit, we defy augury.”<\/span>", "words": 9}, {"i": 43, "html": "<span class=\"q\" data-q=\"There’s a special providence in the fall of a sparrow.\">“There’s a special providence in the fall of a sparrow.”<\/span>", "words": 10}, {"i": 44, "html": "<span class=\"q\" data-q=\"if it be not now, yet it will come\">“if it be not now, yet it will come”<\/span>", "words": 9}, {"i": 45, "html": "<span class=\"q\" data-q=\"The readiness is all.\">“The readiness is all.”<\/span>", "words": 4}, {"i": 46, "html": "We defy augury. Not I. The subject is plural, as if Hamlet and the <span class=\"mo\" data-k=\"moment\">readiness<\/span> itself are acting together.", "words": 19}, {"i": 47, "html": "He’s stating a position that has arrived, not announcing a decision.", "words": 11}, {"i": 48, "html": "The whole arc, from the court through the prayer to the graveyard, has become the ground from which the moment can be met as his own.", "words": 26}, {"i": 49, "html": "No character inside the play can say what the play itself knows.", "words": 12}, {"i": 50, "html": "The delay and the readiness are the same movement.", "words": 9}, {"i": 51, "html": "In Act I the <span class=\"mo\" data-k=\"moment\">moment<\/span> hasn’t arrived, and he can’t manufacture it.", "words": 12}, {"i": 52, "html": "In Act V it has, and he meets it.", "words": 9}, {"i": 53, "html": "His character hasn’t changed. What the arc of the play has made available to him has.", "words": 16}, {"i": 54, "html": "The readiness had to be grown into rather than chosen.", "words": 10}, {"i": 55, "html": "Dying, Hamlet gives his voice for Fortinbras. <span class=\"q\" data-q=\"The rest is silence.\">“The rest is silence.”<\/span>", "words": 11}, {"i": 56, "html": "None of the play’s characters is in a position to see the whole arc.", "words": 14}, {"i": 57, "html": "The thing the play knows is available only from outside all of them at once.", "words": 15}, {"i": 58, "html": "The play has been building that position for the reader across five acts.", "words": 13}, {"i": 59, "html": "When the readiness is all arrives, the reader can hear what Hamlet’s own voice can’t fully say about itself.", "words": 19}], "seg": [{"k": "beat", "i": 1, "g": 0, "ch": "Act I scene ii"}, {"k": "beat", "i": 2, "g": 0, "ch": "Act I scene ii"}, {"k": "beat", "i": 3, "g": 0, "ch": "Act I scene ii"}, {"k": "beat", "i": 4, "g": 0, "ch": "Act I scene ii"}, {"k": "beat", "i": 5, "g": 0, "ch": "Act I scene ii"}, {"k": "card", "g": 0, "ch": "Act I scene ii", "n": "court"}, {"k": "beat", "i": 6, "g": 0, "ch": null}, {"k": "beat", "i": 7, "g": 0, "ch": "Act I scene ii"}, {"k": "beat", "i": 8, "g": 0, "ch": null}, {"k": "beat", "i": 9, "g": 0, "ch": "Act I scene ii"}, {"k": "beat", "i": 10, "g": 0, "ch": "Act I scene ii"}, {"k": "beat", "i": 11, "g": 0, "ch": null}, {"k": "beat", "i": 12, "g": 1, "ch": "Act I scene v"}, {"k": "beat", "i": 13, "g": 1, "ch": "Act I scene v"}, {"k": "beat", "i": 14, "g": 1, "ch": "Act II scene ii"}, {"k": "beat", "i": 15, "g": 1, "ch": "Act II scene ii"}, {"k": "beat", "i": 16, "g": 1, "ch": "Act III scene ii"}, {"k": "beat", "i": 17, "g": 1, "ch function life(l){const tau=T-l.t0;if(tau<C)return {ph:0,e:tau/C};if(tau<C+l.H)return {ph:1,e:(tau-C)/Math.max(l.H,.001)};return {ph:2,e:Math.min(1,(tau-C-l.H)/D)}}
const ez=x=>x*x*(3-2*x);
function wrapC(ctx,text,w){const words=text.split(/\s+/),lines=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(ctx.measureText(t).width>w&&cur){lines.push(cur);cur=wd}else cur=t}if(cur)lines.push(cur);return lines}

function cloud(gs,bx,by,bw,bh,drift,ga){hg.save();hg.setTransform(1,0,0,1,0,0);hg.globalCompositeOperation='lighter';hg.globalAlpha=ga;

 hg.globalAlpha=ga*.4;hg.drawImage(gs,Math.round((bx-bw*.75-drift*.6)*DPR),Math.round((by-bh*.72)*DPR));hg.restore()}

function drawRings(g){const S=DATA.__sibs||[];if(S.length<2||intro<.2)return;const me=S.findIndex(s=>s[1]===FILE),n=S.length,tl=-.22,ca=Math.cos(tl),sa=Math.sin(tl),fade=Math.min(1,(intro-.2)/.6);
 const pt=(a,r)=>{const x=r*Math.cos(a),y=r*.2*Math.sin(a);return [g.cx+x*ca-y*sa,g.cy+x*sa+y*ca]};
 for(let j=0;j<n;j++){const r=g.R*(1.42+.16*j),cur=j===me;
  [[bg,Math.PI,2*Math.PI],[hg,0,Math.PI]].forEach(([c,a0,a1])=>{c.save();c.globalAlpha=(cur?.42:.2)*fade;c.strokeStyle=cur?'#ee4a64':'#e9e6dc';c.lineWidth=cur?1.1:.8;c.beginPath();
   for(let i=0;i<=72;i++){const p=pt(a0+(a1-a0)*i/72,r);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])}c.stroke();c.restore()});
  const a=(T*.035*(1+.25*j)+j*2.1)%(2*Math.PI),p=pt(a,r),front=Math.sin(a)>0,c=front?hg:bg,m=Math.max(2.2,g.R*(cur?.028:.022));
  c.save();c.globalAlpha=fade*(front?1:.75);const gr=c.createRadialGradient(p[0]-m*.35,p[1]-m*.35,m*.1,p[0],p[1],m);gr.addColorStop(0,cur?'#ffd0d6':'#f2efe8');gr.addColorStop(1,cur?'#8a2030':'#5a5a60');
  c.fillStyle=gr;c.beginPath();c.arc(p[0],p[1],m,0,7);c.fill();c.restore()}}

  const fade=f.ph===0?Math.min(1,f.e*1.6):f.ph===2?Math.max(0,1-f.e*1.3):1;
  const drift=(f.ph===0?-1+f.e:f.ph===1?.08*f.e:.08+f.e*1.2)*40;
  const ga=fade*(f.ph===0?ez(Math.min(1,f.e)):1);
  const ta=fade*(f.ph===0?Math.max(0,(f.e-.45)/.55):f.ph===2?Math.max(0,1-f.e*1.6):1);

function drawHairs(g,M){
 hg.setTransform(DPR,0,0,DPR,0,0);hg.clearRect(0,0,W,H);if(intro<.3)return;
 // n = M^T p
 const tv=p=>[M[0][0]*p[0]+M[1][0]*p[1]+M[2][0]*p[2],M[0][1]*p[0]+M[1][1]*p[1]+M[2][1]*p[2],M[0][2]*p[0]+M[1][2]*p[1]+M[2][2]*p[2]];
 hg.lineCap='round';hg.lineWidth=.6;
 for(const h of hairs){const b=tv(h.b);if(b[2]<-.03)continue;
  const a=tv(h.a),L=h.len;
  const tip=[b[0]*(1+L*h.lean)+a[0]*L,b[1]*(1+L*h.lean)+a[1]*L,b[2]*(1+L*h.lean)+a[2]*L];
  const mid=[b[0]*(1+L*.7)+a[0]*L*.3*h.curl,b[1]*(1+L*.7)+a[1]*L*.3*h.curl,b[2]*(1+L*.7)+a[2]*L*.3*h.curl];
  if(tip[2]<-.02&&b[2]<.05)continue;
  const X=v=>g.cx+v[0]*g.R,Y=v=>g.cy-v[1]*g.R;
  const edge=1-Math.max(0,b[2]);

  hg.beginPath();hg.moveTo(X(b),Y(b));hg.quadraticCurveTo(X(mid),Y(mid),X(tip),Y(tip));hg.stroke()}}
