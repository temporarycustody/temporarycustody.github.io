:root{--paper:#f2f1ea;--card:#fbfbf6;--ink:#111;--ink-mid:#2f2e2a;--ink-light:#6a6962;--ink-faint:#9a988f;--rule-thin:#cfcdc4;--crimson:#b8102c;
  --prose:'TeX Gyre Schola','Century Schoolbook L',Georgia,serif;--mono:'Liberation Mono','DejaVu Sans Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink)}
body{min-height:100vh;font-family:var(--prose);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;position:relative}
body::before{content:"";position:fixed;inset:0;opacity:.55;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.44  0 0 0 0 0.40  0 0 0 .05 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
main{position:relative;max-width:1080px;margin:0 auto;padding:clamp(24px,5vw,64px) clamp(20px,6vw,64px) 120px}
.top{font-family:var(--mono);font-size:clamp(11px,1.3vw,15px);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint)}
.top a{color:var(--ink);text-decoration:none}.top a:hover,.top a:focus-visible{text-decoration:underline}
.top span{margin-left:1.2em}
h1{margin-top:clamp(28px,5vw,56px);text-align:center;font-weight:400;font-size:clamp(22px,3.4vw,34px);letter-spacing:.26em;margin-right:-.26em;line-height:1.4}
.sub{margin-top:10px;text-align:center;font-style:italic;font-size:clamp(16px,2.2vw,26px);color:var(--ink-light)}
.row{margin-top:clamp(32px,6vw,72px);display:flex;gap:clamp(24px,5vw,64px);justify-content:center;align-items:flex-start}
figure{flex:1 1 0;max-width:420px;text-align:center}
figure img{display:block;width:100%;height:auto;border:1px solid var(--rule-thin);box-shadow:12px 14px 0 #dedcd3}
figcaption{margin-top:clamp(22px,3vw,34px)}
.iss{font-size:clamp(18px,2.4vw,28px);color:var(--ink);letter-spacing:.02em}
.na{margin-top:12px;font-family:var(--mono);font-size:clamp(11px,1.4vw,16px);letter-spacing:.24em;margin-right:-.24em;text-transform:uppercase;color:var(--crimson)}
nav{position:fixed;right:clamp(16px,3.2vw,40px);bottom:clamp(12px,2.6vw,28px);font-family:var(--mono);font-size:clamp(11px,1.3vw,14px);letter-spacing:.18em;text-transform:uppercase}
nav a{color:var(--ink-faint);text-decoration:none;padding:.5em 0}nav a:hover,nav a:focus-visible{color:var(--ink)}
@media (max-width:560px){.row{flex-direction:column;align-items:center;gap:56px}figure{width:100%;max-width:340px}}
</style>
