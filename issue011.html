<script>/* Shared frame for the empathy box start screens: the masthead, the boxed "Click to begin" sign, sound, and the way out. */
window.EB=(function(){
const touch=matchMedia('(pointer: coarse)').matches,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ov=document.createElement('div');ov.id='rs';ov.className=(window.EB_THEME||'paper');
ov.innerHTML='<div class="stage"></div><div class="mast"><b>Temporary Custody</b><i>Do Androids Dream of Electric Sheep?</i></div>'+
 '<div class="hint"></div><div id="rsSign" tabindex="0" role="button">Coming soon</div><button id="rsSnd" type="button">Sound on</button>';
document.body.appendChild(ov);
const sign=ov.querySelector('#rsSign'),sndBtn=ov.querySelector('#rsSnd'),stage=ov.querySelector('.stage'),hint=ov.querySelector('.hint');
// sound: a looped bed, occasional events, and a pad that swells while the handles are held
const snd=(()=>{let A=null,M=null,on=true,bufs={},started=false,evT=null,pad=null,padG=null,grip=0;const src=window.EB_SND||{};
  async function load(k){const r=await fetch(src[k]);const b=await r.arrayBuffer();bufs[k]=await new Promise((res,rej)=>A.decodeAudioData(b,res,rej))}
  function play(k,v){const b=bufs[k];if(!b||!A)return;const s=A.createBufferSource(),g=A.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(M);s.start()}
  function sched(){clearTimeout(evT);const ev=window.EB_EVENTS||[];if(!ev.length)return;evT=setTimeout(()=>{if(on&&A&&!document.hidden){const e=ev[Math.floor(Math.random()*ev.length)];play(e[0],e[1])}sched()},(window.EB_GAP||[8,18]).reduce((a,b)=>a+Math.random()*(b-a))*1000)}
  function mkPad(){padG=A.createGain();padG.gain.value=0;const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;padG.connect(lp);lp.connect(M);
    // A minor with an added ninth, slow and wide
    [[110,.5],[164.81,.35],[220,.3],[261.63,.22],[329.63,.14],[493.88,.06]].forEach(([f,a],i)=>{for(const det of [-.003,.003]){const o=A.createOscillator();o.type=i<2?'sine':'triangle';o.frequency.value=f*(1+det);
      const g=A.createGain();g.gain.value=a*.5;const l=A.createOscillator();l.frequency.value=.07+i*.031;const lg=A.createGain();lg.gain.value=a*.18;l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(padG);o.start();l.start()}})}
  return{async start(){if(started)return;started=true;try{A=new (window.AudioContext||window.webkitAudioContext)();M=A.createGain();M.gain.value=0;M.connect(A.destination);
      await Promise.all(Object.keys(src).map(load));for(const [k,v] of (window.EB_BEDS||[])){const s=A.createBufferSource();s.buffer=bufs[k];s.loop=true;const g=A.createGain();g.gain.value=v;s.connect(g);g.connect(M);s.start()}
      mkPad();M.gain.setTargetAtTime(on?.9:0,A.currentTime,1);sched();this.grip(grip)}catch(e){console.warn(e)}},
    grip(v){grip=v;if(padG&&A)padG.gain.setTargetAtTime(v*.22,A.currentTime,v>0?.9:.6)},
    play(k,v){play(k,v)},
    toggle(){on=!on;sndBtn.textContent=on?'Sound on':'Sound off';if(!started){if(on)this.start();return}if(A){if(A.state==='suspended')A.resume();M.gain.setTargetAtTime(on?.9:0,A.currentTime,.3)}},
    fade(){if(A&&M)M.gain.setTargetAtTime(0,A.currentTime,.8)},wake(){if(A&&A.state==='suspended')A.resume()}}})();
const first=()=>snd.start();addEventListener('pointerdown',first,{once:true,capture:true});addEventListener('keydown',first,{once:true,capture:true});
sndBtn.addEventListener('click',e=>{e.stopPropagation();snd.toggle()});
let shown=true;
function begin(){if(!ov.classList.contains('on'))return;ov.classList.remove('on');snd.fade();setTimeout(()=>{location.href=window.EB_BACK||'index.html#issues'},700)}
sign.addEventListener('click',e=>{e.stopPropagation();begin()});sign.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();begin()}});
let t=0,last=performance.now();
function bob(dt){t+=dt;if(!reduce)sign.style.transform='translateY('+(Math.sin(t*1.3)*4).toFixed(1)+'px) rotate('+(-1.5+Math.sin(t*.9)*.7).toFixed(2)+'deg)'}
requestAnimationFrame(()=>ov.classList.add('on'));
return{ov,stage,sign,hint,snd,reduce,touch,shown:()=>shown,bob,begin}})();
</script><script>(function(){'use strict';
/* Issue 11 start: the empathy box from the ink drawing, held still. One small lamp on the panel, right of the dial,
   breathes on and off slowly. The sign reads Coming soon and returns to the issues in the sky. */
const {stage,hint,reduce}=EB;
const IW=1280,IH=720;const img=new Image();img.src=window.EB_IMG;
const cv=document.createElement('canvas');stage.appendChild(cv);cv.style.left='0';cv.style.top='0';const x=cv.getContext('2d');
let W=0,H=0,dpr=1,sc=1,ox=0,oy=0;
function size(){W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  sc=Math.min(W/IW,H/IH)*1.02;ox=(W-IW*sc)/2;oy=(H-IH*sc)/2+H*.03}
addEventListener('resize',size);size();
hint.textContent='';
const L=[570,371];// the lamp, in the drawing's own coordinates
let t=0,last=performance.now();
function draw(){x.setTransform(1,0,0,1,0,0);x.fillStyle='#ffffff';x.fillRect(0,0,cv.width,cv.height);
  x.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,dpr*oy);if(img.complete)x.drawImage(img,0,0,IW,IH);
  // a slow breath: about five seconds from dark to lit and back, eased so it never snaps
  const b=reduce?.6:Math.pow(.5-.5*Math.cos(t*6.283/5.2),1.6);
  const [lx,ly]=L;
  x.save();x.translate(lx,ly);x.rotate(-.12);
  // glow on the panel around it
  const gr=x.createRadialGradient(0,0,2,0,0,18);gr.addColorStop(0,`rgba(214,40,60,${.38*b})`);gr.addColorStop(1,'rgba(214,40,60,0)');x.fillStyle=gr;x.beginPath();x.arc(0,0,18,0,6.283);x.fill();
  // the bezel, inked like the knobs
  x.fillStyle='#161616';x.beginPath();x.ellipse(0,0,9.5,8,0,0,6.283);x.fill();
  x.fillStyle='#e9e7e0';x.beginPath();x.ellipse(0,0,7,5.8,0,0,6.283);x.fill();
  // the lens: dark red when off, bright when on
  const lg=x.createRadialGradient(-1.5,-1.5,.5,0,0,6);lg.addColorStop(0,`rgb(${120+135*b|0},${30+170*b|0},${40+150*b|0})`);lg.addColorStop(.5,`rgb(${70+150*b|0},${18+28*b|0},${24+36*b|0})`);lg.addColorStop(1,'#2a0c10');
  x.fillStyle=lg;x.beginPath();x.ellipse(0,0,5.6,4.6,0,0,6.283);x.fill();
  x.strokeStyle='#161616';x.lineWidth=1.1;x.beginPath();x.ellipse(0,0,5.6,4.6,0,0,6.283);x.stroke();
  x.fillStyle='rgba(255,255,255,.75)';x.beginPath();x.ellipse(-2,-1.8,1.3,.9,-.5,0,6.283);x.fill();
  x.restore()}
function frame(now){requestAnimationFrame(frame);if(!EB.shown())return;const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;EB.bob(dt);draw()}
requestAnimationFrame(frame);
window.__eb={state:()=>({t})};
})();
</script></body></html>
