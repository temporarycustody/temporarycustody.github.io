html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d5cc;margin-bottom:.9em;text-shadow:0 0 10px #05060a,0 0 4px #05060a,0 0 2px #05060a,0 0 1px #000}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   S calm still  as A, but the planet is its still picture: no shader, no turning

const DATA={"intro": [], "beats": [{"i": 1, "html": "Most of them had held their <span class=\"mo\" data-k=\"weep\">tears<\/span> back fairly well.", "words": 10}, {"i": 2, "html": "Then they saw him drink. Crito had already risen, unable to hold his <span class=\"mo\" data-k=\"weep\">tears<\/span>.", "words": 14}, {"i": 3, "html": "Apollodorus, who’d been <span class=\"mo\" data-k=\"weep\">weeping<\/span> all along, broke into a roar that undid everyone in the room.", "words": 16}, {"i": 4, "html": "Only Socrates stayed dry-eyed. What is this you’re doing, he asked.", "words": 11}, {"i": 5, "html": "He’d sent the women away for this reason. He’d heard that a man should die in reverent silence, <span class=\"q gk\" data-q=\"ἐν εὐφημίᾳ\">ἐν εὐφημίᾳ<\/span>.", "words": 20}, {"i": 6, "html": "Keep quiet, he told them, and endure. They were ashamed, and held their <span class=\"mo\" data-k=\"weep\">tears<\/span>.", "words": 14}, {"i": 7, "html": "Phaedo tells this to Echecrates, among Phliasians who’ve had no clear news from Athens.", "words": 14}, {"i": 8, "html": "Early on he says a strange feeling came over him that day, an unaccustomed blend of pleasure and pain. <span class=\"q gk\" data-q=\"ἄτοπόν τί μοι πάθος\">ἄτοπόν τί μοι πάθος<\/span>", "words": 23}, {"i": 9, "html": "At the cup he says for whom the tears were. He covered himself and <span class=\"mo\" data-k=\"weep\">wept for himself<\/span>. <span class=\"q gk\" data-q=\"ἀπέκλαον ἐμαυτόν\">ἀπέκλαον ἐμαυτόν<\/span>", "words": 19}, {"i": 10, "html": "The dialogue argues that death is no evil for the philosopher. The room behaves as if the argument has settled it for one man, the one dying.", "words": 27}, {"i": 11, "html": "The reading starts in that gap, between what the dialogue argues and what its witnesses do with their <span class=\"mo\" data-k=\"hand\">hands<\/span> and faces.", "words": 21}, {"i": 12, "html": "The moment usually remembered is Socrates <span class=\"mo\" data-k=\"reach\">reaching for the hemlock<\/span>. The Greek tells it another way.", "words": 16}, {"i": 13, "html": "A boy goes out and comes back with the man who’ll give the drug. The man carries it ground, in a cup, <span class=\"q gk\" data-q=\"ἐν κύλικι\">ἐν κύλικι<\/span>.", "words": 24}, {"i": 14, "html": "You know these things, Socrates says. What must I do? <span class=\"q gk\" data-q=\"σὺ γὰρ τούτων ἐπιστήμων\">σὺ γὰρ τούτων ἐπιστήμων<\/span>", "words": 14}, {"i": 15, "html": "Drink, walk about until your legs feel heavy, then lie down. The drug will do the rest.", "words": 17}, {"i": 16, "html": "And with that he <span class=\"mo\" data-k=\"reach\">held the cup out<\/span> to Socrates. <span class=\"q gk\" data-q=\"ὤρεξε τὴν κύλικα τῷ Σωκράτει\">ὤρεξε τὴν κύλικα τῷ Σωκράτει<\/span>", "words": 15}, {"i": 17, "html": "The verb is <span class=\"q gk\" data-q=\"ὤρεξε\">ὤρεξε<\/span>, aorist active of <span class=\"q gk\" data-q=\"ὀρέγω\">ὀρέγω<\/span>, to hold out, <span class=\"mo\" data-k=\"reach\">to reach a thing toward another<\/span>. Its subject is the man.", "words": 22}, {"i": 18, "html": "Socrates gets another verb, <span class=\"q gk\" data-q=\"λαβών\">λαβών<\/span>. <span class=\"mo\" data-k=\"take\">He takes<\/span>.", "words": 7}, {"i": 19, "html": "<span class=\"mo\" data-k=\"reach\">The reaching<\/span> belongs, in the grammar, to the state’s <span class=\"mo\" data-k=\"hand\">hand<\/span>. Socrates receives.", "words": 12}, {"i": 20, "html": "The same verb does weightier work earlier. Equal sticks and equal stones fall short of the equal itself.", "words": 18}, {"i": 21, "html": "And still, Socrates says, all the things of the senses <span class=\"mo\" data-k=\"reach\">reach after<\/span> what the equal is. <span class=\"q gk\" data-q=\"ὀρέγεται τοῦ ὃ ἔστιν ἴσον\">ὀρέγεται τοῦ ὃ ἔστιν ἴσον<\/span>", "words": 21}, {"i": 22, "html": "<span class=\"q gk\" data-q=\"ὀρέγω\">ὀρέγω<\/span> lives two lives. Active, it holds a thing out to someone. Middle, it <span class=\"mo\" data-k=\"reach\">reaches after<\/span> something on its own account.", "words": 21}, {"i": 23, "html": "The middle belongs to the sticks and stones, and to the soul that <span class=\"mo\" data-k=\"reach\">reaches after<\/span> what is. <span class=\"q gk\" data-q=\"ὀρέγηται τοῦ ὄντος\">ὀρέγηται τοῦ ὄντος<\/span>", "words": 20}, {"i": 24, "html": "At the cup, a reader might expect that voice for Socrates. The text gives the active to the man who serves the sentence.", "words": 23}, {"i": 25, "html": "Socrates <span class=\"mo\" data-k=\"take\">takes<\/span> what is held out to him. <span class=\"mo\" data-k=\"reach\">The reaching<\/span> was the other man’s from the start.", "words": 17}, {"i": 26, "html": "The dialogue opens by explaining a delay. Every year Athens sends a ship to Delos.", "words": 15}, {"i": 27, "html": "It’s the ship, they say, in which Theseus took the twice seven to Crete, and saved them and himself. <span class=\"q gk\" data-q=\"τοὺς δὶς ἑπτὰ\">τοὺς δὶς ἑπτὰ<\/span>", "words": 22}, {"i": 28, "html": "While the ship is away the city puts no one to death. Its stern was crowned the day before the trial, and Socrates waited a long time in prison.", "words": 29}, {"i": 29, "html": "The frame rests on the story of a hero who went to Crete and was saved. The opening leaves the bull of that story unnamed.", "words": 25}, {"i": 30, "html": "At the cup the Greek gives Socrates one more gesture. He looks up at the man from under his brows, like a bull. <span class=\"q gk\" data-q=\"ταυρηδὸν ὑποβλέψας\">ταυρηδὸν ὑποβλέψας<\/span>", "words": 25}, {"i": 31, "html": "It’s the dialogue’s one bull, and it’s in Socrates’ look. Phaedo calls the look his habit, <span class=\"q gk\" data-q=\"ὥσπερ εἰώθει\">ὥσπερ εἰώθει<\/span>.", "words": 18}, {"i": 32, "html": "Phaedo goes straight on to a question about a libation, and to the drinking, readily and calmly. <span class=\"q gk\" data-q=\"εὐχερῶς καὶ εὐκόλως\">εὐχερῶς καὶ εὐκόλως<\/span>", "words": 20}, {"i": 33, "html": "The arguments close less cleanly than they’re remembered. Simmias fears the soul is a tuning, gone when the lyre’s strings are cut.", "words": 22}, {"i": 34, "html": "Cebes fears it’s a weaver who wears out many cloaks and dies before the last.", "words": 15}, {"i": 35, "html": "Before he answers either, Socrates strokes Phaedo’s head and gathers the hair at his neck. <span class=\"q gk\" data-q=\"καταψήσας οὖν μου τὴν κεφαλὴν\">καταψήσας οὖν μου τὴν κεφαλὴν<\/span>", "words": 20}, {"i": 36, "html": "Then he stops the talk. Let’s guard, he says, against becoming haters of argument, <span class=\"q gk\" data-q=\"μισόλογοι\">μισόλογοι<\/span>.", "words": 15}, {"i": 37, "html": "Care little for Socrates, he tells them, and much more for the truth. Resist me with every argument. <span class=\"q gk\" data-q=\"σμικρὸν φροντίσαντες Σωκράτους\">σμικρὸν φροντίσαντες Σωκράτους<\/span>", "words": 21}, {"i": 38, "html": "A dialogue building toward certainty stops near its midpoint to warn against the certainty it invites.", "words": 16}, {"i": 39, "html": "Simmias has already said what a mortal can do. <span class=\"mo\" data-k=\"take\">Take<\/span> the best human account and ride it through life like a raft. <span class=\"q gk\" data-q=\"ὥσπερ ἐπὶ σχεδίας\">ὥσπερ ἐπὶ σχεδίας<\/span>", "words": 25}, {"i": 40, "html": "Cebes says the recollection argument convinced him wonderfully, and he holds to it as to no other. <span class=\"q gk\" data-q=\"θαυμαστῶς ὡς ἐπείσθην\">θαυμαστῶς ὡς ἐπείσθην<\/span>", "words": 20}, {"i": 41, "html": "That’s one argument, endorsed before the hard objections are answered. After the last argument Simmias still keeps some disbelief. <span class=\"q gk\" data-q=\"ἀπιστίαν ἔτι ἔχειν\">ἀπιστίαν ἔτι ἔχειν<\/span>", "words": 22}, {"i": 42, "html": "The listeners hold the conclusion provisionally. The dialogue shows how hard it is to hold, in a room with a dying friend in it.", "words": 24}, {"i": 43, "html": "The man who gave the drug keeps his <span class=\"mo\" data-k=\"hand\">hands<\/span> on him. He’s there to measure.", "words": 15}, {"i": 44, "html": "He presses the foot hard and asks if Socrates feels it. No. Then the shins. <span class=\"q gk\" data-q=\"σφόδρα πιέσας αὐτοῦ τὸν πόδα\">σφόδρα πιέσας αὐτοῦ τὸν πόδα<\/span>", "words": 20}, {"i": 45, "html": "Going up the body, he shows them it’s growing cold and stiff. When the cold reaches the heart, he says, Socrates will be gone. <span class=\"q gk\" data-q=\"τότε οἰχήσεται\">τότε οἰχήσεται<\/span>", "words": 26}, {"i": 46, "html": "His knowledge is exact. The text gives him no word on what any of it means.", "words": 16}, {"i": 47, "html": "Socrates, cold to the belly, uncovers himself to speak. <span class=\"q gk\" data-q=\"ἐκκαλυψάμενος\">ἐκκαλυψάμενος<\/span>", "words": 10}, {"i": 48, "html": "Crito, we owe a cock to Asclepius. Pay it, and don’t neglect it. <span class=\"q gk\" data-q=\"τῷ Ἀσκληπιῷ ὀφείλομεν ἀλεκτρυόνα\">τῷ Ἀσκληπιῷ ὀφείλομεν ἀλεκτρυόνα<\/span>", "words": 17}, {"i": 49, "html": "Thanks, a joke about health, a pious close. Whatever it is, he says it in the plain register the man has used for the numbness.", "words": 25}, {"i": 50, "html": "The grief lives in Phaedo, and his tears get their object late in his own account.", "words": 16}, {"i": 51, "html": "No one inside the dialogue can say what the whole room has been assembling. A death can be well witnessed by people who lack the dying man’s calm.", "words": 28}, {"i": 52, "html": "Phaedo’s <span class=\"mo\" data-k=\"weep\">tears<\/span> stand beside what Socrates achieved in that room. They’re what the room, plainly reported, contained.", "words": 17}, {"i": 53, "html": "He covered himself and <span class=\"mo\" data-k=\"weep\">wept<\/span>, he says, for himself.", "words": 9}], "seg": [{"k": "beat", "i": 1, "g": 0, "ch": "117c"}, {"k": "beat", "i": 2, "g": 0, "ch": "117c, 117d"}, {"k": "beat", "i": 3, "g": 0, "ch": "117d"}, {"k": "beat", "i": 4, "g": 0, "ch": "117d"}, {"k": "beat", "i": 5, "g": 0, "ch": "117d, 117e"}, {"k": "beat", "i": 6, "g": 0, "ch": "117e"}, {"k": "beat", "i": 7, "g": 0, "ch": "57a"}, {"k": "beat", "i": 8, "g": 0, "ch": "59a"}, {"k": "beat", "i": 9, "g": 0, "ch": "117c"}, {"k": "beat", "i": 10, "g": 0, "ch": null}, {"k": "beat", "i": 11, "g": 0, "ch": null}, {"k": "beat", "i": 12, "g": 1, "ch": null}, {"k": "beat", "i": 13, "g": 1, "ch": "117a"}, {"k": "beat", "i": 14, "g": 1, "ch": "117a"}, {"k": "beat", "i": 15, "g": 1, "ch": "117a"}, {"k": "beat", "i": 16, "g": 1, "ch": "117b"}, {"k": "card", "n": "cup", "g": 1, "ch": "117b"}, {"k": "beat", "i": 17, "g": 1, "ch": "117b"}, {"k": "beat", "i": 18, "g": 1, "ch": "117b"}, {"k": "beat", "i": 19, "g": 1, "ch": "117b"}, {"k": "beat", "i": 20, "g": 1, "ch": "74d"}, {"k": "beat", "i": 21, "g": 1, "ch": "75b"}, {"k": "beat", "i": 22, "g": 1, "ch": null}, {"k": "beat", "i": 23, "g": 1, "ch": "65c, 75a"}, {"k": "beat", "i": 24, "g": 1, "ch": "117b"}, {"k": "beat", "i": 25, "g": 1, "ch": "117b"}, {"k": "voices", "g": 1, "ch": null}, {"k": "beat", "i": 26, "g": 2, "ch": "58a"}, {"k": "beat", "i": 27, "g": 2, "ch": "58a"}, {"k": "beat", "i": 28, "g": 2, "ch": "58b"}, {"k": "beat", "i": 29, "g": 2, "ch": null}, {"k": "beat", "i": 30, "g": 2, "ch": "117b"}, {"k": "beat", "i": 31, "g": 2, "ch": "117b"}, {"k": "beat", "i": 32, "g": 2, "ch": "117c"}, {"k": "swap", "g": 2, "ch": null}, {"k": "beat", "i": 33, "g": 3, "ch": "86a"}, {"k": "beat", "i": 34, "g": 3, "ch": "87b"}, {"k": "beat", "i": 35, "g": 3, "ch": "89b"}, {"k": "beat", "i": 36, "g": 3, "ch": "89d"}, {"k": "beat", "i": 37, "g": 3, "ch": "91c"}, {"k": "beat", "i": 38, "g": 3, "ch": null}, {"k": "beat", "i": 39, "g": 3, "ch": "85d"}, {"k": "beat", "i": 40, "g": 3, "ch": "92a"}, {"k": "beat", "i": 41, "g": 3, "ch": "107b"}, {"k": "beat", "i": 42, "g": 3, "ch": null}, {"k": "beat", "i": 43, "g": 4, "ch": "117e"}, {"k": "beat", "i": 44, "g": 4, "ch": "117e"}, {"k": "beat", "i": 45, "g": 4, "ch": "118a"}, {"k": "beat", "i": 46, "g": 4, "ch": null}, {"k": "beat", "i": 47, "g": 4, "ch": "118a"}, {"k": "beat", "i": 48, "g": 4, "ch": "118a"}, {"k": "beat", "i": 49, "g": 4, "ch": null}, {"k": "inv", "g": 4, "ch": null}, {"k": "beat", "i": 50, "g": 4, "ch": null}, {"k": "beat", "i": 51, "g": 4, "ch": null}, {"k": "beat", "i": 52, "g": 4, "ch": null}, {"k": "beat", "i": 53, "g": 4, "ch": "117c"}, {"k": "peaks"}, {"k": "field"}, {"k": "tail"}], "annot": {"1": {"tags": [[1, "object first"], [2, "the room before the argument"]], "does": "Starts in the cell at the moment the cup is empty."}, "2": {"tags": [[2, "Crito, already up"]], "does": "Crito rises. He’s still in the cell at the end, and closes the eyes."}, "3": {"tags": [[2, "the room undone"]], "does": "Phaedo’s verb for it is a roar, ἀναβρυχησάμενος."}, "4": {"tags": [[2, "one calm man"], [1, "short pair"]], "does": null}, "5": {"tags": [[2, "a rule for dying"]], "does": null}, "6": {"tags": [[2, "shame stops the tears"]], "does": null}, "7": {"tags": [[1, "the frame"], [2, "one witness, one listener"]], "does": "Of the death, Echecrates has heard only that Socrates drank the drug and died."}, "8": {"tags": [[2, "named early, as a mixture"]], "does": "No pity came over him then, he says. The man seemed happy."}, "9": {"tags": [[2, "named late, as his own"], [1, "lexical excavation"]], "does": "The tears are for his own fortune, deprived of such a companion."}, "10": {"tags": [[1, "matched pair"], [2, "content and performance"]], "does": null}, "11": {"tags": [[1, "the claim, placed"], [2, "hands and faces"]], "does": "Names where the reading will press."}, "12": {"tags": [[1, "the picture to be tested"]], "does": null}, "13": {"tags": [[2, "a second official"]], "does": "The servant of the Eleven came earlier, wept, and left. This is another man."}, "14": {"tags": [[2, "knowledge granted to the man"]], "does": null}, "15": {"tags": [[2, "the drug as agent"]], "does": "The Greek is αὐτὸ ποιήσει, it will act of itself."}, "16": {"tags": [[2, "the cup crosses"], [1, "the Greek, produced"]], "does": null}, "17": {"tags": [[1, "lexical excavation"], [2, "active, the man’s"]], "does": null}, "18": {"tags": [[1, "short pair"], [2, "a plain verb"]], "does": "He takes it very gladly, Phaedo says, without a tremor."}, "19": {"tags": [[2, "reaching and receiving"], [3, "absent: a reach by Socrates"]], "does": null}, "20": {"tags": [[1, "the comparison opens"]], "does": "The recollection argument, 74d to 75b."}, "21": {"tags": [[2, "the middle voice, of things"]], "does": null}, "22": {"tags": [[1, "definition, twice"], [2, "one verb, two voices"]], "does": null}, "23": {"tags": [[2, "three middles"], [2, "the soul reaches too"]], "does": "At 65c the soul reaches after what is, touching the body as little as it can."}, "24": {"tags": [[2, "the voice given elsewhere"], [3, "withheld: the middle, for Socrates"]], "does": null}, "25": {"tags": [[1, "matched short pair"], [2, "the title’s claim"]], "does": null}, "26": {"tags": [[1, "return to the opening"]], "does": null}, "27": {"tags": [[2, "the frame’s myth"]], "does": "Athens vowed to Apollo a mission to Delos each year if they were saved."}, "28": {"tags": [[2, "a death postponed by a rite"]], "does": "Phaedo gives no number of days."}, "29": {"tags": [[2, "a hero saved"], [3, "absent: the Minotaur"]], "does": null}, "30": {"tags": [[1, "lexical excavation"], [2, "a look, in one adverb"]], "does": null}, "31": {"tags": [[2, "the bull, once"], [2, "a habit, by Phaedo’s report"]], "does": null}, "32": {"tags": [[2, "no pause in the telling"]], "does": "The man answers that they grind only as much as is right to drink."}, "33": {"tags": [[1, "full concession"], [2, "the soul as tuning"]], "does": null}, "34": {"tags": [[2, "the soul as weaver"]], "does": null}, "35": {"tags": [[2, "his hand, to the witness"]], "does": "He was used, Phaedo says, to play with his hair."}, "36": {"tags": [[2, "a warning, mid-argument"]], "does": "It comes after both objections and before ei <script>

   are felt in the field. NEB picks the form:
     drift  one slow cloud mass where the planet was, three layers turning against each other
     veils  long veils of gas crossing the whole sky at different speeds, like weather seen from far off

(function(){const STYLE=window.__NEB;if(!STYLE)return;

/* ---- the forms ---- */

  const l=s.L.find(l=>!l.img||(!LITE&&!l.img2));if(!l){s.ready=true;queue.shift();setTimeout(step,30);return}
  if(!l.img)l.img=layer(l.seed,...l.c);else l.img2=layer(l.seed+500,...l.c);setTimeout(step,16)})()}

/* ---- the section in hand, read from the page's own label ---- */
function secOf(){const t=(document.getElementById('where')||{}).textContent||'';const i=(DATA.gname||[]).indexOf(t);return i<0?0:i}
let cur=null,prev=null,mix=1,shift=0;HI=HI;
let pend=null;

const ez=x=>x*x*(3-2*x);

/* ---- drawing ---- */

  const S=m*l.s*br;g.translate(cx+Math.sin(t*.031+l.ph)*m*.03,cy+Math.cos(t*.027+l.ph)*m*.025);g.rotate((reduce?0:t*l.rot)+(l.axis?axis:0)+l.ph);

const FRAMED=document.documentElement.classList.contains('framed')||(window.parent!==window&&/[#?&]frame/.test(location.href));   // the page drops its #frame on arrival, but marks <html> framed

 if(mix<1)mix=Math.min(1,mix+dt/XF);if(mix>=1)prev=null;const e=ez(mix);if(prev)prev.sc=1+.1*e;cur.sc=prev?.94+.06*e:1;fadeIn=Math.min(1,fadeIn+dt/3);if(FRAMED&&!told&&fadeIn>.55){told=true;try{parent.postMessage({tc:'planetReady'},'*')}catch(_){}}
