html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d5cc;margin-bottom:.9em;text-shadow:0 0 10px #05060a,0 0 4px #05060a,0 0 2px #05060a,0 0 1px #000}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   S calm still  as A, but the planet is its still picture: no shader, no turning

<script>
const DATA={"intro": [], "beats": [{"i": 1, "html": "Odysseus has crossed into the world of the <span class=\"mo\" data-k=\"dead\">dead</span>. <span class=\"q\" data-q=\"Mother, a duty brought me here to the house of Hades.\">“Mother, a duty brought me here to the house of Hades.”</span>", "words": 21}, {"i": 2, "html": "He tries to embrace his mother three times. <span class=\"q\" data-q=\"three times she fluttered out of my hands like a shadow\">“Three times she fluttered out of my hands like a shadow.”</span>", "words": 19}, {"i": 3, "html": "She tells him this is what the dead are. <span class=\"q\" data-q=\"The sinews no longer hold the flesh and the bones together\">“The sinews no longer hold the flesh and the bones together.”</span>", "words": 20}, {"i": 4, "html": "The moment registers something for which the homecoming narrative doesn’t account.", "words": 11}, {"i": 5, "html": "Odysseus is on his way back. The <span class=\"mo\" data-k=\"return\">direction</span> is real. But one form of what he’s returning toward has already passed beyond what return can reach.", "words": 26}, {"i": 6, "html": "What you are returning to isn’t what you left. The time of the pressing has altered both the thing and the one pressing.", "words": 23}, {"i": 7, "html": "Odysseus meets Achilles among the shades. <span class=\"q\" data-q=\"I would rather follow the plow as thrall to another man\">“I would rather follow the plow as thrall to another man.”</span>", "words": 17}, {"i": 8, "html": "Rather that, he says, <span class=\"q\" data-q=\"than be a king over all the perished dead\">“than be a king over all the perished dead.”</span>", "words": 9}, {"i": 9, "html": "Achilles chose the short glorious life over the long return, kleos over nostos. The choice is the Iliad’s, carried here.", "words": 20}, {"i": 10, "html": "The heroic choice, pressed to its consequence, discloses what it cost. The glory remains. The man is gone.", "words": 18}, {"i": 11, "html": "He asks after his son, and goes off <span class=\"q\" data-q=\"happy for what I had said of his son, and how he was famous\">“happy for what I had said of his son, and how he was famous.”</span>", "words": 23}, {"i": 12, "html": "The retrospective view, the essay says, is the one <span class=\"mo\" data-k=\"position\">position</span> the Iliad itself could never reach.", "words": 16}, {"i": 13, "html": "The audience already carries Achilles’ choice and Agamemnon’s failed return. What the poem does with them is the work.", "words": 19}, {"i": 14, "html": "Book XXIII delivers what most readings treat as the poem’s resolution. The reunion, the bed test, the recognition confirmed.", "words": 19}, {"i": 15, "html": "Penelope tells Eurykleia to set the bed <span class=\"q\" data-q=\"outside the well-fashioned chamber: that very bed that he himself built\">“outside the well-fashioned chamber: that very bed that he himself built.”</span>", "words": 19}, {"i": 16, "html": "<span class=\"q\" data-q=\"So she spoke to her husband, trying him out\">“So she spoke to her husband, trying him out.”</span>", "words": 9}, {"i": 17, "html": "Odysseus built it from a living olive, still rooted. No mortal could easily move it. He ends by asking whether it still stands, <span class=\"q\" data-q=\"or if some man has cut underneath the stump of the olive\">“or if some man has cut underneath the stump of the olive.”</span>", "words": 27}, {"i": 18, "html": "The proof is a secret the <span class=\"mo\" data-k=\"house\">house</span> keeps, <span class=\"q\" data-q=\"which no other mortal man beside has ever seen\">“which no other mortal man beside has ever seen.”</span>", "words": 18}, {"i": 19, "html": "Homecoming, at this level, is the recognition of what a place contains that only the one who built it could know.", "words": 21}, {"i": 20, "html": "But the poem goes on. The bed is rooted. The recognition is confirmed. And Book XXIV opens anyway.", "words": 18}, {"i": 21, "html": "Hermes leads the suitors’ souls down. <span class=\"q\" data-q=\"so, gibbering, they went their way together\">“So, gibbering, they went their way together.”</span>", "words": 13}, {"i": 22, "html": "Among the shades, Agamemnon’s has been there a long time. Achilles speaks with him first, of how each of them died and was mourned.", "words": 24}, {"i": 23, "html": "Agamemnon tells his own end. <span class=\"q\" data-q=\"In my homecoming Zeus devised my dismal destruction\">“In my homecoming Zeus devised my dismal destruction.”</span>", "words": 13}, {"i": 24, "html": "Then he asks Amphimedon how the suitors came under the earth, and hears the story.", "words": 15}, {"i": 25, "html": "He turns to the absent Odysseus. <span class=\"q\" data-q=\"surely you won yourself a wife endowed with great virtue\">“Surely you won yourself a wife endowed with great virtue.”</span>", "words": 16}, {"i": 26, "html": "He goes on, <span class=\"q\" data-q=\"and how well she remembered Odysseus, her wedded husband\">“and how well she remembered Odysseus, her wedded husband.”</span>", "words": 9}, {"i": 27, "html": "Against her stands Clytemnestra, and <span class=\"q\" data-q=\"a song of loathing will be hers among men\">“a song of loathing will be hers among men.”</span>", "words": 15}, {"i": 28, "html": "The essay reads the speech as naming what the <span class=\"mo\" data-k=\"return\">homecoming</span> required, from inside the homecoming that was never possible for him.", "words": 21}, {"i": 29, "html": "He has said it once before, in Book XI, of the same wife, that she <span class=\"q\" data-q=\"is all too virtuous and her mind is stored with good thoughts\">“is all too virtuous and her mind is stored with good thoughts.”</span>", "words": 25}, {"i": 30, "html": "Odysseus, after the speech, <span class=\"q\" data-q=\"did find his father alone in the well-worked orchard\">“did find his father alone in the well-worked orchard.”</span>", "words": 14}, {"i": 31, "html": "Laertes wears a patched tunic and oxhide gaiters, spading out a plant, <span class=\"q\" data-q=\"a cap of goatskin on his head, to increase his misery\">“a cap of goatskin on his head, to increase his misery.”</span>", "words": 24}, {"i": 32, "html": "Odysseus tests him, as he tested Eumaeus, as Penelope tested him. It seems best to him <span class=\"q\" data-q=\"first to make trial of him and speak in words of mockery\">“first to make trial of him and speak in words of mockery.”</span>", "words": 23}, {"i": 33, "html": "The first proof is the scar. <span class=\"q\" data-q=\"First, then, look with your eyes upon this scar and know it.\">“First, then, look with your eyes upon this scar and know it.”</span>", "words": 18}, {"i": 34, "html": "Then the trees, named with their numbers, <span class=\"q\" data-q=\"and you gave me thirteen pear trees, and ten apple trees\">“and you gave me thirteen pear trees, and ten apple trees.”</span>", "words": 18}, {"i": 35, "html": "Then the vines, <span class=\"q\" data-q=\"and so also you named the fifty vines you would give\">“and so also you named the fifty vines you would give.”</span>", "words": 11}, {"i": 36, "html": "Laertes knows him, <span class=\"q\" data-q=\"as he recognized the clear proofs that Odysseus had given\">“as he recognized the clear proofs that Odysseus had given.”</span>", "words": 10}, {"i": 37, "html": "Recognition arrives through what the land still holds. This is homecoming completed from inside achievement, in the same register as the bed.", "words": 22}, {"i": 38, "html": "Agamemnon offers no such proof. He needs none. No orchard waits for him, no vines to count.", "words": 17}, {"i": 39, "html": "The poem needs both positions in the same book. One completes homecoming from inside achievement. The other names it from outside.", "words": 21}, {"i": 40, "html": "The direction is given in the first line. <span class=\"q\" data-q=\"Tell me, Muse, of the man of many ways\">“Tell me, Muse, of the man of many ways.”</span>", "words": 17}, {"i": 41, "html": "Anticleia’s shade deposits one form of the finding. What you’re returning toward has already passed beyond reach.", "words": 17}, {"i": 42, "html": "Achilles adds another. The alternative to homecoming discloses its cost only in retrospect.", "words": 13}, {"i": 43, "html": "The bed test gives a third. Homecoming is recognition of what only lived inhabiting could have constituted.", "words": 17}, {"i": 44, "html": "Agamemnon’s speech doesn’t add another. It receives the ones that came before it and names the whole they make.", "words": 19}, {"i": 45, "html": "Laertes, after the speech, delivers the same finding once more, through orchard trees named and numbered.", "words": 16}, {"i": 46, "html": "The narrative resolution is real. Odysseus returns. Penelope recognizes him. The suitors are killed. Order is restored.", "words": 17}, {"i": 47, "html": "The bed test delivers homecoming as recognition from inside the achievement. Book XXIV delivers it as characterization from inside permanent foreclosure.", "words": 21}, {"i": 48, "html": "The second is more precise, because the <span class=\"mo\" data-k=\"position\">position</span> it speaks from can see what the first can’t.", "words": 17}, {"i": 49, "html": "The poem ends on forgetting. <span class=\"q\" data-q=\"let us make them forget the death of their brothers and sons\">“Let us make them forget the death of their brothers and sons.”</span>", "words": 17}, {"i": 50, "html": "Agamemnon says what Odysseus can’t say from inside his own homecoming, what Achilles couldn’t say before the consequences arrived.", "words": 19}, {"i": 51, "html": "The position of permanent foreclosure is the only one from which what <span class=\"mo\" data-k=\"return\">homecoming</span> requires can be named completely.", "words": 18}, {"i": 52, "html": "The poem’s deepest disclosure is made by the man who failed.", "words": 11}], "seg": [{"k": "beat", "i": 1, "g": 0, "ch": "Odyssey XI"}, {"k": "beat", "i": 2, "g": 0, "ch": "Odyssey function gasFor(w,h,style,pal,seed){const key=[Math.round(w),Math.round(h),DPR,style,pal,seed].join('|');if(gasCache.has(key))return gasCache.get(key);
 const c=document.createElement('canvas');c.width=Math.round(w*DPR);c.height=Math.round(h*DPR);const x=c.getContext('2d');x.scale(c.width/640,c.height/400);
 let s=seed*9973+5;const r=()=>(s=(s*16807)%2147483647)/2147483647,P=PAL[pal],col=()=>P[Math.floor(r()*P.length)];
 const blob=(px,py,rr,sx,rot,a,cc)=>{x.save();x.translate(px,py);x.rotate(rot);x.scale(sx,1);const gr=x.createRadialGradient(0,0,0,0,0,rr);gr.addColorStop(0,`rgba(${cc},${a})`);gr.addColorStop(1,`rgba(${cc},0)`);x.fillStyle=gr;x.beginPath();x.arc(0,0,rr,0,7);x.fill();x.restore()};
 x.globalCompositeOperation='lighter';
 if(style==='drift'){for(let i=0;i<90;i++)blob(320+(r()-.5)*500*(.35+r()*.65),200+(r()-.5)*230*(.35+r()*.65),30+r()*90,1.4+r()*1.6,(r()-.5)*.6,.014+r()*.024,col())}
 else if(style==='puff'){for(let i=0;i<80;i++){const g1=(r()+r()+r()-1.5)/1.5,g2=(r()+r()+r()-1.5)/1.5;blob(320+g1*230,200+g2*150,25+r()*80,1+r()*.5,r()*3,.016+r()*.028,col())}
  blob(320,200,70,1.3,0,.08,P[2]);blob(320,200,26,1.2,0,.12,[255,240,235])}
 else if(style==='shell'){const tl=(r()-.5)*.6;for(let i=0;i<110;i++){const t=r()*6.283,rx=190+(r()-.5)*40,ry=118+(r()-.5)*30,cx=Math.cos(t)*rx,cy=Math.sin(t)*ry;
   blob(320+cx*Math.cos(tl)-cy*Math.sin(tl),200+cx*Math.sin(tl)+cy*Math.cos(tl),14+r()*36,1+r()*.6,t,.03+r()*.04,col())}
  blob(320,200,150,1.4,tl,.02,P[0]);blob(320,200,5,1,0,.9,[255,236,220]);blob(320,200,18,1,0,.25,[255,190,160])}
 else{for(let k=0;k<6;k++){const y0=110+r()*180,y1=110+r()*180,c1=[200+r()*80,60+r()*280],c2=[360+r()*80,60+r()*280],cc=col();
   for(let i=0;i<=70;i++){const t=i/70,u=1-t,px=u*u*u*130+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*510,py=u*u*u*y0+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*y1;blob(px,py,7+r()*16,1.6,Math.atan2(y1-y0,600),.03+r()*.03,cc)}}
  for(let i=0;i<30;i++)blob(320+(r()-.5)*340,200+(r()-.5)*200,40+r()*70,1.6,0,.01+r()*.012,col())}
 x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='destination-in';
 {x.save();x.translate(c.width/2,c.height/2);x.scale(c.width/2,c.height/2);const m=x.createRadialGradient(0,0,0,0,0,1);m.addColorStop(0,'rgba(0,0,0,1)');m.addColorStop(.55,'rgba(0,0,0,1)');m.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=m;x.fillRect(-1,-1,2,2);x.restore()}
 x.globalCompositeOperation='source-over';
 for(let i=0;i<Math.round(c.width*c.height/2600);i++){const px=(.5+(r()-.5)*.8)*c.width,py=(.5+(r()-.5)*.7)*c.height,rr=(.35+r()*.8)*DPR;x.fillStyle=`rgba(255,235,228,${.08+r()*.3})`;x.beginPath();x.arc(px,py,rr,0,7);x.fill()}
 gasCache.set(key,c);if(gasCache.size>10)gasCache.delete(gasCache.keys().next().value);return c}
function life(l){const tau=T-l.t0;if(tau<C)return {ph:0,e:tau/C};if(tau<C+l.H)return {ph:1,e:(tau-C)/Math.max(l.H,.001)};return {ph:2,e:Math.min(1,(tau-C-l.H)/D)}}
const ez=x=>x*x*(3-2*x);
function wrapC(ctx,text,w){const words=text.split(/\s+/),lines=[];let cur='';for(const wd of words){const t=cur?cur+' '+wd:wd;if(ctx.measureText(t).width>w&&cur){lines.push(cur);cur=wd}else cur=t}if(cur)lines.push(cur);return lines}
function ls(c,v){if(c.letterSpacing!==undefined)c.letterSpacing=v}
function cloud(gs,bx,by,bw,bh,drift,ga){hg.save();hg.setTransform(1,0,0,1,0,0);hg.globalCompositeOperation='lighter';hg.globalAlpha=ga;
 hg.drawImage(gs,Math.round((bx-bw*.75+drift)*DPR),Math.round((by-bh*.75)*DPR));
 hg.globalAlpha=ga*.4;hg.drawImage(gs,Math.round((bx-bw*.75-drift*.6)*DPR),Math.round((by-bh*.72)*DPR));hg.restore()}

function drawRings(g){const S=DATA.__sibs||[];if(S.length<2||intro<.2)return;const me=S.findIndex(s=>s[1]===FILE),n=S.length,tl=-.22,ca=Math.cos(tl),sa=Math.sin(tl),fade=Math.min(1,(intro-.2)/.6);
 const pt=(a,r)=>{const x=r*Math.cos(a),y=r*.2*Math.sin(a);return [g.cx+x*ca-y*sa,g.cy+x*sa+y*ca]};
 for(let j=0;j<n;j++){const r=g.R*(1.42+.16*j),cur=j===me;
  [[bg,Math.PI,2*Math.PI],[hg,0,Math.PI]].forEach(([c,a0,a1])=>{c.save();c.globalAlpha=(cur?.42:.2)*fade;c.strokeStyle=cur?'#ee4a64':'#e9e6dc';c.lineWidth=cur?1.1:.8;c.beginPath();
   for(let i=0;i<=72;i++){const p=pt(a0+(a1-a0)*i/72,r);i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1])}c.stroke();c.restore()});
  const a=(T*.035*(1+.25*j)+j*2.1)%(2*Math.PI),p=pt(a,r),front=Math.sin(a)>0,c=front?hg:bg,m=Math.max(2.2,g.R*(cur?.028:.022));
  c.save();c.globalAlpha=fade*(front?1:.75);const gr=c.createRadialGradient(p[0]-m*.35,p[1]-m*.35,m*.1,p[0],p[1],m);gr.addColorStop(0,cur?'#ffd0d6':'#f2efe8');gr.addColorStop(1,cur?'#8a2030':'#5a5a60');
  c.fillStyle=gr;c.beginPath();c.arc(p[0],p[1],m,0,7);c.fill();c.restore()}}
function drawSky(g){
 for(const c of [hg,bg]){c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H)}
 if(!window.__NEB)drawRings(g);
 if(intro<.5)return;
 const mob=W<600;
 for(const l of live){const it=ITEMS[l.k],f=life(l);
  const fade=f.ph===0?Math.min(1,f.e*1.6):f.ph===2?Math.max(0,1-f.e*1.3):1;
  const drift=(f.ph===0?-1+f.e:f.ph===1?.08*f.e:.08+f.e*1.2)*40;
  const ga=fade*(f.ph===0?ez(Math.min(1,f.e)):1);
  const ta=fade*(f.ph===0?Math.max(0,(f.e-.45)/.55):f.ph===2?Math.max(0,1-f.e*1.6):1);
  // tags: small clouds to the left of the planet, or below it when the window is narrow
  const tags=it.tags||[],n=tags.length;
  tags.forEach(([k,lab],j)=>{const [style,pal,ink]=KIND[k]||KIND[1];let bw,bh,bx,by;
   ({x:bx,y:by,w:bw,h:bh}=g.tagBox(j,n));
   const dj=drift*(.7+.3*j)*(j%2?-1:1);
   cloud(gasFor(bw*1.5,bh*1.5,style,pal,l.k*3+j),bx,by,bw,bh,dj,ga);
   if(ta>.01){hg.save();hg.globalAlpha=ta;hg.font=`${mob?11:12}px 'Liberation Mono'`;ls(hg,'.18em');hg.textAlign='center';hg.textBaseline='middle';
    hg.shadowColor='rgba(5,6,10,.95)';hg.shadowBlur=7;const lines=wrapC(hg,lab.toUpperCase(),bw-24),lh=mob?17:19;
    lines.forEach((ln,i)=>{const yy=by+(i-(lines.length-1)/2)*lh;hg.fillStyle=ink;hg.fillText(ln,bx+dj*.3,yy);
     if(k===2&&i===lines.length-1){const tw=hg.measureText(ln).width;hg.shadowBlur=0;hg.fillStyle='#ee4a64';hg.fillRect(bx+dj*.3-tw/2,yy+lh*.55,tw,2);hg.shadowBlur=7}});
    hg.restore()}});
  // the does line: a wide violet drift to the right of the planet, or above it
  if(it.does){let bw,bh,bx,by;
   ({x:bx,y:by,w:bw,h:bh}=g.does);
   cloud(gasFor(bw*1.5,bh*1.5,'drift','olive',l.k),bx,by,bw,bh,drift,ga);
   if(ta>.01){hg.save();hg.globalAlpha=ta;hg.textAlign='center';hg.textBaseline='alphabetic';
    const fs=mob?15:17;hg.font=`italic ${fs}px 'TeX Gyre Pagella'`;ls(hg,'0px');
    const lines=wrapC(hg,it.does,bw-30),lh=fs*1.42,top=by-(lines.length*lh+22)/2;
    hg.font=`${mob?10:11}px 'Liberation Mono'`;ls(hg,'.24em');hg.fillStyle='#ee4a64';hg.fillText('DOES',bx+drift*.3,top+10);
    hg.font=`italic ${fs}px 'TeX Gyre Pagella'`;ls(hg,'0px');hg.fillStyle='#e9e6dc';hg.shadowColor='rgba(5,6,10,.9)';hg.shadowBlur=8;
    lines.forEach((ln,i)=>hg.fillText(ln,bx+drift*.3,top+22+lh*(i+.8)));hg.restore()}}
 }}
function drawHairs(g,M){
 hg.setTransform(DPR,0,0,DPR,0,0);hg.clearRect(0,0,W,H);if(intro<.3)return;
 // n = M^T p
 const tv=p=>[M[0][0]*p[0]+M[1][0]*p[1]+M[2][0]*p[2],M[0][1]*p[0]+M[1][1]*p[1]+M[2][1]*p[2],M[0][2]*p[0]+M[1][2]*p[1]+M[2][2]*p[2]];
 hg.lineCap='round';hg.lineWidth=.6;
 for(const h of hairs){const b=tv(h.b);if(b[2]<-.03)continue;
  const a=tv(h.a),L=h.len;
  const tip=[b[0]*(1+L*h.lean)+a[0]*L,b[1]*(1+L*h.lean)+a[1]*L,b[2]*(1+L*h.lean)+a[2]*L];
  const mid=[b[0]*(1+L*.7)+a[0]*L*.3*h.curl,b[1]*(1+L*.7)+a[1]*L*.3*h.curl,b[2]*(1+L*.7)+a[2]*L*.3*h.curl];
  if(tip[2]<-.02&&b[2]<.05)continue;
  const X=v=>g.cx+v[0]*g.R,Y=v=>g.cy-v[1]*g.R;
  const edge=1-Math.max(0,b[2]);
  hg.strokeStyle=`rgba(255,${Math.round(205+40*edge)},${Math.round(150+50*edge)},${((.06+.6*Math.pow(edge,3))*Math.min(1,(intro-.3)/.5)).toFixed(3)})`;
  hg.beginPath();hg.moveTo(X(b),Y(b));hg.quadraticCurveTo(X(mid),Y(mid),X(tip),Y(tip));hg.stroke()}}

 if(resumed)setTimeout(()=>{const it=ITEMS[resumed];document.getElementById('toastT').textContent='Resumed at '+(it.i?'¶'+it.i+(it.name?' '+it.name:''):'where you left off');const t=document.getElementById('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),7000)},600);
 return k}

let ended=false;const SIBS=(DATA.__sibs||[]);

 document.getElementById('endt').textContent=DATA.__title;const i=SIBS.findIndex(s=>s[1]===FILE),nx=i>=0?SIBS[i+1]:null,b=document.getElementById('eNext');
 if(nx){b.hidden=false;b.querySelector('b').textContent=nx[0];b.onclick=e=>{e.stopPropagation();SND.fade();if(FRAMED){try{parent.postMessage({tc:'planetNext',key:nx[1]},'*')}catch(_){}}else location.href=nx[1]+'#arrive&v2'}}else b.hidden=true;
 document.getElementById('endc').classList.add('on')}

document.getElementById('eAgain').addEventListener('click',e=>{e.stopPropagation();hideEnd();jump(0)});

if(V2){let sx=null,sy=0;addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
 addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){if(!started)begin();dx<0?next():back()}},{passive:true})}
if(FRAMED&&GO)setTimeout(()=>begin(),60);

let gone=false;

 if(FRAMED){try{parent.postMessage({tc:'planetClose'},'*')}catch(_){};return}
 let back='index.html';try{back=sessionStorage.getItem('tcReturn')||back;sessionStorage.setItem('tcBack',location.pathname.split('/').pop())}catch(_){}
 setTimeout(()=>{location.href=back+'#issues'},560)}

(document.fonts&&document.fonts.load?Promise.all(["40px 'TeX Gyre Pagella'","italic 40px 'TeX Gyre Pagella'","40px 'Liberation Mono'"].map(f=>document.fonts.load(f))):Promise.resolve()).then(()=>requestAnimationFrame(t=>{last=t;frame(t)}));

<script>
/* In place of the planet: a nebula that drifts, turns and breathes, in the planet's own colours. At each new section of
   the study the gas re-forms in a shifted colour and the sky behind it takes a new tint, so the key turns of the study
   are felt in the field. NEB picks the form:
     drift  one slow cloud mass where the planet was, three layers turning against each other
     veils  long veils of gas crossing the whole sky at different speeds, like weather seen from far off
     core   a small hot star inside a shell and two lobes of gas, the whole turning slowly on its axis
   Phones (window.__MOB) and #lite get the light form: fewer, smaller layers, 30 frames a second, no inner churn. */
(function(){const STYLE=window.__NEB;if(!STYLE)return;
const cv=document.getElementById('neb'),g=cv.getContext('2d');
const LITE=!!window.__MOB||/lite/.test(location.hash),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const RES=LITE?120:240;
let W=0,H=0,D=1;function size(){W=innerWidth;H=innerHeight;D=LITE?.5:Math.min(1.5,devicePixelRatio||1);cv.width=Math.round(W*D);cv.height=Math.round(H*D);cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',size);size();

/* ---- colour: two tones from the planet's still, turned a little at each section ---- */
let HI=[220,140,110],LO=[60,40,70];
function rgb2hsl([r,g2,b]){r/=255;g2/=255;b/=255;const mx=Math.max(r,g2,b),mn=Math.min(r,g2,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g2-b)/d+(g2<b?6:0):mx===g2?(b-r)/d+2:(r-g2)/d+4;h/=6}return [h,s,l]}
function hsl2rgb([h,s,l]){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return 255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))};return [f(0),f(8),f(4)]}
const TURN=[0,.075,-.06,.13,-.11,.04,.19,-.16];
function tone(base,gi,ds,dl){const h=rgb2hsl(base);return hsl2rgb([(h[0]+TURN[gi%TURN.length]+1)%1,Math.min(1,h[1]*ds),Math.max(.04,Math.min(.92,h[2]*dl))])}
/* muted planets (a murky river world) still need gas that reads: the bright tone keeps some colour and light */
function lift(c,smin,lmin){const h=rgb2hsl(c);return hsl2rgb([h[0],Math.max(smin,h[1]),Math.max(lmin,h[2])])}
function pal(gi){return {hi:lift(tone(HI,gi,1.15,1.05),.32,.56),lo:tone(LO,gi,1.25,1),mid:hsl2rgb((h=>[(h[0]+TURN[gi%TURN.length]+.035)%1,Math.min(1,h[1]*.9),h[2]*.7])(rgb2hsl(HI))),deep:tone(LO,gi,1,.32)}}

/* ---- noise ---- */
function noise(seed){const P=new Float32Array(1024);let s=seed*9301+49297;for(let i=0;i<1024;i++){s=(s*16807)%2147483647;P[i]=s/2147483647}
 const hs=(i,j)=>P[((i*73+j*151)%1024+1024)%1024],sm=t=>t*t*(3-2*t);
 const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j),a=hs(i,j),b=hs(i+1,j),c=hs(i,j+1),d=hs(i+1,j+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
 return (x,y,o=5)=>{let v=0,a=.5,n=0;for(let k=0;k<o;k++){v+=a*vn(x,y);n+=a;x=x*2.02+3.1;y=y*2.02+1.7;a*=.5}return v/n}}
/* one layer: a shape (where the gas may be) times warped noise (how it lies), coloured between two tones */
const SHAPE={
 cloud:(u,v)=>Math.exp(-(u*u+v*v)*2.6),
 wisp:(u,v)=>Math.exp(-(u*u*1.4+v*v*3.2)*2),
 veil:(u,v)=>Math.exp(-v*v*9)*Math.min(1,(1-Math.abs(u))*3),
 shell:(u,v)=>{const r=Math.hypot(u,v);return Math.exp(-Math.pow((r-.52)/.13,2))},
 lobes:(u,v)=>Math.exp(-(u*u/.16+Math.pow((Math.abs(v)-.48)/.36,2))),
 halo:(u,v)=>Math.exp(-(u*u+v*v)*1.4)};
function layer(seed,shape,c1,c2,opt){const w=Math.round(RES*(opt.ax||1)),h=RES,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),n=noise(seed),sh=SHAPE[shape];
 const sc=opt.scale||3,ridge=opt.ridge||0,gain=opt.gain||1;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=(i/w)*2-1,v=(j/h)*2-1;
  /* every layer fades to nothing well inside its own square, so no edge or corner of it can show when it turns */
  const nb=n(u*1.15+7.3,v*1.15+2.9,3),wk=shape==='veil'?1:1+(nb-.5)*1.1   /* the warp may shrink the blob, but the window below never lets gas reach the square's edge */,uu=u*wk,vv=v*wk;
  const win=shape==='veil'?Math.min(1,Math.max(0,(1-Math.abs(u))/.35))*Math.min(1,Math.max(0,(1-Math.abs(v))/.45)):(r=>{const t=Math.max(0,Math.min(1,(.96-r)/.42));return t*t*(3-2*t)})(Math.max(Math.hypot(uu,vv),Math.hypot(u,v)*1.04+.02));
  const m=sh(uu,vv)*win*win;const k=(j*w+i)*4;if(m<.01){im.data[k+3]=0;continue}
  const X=i/h*sc,Y=j/h*sc,q=n(X+5.2,Y+1.3,4),r=n(X+q*2.4+1.7,Y+q*2.4+9.2,4);let f=n(X+r*2.2,Y+r*2.2,5);
  if(ridge)f=f*(1-ridge)+ridge*Math.pow(1-Math.abs(r*2-1),3);
  const d=Math.max(0,Math.min(1,(f-.36)*2.6))*m*gain,t=Math.min(1,f*1.3);
  for(let ch=0;ch<3;ch++)im.data[k+ch]=Math.min(255,c2[ch]+(c1[ch]-c2[ch])*t);im.data[k+3]=Math.round(Math.min(1,d)*255)}
 x.putImageData(im,0,0);return c}

/* ---- the forms ---- */
const MIN=()=>Math.max(Math.min(W,H),Math.max(W,H)*.6);
const FSEED=[...(location.pathname.split('/').pop()||'x')].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);   // each study its own gas
function plan(gi){const p=pal(gi),sd=gi*101+7+FSEED*17,L=[];
 if(STYLE==='drift'){
  L.push({c:['cloud',p.lo,p.deep,{scale:2.2}],s:1.55,rot:.004,a:.85});
  L.push({c:['wisp',p.hi,p.lo,{scale:3.4,ridge:.5}],s:1.15,rot:-.007,a:.75});
  if(!LITE)L.push({c:['cloud',p.hi,p.mid,{scale:4.6,ridge:.7,gain:.8}],s:.8,rot:.011,a:.6});}
 else if(STYLE==='veils'){
  const n=LITE?3:5;for(let k=0;k<n;k++)L.push({c:['veil',k%2?p.hi:p.mid,k%2?p.lo:p.deep,{ax:2.6,scale:3,ridge:k%2?.55:.2}],veil:true,y:-.32+.64*k/(n-1)+(k%2?.05:-.04),s:1.9+.3*(k%3),v:(k%2?-1:1)*(6+k*3.5),a:.55+.1*(k%2)});}
 else{ // core
  L.push({c:['halo',p.deep,p.lo,{scale:2,gain:.7}],s:1.7,rot:.002,a:.7});
  L.push({c:['lobes',p.lo,p.mid,{scale:3,ridge:.4}],s:1.25,rot:.006,a:.85,axis:true});
  L.push({c:['shell',p.hi,p.lo,{scale:5,ridge:.6}],s:.7,rot:-.01,a:.85});
  if(!LITE)L.push({c:['lobes',p.hi,p.lo,{scale:5.5,ridge:.8,gain:.8}],s:1.05,rot:.006,a:.5,axis:true});}
 L.forEach((l,k)=>{l.seed=sd+k*13;l.ph=k*1.7});return {gi,p,L,ready:false}}
const sets={},queue=[];
function want(gi){if(sets[gi])return sets[gi];const s=sets[gi]=plan(gi);queue.push(s);pump();return s}
let pumping=false;function pump(){if(pumping)return;pumping=true;(function step(){const s=queue[0];if(!s){pumping=false;return}
  const l=s.L.find(l=>!l.img||(!LITE&&!l.img2));if(!l){s.ready=true;queue.shift();setTimeout(step,30);return}
  if(!l.img)l.img=layer(l.seed,...l.c);else l.img2=layer(l.seed+500,...l.c);setTimeout(step,16)})()}

/* ---- the section in hand, read from the page's own label ---- */
function secOf(){const t=(document.getElementById('where')||{}).textContent||'';const i=(DATA.gname||[]).indexOf(t);return i<0?0:i}
let cur=null,prev=null,mix=1,shift=0;HI=HI;
let pend=null;
function setSec(gi){if(cur&&cur.gi===gi){pend=null;return}const s=want(gi);if(!cur){cur=s;mix=1;return}
 if(!s.ready||(prev&&mix<1)){pend=s;return}      // keep the gas in hand until the next has formed and any exchange has finished
 prev=cur;cur=s;mix=0;pend=null;want(gi+1)}
const XF=9;   // seconds for one gas to give way to the next
const ez=x=>x*x*(3-2*x);

/* ---- drawing ---- */
let last=performance.now(),T=0,frameL=0,axis=0,axisT=0;
function drawSet(s,alpha,t){if(!s||!s.ready||alpha<=0)return;const m=MIN(),cx=W/2,cy=H/2,br=(1+.035*Math.sin(t*.21))*(s.sc||1);
 for(const l of s.L){const A=alpha*l.a;g.save();
  if(l.veil){const w=W*l.s,h=w/2.6,x=((t*l.v+l.ph*W*.37)%(W+w)+W+w)%(W+w)-w*.5,y=cy+l.y*H;A*=.35;g.globalAlpha=A;g.translate(0,y);g.drawImage(l.img,x-w/2,-h/2,w,h);g.drawImage(l.img,x-w/2-(W+w),-h/2,w,h);
   if(l.img2){g.globalAlpha=A*(.5+.5*Math.sin(t*.06+l.ph));g.drawImage(l.img2,x-w/2,-h/2,w,h);g.drawImage(l.img2,x-w/2-(W+w),-h/2,w,h)}g.restore();continue}
  /*tc-smallneb*/const S=m*l.s*br*0.58;g.translate(cx+Math.sin(t*.031+l.ph)*m*.03*0.58,cy+Math.cos(t*.027+l.ph)*m*.025*0.58);g.rotate((reduce?0:t*l.rot)+(l.axis?axis:0)+l.ph);
  g.globalAlpha=A;g.drawImage(l.img,-S/2,-S/2,S,S);
  if(l.img2){g.globalAlpha=A*(.5+.5*Math.sin(t*.07+l.ph));g.drawImage(l.img2,-S/2,-S/2,S,S)}g.restore()}
 if(STYLE==='core'){const r=m*(.05+.006*Math.sin(t*1.3))*.93,c=s.p.hi.map(Math.round).join(','),gr=g.createRadialGradient(cx,cy,0,cx,cy,r*4);
  gr.addColorStop(0,`rgba(255,250,240,${.95*alpha})`);gr.addColorStop(.12,`rgba(${c},${.6*alpha})`);gr.addColorStop(1,`rgba(${c},0)`);g.globalAlpha=1;g.fillStyle=gr;g.fillRect(cx-r*4,cy-r*4,r*8,r*8)}}
function tint(s,alpha){if(!s)return;const c=s.p.deep.map(Math.round).join(','),gr=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.hypot(W,H)*.7);
 gr.addColorStop(0,`rgba(${c},${.2*alpha})`);gr.addColorStop(.6,`rgba(${c},${.13*alpha})`);gr.addColorStop(1,`rgba(${c},${.1*alpha})`);g.globalAlpha=1;g.fillStyle=gr;g.fillRect(0,0,W,H)}
const FRAMED=document.documentElement.classList.contains('framed')||(window.parent!==window&&/[#?&]frame/.test(location.href));   // the page drops its #frame on arrival, but marks <html> framed
let fadeIn=FRAMED?.35:0,told=false;
function frame(now){requestAnimationFrame(frame);if(LITE&&now-frameL<40)return;frameL=now;const dt=Math.min(.1,(now-last)/1000);last=now;if(!reduce)T+=dt;
 setSec(secOf());if(!cur||!cur.ready)return;
 if(pend&&pend.ready&&!(prev&&mix<1))setSec(pend.gi);
 if(mix<1)mix=Math.min(1,mix+dt/XF);if(mix>=1)prev=null;const e=ez(mix);if(prev)prev.sc=1+.1*e;cur.sc=prev?.94+.06*e:1;fadeIn=Math.min(1,fadeIn+dt/3);if(FRAMED&&!told&&fadeIn>.55){told=true;try{parent.postMessage({tc:'planetReady'},'*')}catch(_){}}
 if(STYLE==='core'){const target=cur.gi*.9;axis+=(target-axis)*Math.min(1,dt*.4)}
 g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);g.globalCompositeOperation='source-over';
 tint(prev,(1-e)*fadeIn);tint(cur,e*fadeIn);
 g.globalCompositeOperation='screen';drawSet(prev,(1-e)*fadeIn,T);drawSet(cur,e*fadeIn,T);g.globalCompositeOperation='source-over'}
/* the tones come from the planet's still once it has loaded */
const st=document.getElementById('arrive');
function start(){try{const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(st,0,0,40,40);const d=x.getImageData(0,0,40,40).data,px=[];
  for(let i=0;i<d.length;i+=4)if(d[i+3]>220)px.push([d[i],d[i+1],d[i+2],d[i]*.3+d[i+1]*.59+d[i+2]*.11]);px.sort((a,b)=>a[3]-b[3]);
  const avg=a=>{const s=[0,0,0];a.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2]});return s.map(v=>v/Math.max(1,a.length))};
  if(px.length>20){HI=avg(px.slice(Math.floor(px.length*.7)));LO=avg(px.slice(0,Math.floor(px.length*.45)))}}catch(_){}
 want(0);requestAnimationFrame(frame);setTimeout(()=>{(DATA.gname||[]).forEach((_,i)=>want(i))},2500)}
if(st&&st.complete&&st.naturalWidth)start();else if(st){st.addEventListener('load',start);st.addEventListener('error',start)}else start();
})();
</script>
</body>
