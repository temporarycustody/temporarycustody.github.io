html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;margin-bottom:.9em;text-shadow:0 0 8px #05060a,0 0 2px #05060a}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   S calm still  as A, but the planet is its still picture: no shader, no turning

const DATA={"intro": ["The novel first says his name over a stranger’s corpse.", "Then at a funeral, and then outside his own houseboat.", "Each time, the grave is someone else’s."], "beats": [{"i": 1, "html": "A fisherman finishes running his lines under a bridge and rows in to a crowd on the bank.", "words": 18}, {"i": 2, "html": "Rescue boats have brought in a man who jumped the night before. The crew works a grapnel hook free of his cheek and lays him in the grass, his yellow socks showing.", "words": 32}, {"i": 3, "html": "A man in the crowd takes the fisherman by the elbow. <span class=\"q\" data-q=\"Hey Suttree.\">“Hey Suttree.”<\/span> The novel says his <span class=\"mo\" data-k=\"name\">name<\/span> here for the first time, and it says it over another man’s corpse.", "words": 31}, {"i": 4, "html": "Suttree files past with the crowd. He notices <span class=\"q\" data-q=\"the dead man’s watch was still running\">“the dead man’s watch was still running”<\/span>.", "words": 16}, {"i": 5, "html": "Cornelius Suttree fishes the Tennessee River out of a houseboat in early 1950s Knoxville.", "words": 14}, {"i": 6, "html": "He has left a family with money, a wife, and a young son, to live among drunks, thieves, and squatters in McAnally Flats.", "words": 23}, {"i": 7, "html": "The essay’s claim is narrower. The novel keeps staging his <span class=\"mo\" data-k=\"name\">name<\/span> at graves that repeatedly fail to contain it.", "words": 19}, {"i": 8, "html": "The origin comes early, in one unbroken scene. His uncle John visits the houseboat toward evening.", "words": 16}, {"i": 9, "html": "He can’t imagine anyone more different from Suttree’s brother Carl. Suttree asks which one.", "words": 14}, {"i": 10, "html": "You’ve just got the one, the uncle says. <span class=\"q\" data-q=\"Couldnt they think of a name for the other one?\">“Couldnt they think of a name for the other one?”<\/span>", "words": 18}, {"i": 11, "html": "There was another, born dead. The uncle denies ever saying so, then confirms it. The other one was stillborn, and both were premature.", "words": 23}, {"i": 12, "html": "The scene closes without an answer about the name. The other one has none in anything the uncle will say.", "words": 20}, {"i": 13, "html": "Suttree, the one who lived, will hear his own name said back to him over a telephone by a funeral parlour.", "words": 21}, {"i": 14, "html": "That asymmetry is the seed. The other one stays buried. The book will not leave Suttree alone, <span class=\"mo\" data-k=\"bury\">burying<\/span> him by proxy again and again.", "words": 24}, {"i": 15, "html": "The clearest case comes about a third of the way in, after his young son dies. It comes in three stages.", "words": 21}, {"i": 16, "html": "First, his friend J-Bone tells him over a lunch counter that his little boy is dead.", "words": 16}, {"i": 17, "html": "Second, at the house of his abandoned wife’s family, he asks when the funeral is. She tells him, to make him leave. <span class=\"q\" data-q=\"Three oclock. Please Buddy.\">“Three oclock. Please Buddy.”<\/span>", "words": 26}, {"i": 18, "html": "Third, alone in a poolhall, he finds two funeral parlours in the directory and telephones the first.", "words": 17}, {"i": 19, "html": "<span class=\"q\" data-q=\"Are you people in charge of the Suttree funeral?\">“Are you people in charge of the Suttree funeral?”<\/span>", "words": 9}, {"i": 20, "html": "Yessir, the girl says, at three oclock. The answer isn’t information. It is his own surname, said back to him by a stranger who has no idea who is asking.", "words": 30}, {"i": 21, "html": "The words alone are enough to <span class=\"q\" data-q=\"let the receiver fall away from his ear\">“let the receiver fall away from his ear”<\/span>.", "words": 15}, {"i": 22, "html": "He walks to the cemetery, sits apart while the hearse comes through the woods, and stands under a tree while a preacher speaks.", "words": 23}, {"i": 23, "html": "He hears none of it until his own name is spoken over the small coffin. <span class=\"q\" data-q=\"Then everything became quite clear.\">“Then everything became quite clear.”<\/span>", "words": 20}, {"i": 24, "html": "The service ends. He asks the two gravediggers to fill the grave, and they stall. A tractor is coming, one says, and they were only supposed to fold the chairs.", "words": 30}, {"i": 25, "html": "Suttree pulls back the canvas, takes up a spade, and fills the grave himself. He works on into the evening through a small cold rain.", "words": 25}, {"i": 26, "html": "The gravediggers fold their chairs and watch. A crew arrives with a truck and a tractor, and one of them offers it. He shovels on.", "words": 25}, {"i": 27, "html": "The father buries the child who carries his own surname, with his own hands. The only witnesses are men there for the work.", "words": 23}, {"i": 28, "html": "The novel comes back to a corpse in its last chapter, and this time Suttree finds the body himself.", "words": 19}, {"i": 29, "html": "He has been hospitalized with typhoid and has lost twenty pounds he can’t easily spare.", "words": 15}, {"i": 30, "html": "Back at the houseboat one morning he finds the door ajar and someone already dead in his own bed.", "words": 19}, {"i": 31, "html": "He nudges the sleeper with his toe. Two rats leave the bed, go up the wall, and out through a missing pane.", "words": 22}, {"i": 32, "html": "The body has no name attached to it, for him or for the reader. The novel never says who it is.", "words": 21}, {"i": 33, "html": "It is only after he has left that a city ambulance comes down the river path for the body.", "words": 19}, {"i": 34, "html": "People watch from the porches. The ambulance sticks in the mud, and three boys push it out. <span class=\"q\" data-q=\"Who sick?\">“Who sick?”<\/span> one asks.", "words": 21}, {"i": 35, "html": "A man dead in there, the driver says, a couple of weeks. He asks whether they know who lived here. They say no.", "words": 23}, {"i": 36, "html": "As the ambulance pulls away, one of the boys says it. <span class=\"q\" data-q=\"Old Suttree aint dead.\">“Old Suttree aint dead.”<\/span>", "words": 15}, {"i": 37, "html": "The name has come loose from the body a third time. The man who carries it is not even there to hear it confirmed, and it has again <span class=\"mo\" data-k=\"survive\">survived<\/span>.", "words": 30}, {"i": 38, "html": "The closing pages carry him off the river. He has hidden his small talismans where they will not be found in his lifetime.", "words": 23}, {"i": 39, "html": "He takes for talisman instead <span class=\"q\" data-q=\"the simple human heart within him\">“the simple human heart within him”<\/span>.", "words": 12}, {"i": 40, "html": "He walks out to the highway with a cardboard suitcase. A boy carrying water to a construction crew offers him a drink from a tin dipper.", "words": 26}, {"i": 41, "html": "In the boy’s eyes Suttree sees himself, <span class=\"mo\" data-k=\"twin\">twinned<\/span>. Then a car stops and takes him out of the city.", "words": 20}, {"i": 42, "html": "Behind him an enormous <span class=\"mo\" data-k=\"hound\">hound<\/span> comes up out of the meadow and is <span class=\"q\" data-q=\"sniffing at the spot where Suttree had stood\">“sniffing at the spot where Suttree had stood”<\/span>.", "words": 22}, {"i": 43, "html": "The novel’s surface argument is a way of living. Dignity from squalor, a life chosen against inheritance.", "words": 17}, {"i": 44, "html": "Across three separated scenes it does something narrower. It keeps attaching Suttree’s name to a death.", "words": 16}, {"i": 45, "html": "A funeral parlour’s answer over the telephone. A preacher’s committal. A boy’s verdict outside the houseboat.", "words": 16}, {"i": 46, "html": "Each time the novel confirms that the name has <span class=\"mo\" data-k=\"survive\">survived<\/span> the attachment.", "words": 12}, {"i": 47, "html": "The choice of poverty over privilege is real, and the novel gives it weight elsewhere. The structure is spent on something else.", "words": 22}, {"i": 48, "html": "The other one stays unnamed and stays dead.", "words": 8}, {"i": 49, "html": "Nothing in the novel offers Suttree an account of why the birth divided as it did. One child kept, one not. No ledger to explain the apportionment.", "words": 27}, {"i": 50, "html": "That he lived is no achievement he can point to, and no virtue the narrative credits to him.", "words": 18}, {"i": 51, "html": "The name has to keep confirming it, against a world that keeps closing the account early.", "words": 16}, {"i": 52, "html": "The book opens with a stranger’s death and a watch still running on a stranger’s wrist.", "words": 16}, {"i": 53, "html": "It ends with a hound at an empty spot in a field, and an unnamed voice warning whoever is listening.", "words": 20}, {"i": 54, "html": "<span class=\"q\" data-q=\"Fly them.\">“Fly them.”<\/span>", "words": 2}, {"i": 55, "html": "The only thing that has changed is that Suttree is no longer standing where the hound expects him to be.", "words": 20}, {"i": 56, "html": "Nothing under the name has been settled. It has only, once more, <span class=\"mo\" data-k=\"survive\">survived<\/span>.", "words": 14}], "seg": [{"k": "beat", "i": 1, "g": 0, "ch": "Ch. 1"}, {"k": "beat", "i": 2, "g": 0, "ch": null}, {"k": "beat", "i": 3, "g": 0, "ch": null}, {"k": "beat", "i": 4, "g": 0, "ch": null}, {"k": "beat", "i": 5, "g": 1, "ch": "Ch. 1"}, {"k": "beat", "i": 6, "g": 1, "ch": null}, {"k": "beat", "i": 7, "g": 1, "ch": null}, {"k": "beat", "i": 8, "g": 1, "ch": "Ch. 1"}, {"k": "beat", "i": 9, "g": 1, "ch": "Ch. 1"}, {"k": "beat", "i": 10, "g": 1, "ch": "Ch. 1"}, {"k": "beat", "i": 11, "g": 1, "ch": "Ch. 1"}, {"k": "beat", "i": 12, "g": 1, "ch": "Ch. 1"}, {"k": "beat", "i": 13, "g": 1, "ch": "Ch. 1"}, {"k": "swap", "g": 1, "ch": "Ch. 1"}, {"k": "beat", "i": 14, "g": 2, "ch": null}, {"k": "beat", "i": 15, "g": 2, "ch": "Ch. 10"}, {"k": "beat", "i": 16, "g": 2 if(V2){let sx=null,sy=0;addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
 addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){if(!started)begin();dx<0?next():back()}},{passive:true})}
if(FRAMED&&GO)setTimeout(()=>begin(),60);
document.getElementById('bBegin').addEventListener('click',e=>{e.stopPropagation();begin()});
/* leaving for the sky: in a frame, the index closes it and zooms back out; on its own, the index opens zoomed in and pulls back */
let gone=false;
function leaveSky(e){if(e)e.preventDefault();if(gone)return;gone=true;SND.fade();document.body.classList.add('leaving');
 if(FRAMED){try{parent.postMessage({tc:'planetClose'},'*')}catch(_){};return}
 let back='index.html';try{back=sessionStorage.getItem('tcReturn')||back;sessionStorage.setItem('tcBack',location.pathname.split('/').pop())}catch(_){}
 setTimeout(()=>{location.href=back+'#issues'},560)}
document.querySelector('#top a').addEventListener('click',leaveSky);
addEventListener('keydown',e=>{if(e.key==='Escape'&&FRAMED)leaveSky(e)});
addEventListener('pageshow',ev=>{if(ev.persisted){gone=false;document.body.classList.remove('leaving')}});
const bs=document.getElementById('bSnd');bs.addEventListener('click',e=>{e.stopPropagation();if(!started){begin();return}bs.textContent=SND.toggle()?'Sound on':'Sound off'});
window.__planet={next,back,state:()=>({T,live:live.map(l=>[l.k,l.slot]),intro}),seek:k=>{live=[];T+=20;spawn(k)},pose:(k,tau,sp)=>{intro=1;started=true;document.getElementById('begin').classList.add('gone');frozen=true;live=[];spawn(k);cur().t0=T-tau;if(sp!=null)spin=sp}};
(document.fonts&&document.fonts.load?Promise.all(["40px 'TeX Gyre Pagella'","italic 40px 'TeX Gyre Pagella'","40px 'Liberation Mono'"].map(f=>document.fonts.load(f))):Promise.resolve()).then(()=>requestAnimationFrame(t=>{last=t;frame(t)}));
})();

<style>
html.mobalt body>*:not(#sky):not(#mob):not(script):not(style){display:none!important}
html.mobalt,html.mobalt body{background:#05060a;overflow:hidden;height:100%}
#mob{position:fixed;inset:0;z-index:5;color:#e9e6dc;font-family:'TeX Gyre Pagella',Palatino,serif;-webkit-tap-highlight-color:transparent}
#mob .mono{font-family:'Liberation Mono',monospace;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
#mob a,#mob button{all:unset;cursor:pointer;color:#cfccc2}#mob a:focus-visible,#mob button:focus-visible{outline:1px solid #ee4a64;outline-offset:3px}
#mob .bar{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;z-index:3}
#mob .bar .iss{color:#7d7b75}
#mob .pl{position:absolute;pointer-events:none;filter:drop-shadow(0 0 22px rgba(140,150,200,.12))}
#mob .pass{position:absolute;left:0;right:0;padding:0 22px;text-align:center;transition:opacity .9s ease;overflow-y:auto;-webkit-overflow-scrolling:touch}
#mob .pass.out{opacity:0}
#mob .lb{color:#bdbab1;margin-bottom:.9em}
#mob .tx{font-size:18.5px;line-height:1.5;color:#f1eee6;text-shadow:0 0 12px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9);max-width:34em;margin:0 auto}
#mob .ttl .tx{font-size:27px;line-height:1.18}#mob .ttl .dk{display:block;font-style:italic;font-size:16px;line-height:1.45;margin-top:.8em;color:#d8d4ca}
#mob .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:1.1em}
#mob .chip{font-size:13.5px;line-height:1.3;padding:.32em .75em;border-radius:999px;border:1px solid}
#mob .chip.k1{color:#d9e4e4;border-color:rgba(110,150,160,.55);background:rgba(60,110,130,.16)}
#mob .chip.k2{color:#e9e6dc;border-color:rgba(200,110,140,.5);background:rgba(150,80,120,.16)}
#mob .chip.k3{color:#ee4a64;border-color:rgba(238,74,100,.55);background:rgba(238,74,100,.1)}
#mob .does{margin-top:1em;font-style:italic;font-size:15px;line-height:1.45;color:#b9b6c9;max-width:30em;margin-left:auto;margin-right:auto}
#mob .does b{font-style:normal;font-weight:400;font-family:'Liberation Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#8d8aa3;margin-right:.6em}
#mob .foot{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(12px + env(safe-area-inset-bottom));z-index:3}
#mob .prog{position:relative;height:14px;margin-bottom:8px}
#mob .prog i{position:absolute;bottom:0;width:1px;height:4px;background:rgba(233,230,220,.25)}#mob .prog i.g{height:8px;background:rgba(233,230,220,.5)}
#mob .prog i.cur{background:#ee4a64;height:9px;width:2px}
#mob .prog .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.14)}
#mob .ctl{display:flex;justify-content:space-between;align-items:center}
#mob .ctl button{padding:8px 4px}
#mob .gate{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18vh;gap:18px;background:linear-gradient(transparent 40%,rgba(5,6,10,.7));transition:opacity .8s}
#mob .gate.gone{opacity:0;pointer-events:none}#mob .gate .q{color:#7d7b75}
#mob .endp .k{color:#ee4a64;margin-bottom:1em}#mob .endp button{display:block;margin:1.1em auto;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
#mob .endp button b{display:block;font-family:'TeX Gyre Pagella',Palatino,serif;font-weight:400;letter-spacing:0;text-transform:none;font-size:17px;color:#e9e6dc;margin-top:.35em}
/* D: the planet as a horizon */
html.mobD #mob .foot{background:linear-gradient(transparent,rgba(5,6,10,.55))}
/* N: a nebula in the planet's colours; it drifts by a slow transform only, so the phone just moves one picture */
#mob .neb{position:absolute;left:-12%;top:-12%;width:124%;height:124%;pointer-events:none;opacity:0;transition:opacity 2.5s ease;animation:tcneb 80s ease-in-out infinite alternate}
#mob .neb.on{opacity:1}
@keyframes tcneb{from{transform:translate(0,0) scale(1) rotate(0deg)}to{transform:translate(-3%,2.5%) scale(1.07) rotate(2deg)}}
/* E: the planet as a dark disc against its own light */
#mob .ecl{position:absolute;pointer-events:none}
#mob .ecl .cor{position:absolute;border-radius:50%;animation:tccor 9s ease-in-out infinite alternate}
#mob .ecl img{position:absolute;inset:0;width:100%;height:100%;filter:brightness(.06) saturate(.3)}
#mob .ecl .rim{position:absolute;border-radius:50%}
@keyframes tccor{from{opacity:.75}to{opacity:1}}
@media (prefers-reduced-motion: reduce){#mob .neb,#mob .ecl .cor{animation:none}}
/* C: one scrolling column */
html.mobC #mob{overflow-y:auto;-webkit-overflow-scrolling:touch}
html.mobC #mob .bar{position:sticky;padding-bottom:26px;background:linear-gradient(#05060a 62%,rgba(5,6,10,0))}
#mob .col{padding:0 22px 80px;text-align:center}
#mob .col .hd{padding:6vh 0 5vh}#mob .col .hd img{width:min(46vw,220px);display:block;margin:0 auto 26px;filter:drop-shadow(0 0 22px rgba(140,150,200,.12))}
#mob .col .sec{margin:3.2em 0 1.6em;color:#ee4a64}
#mob .col .p{margin:0 auto 2.6em;max-width:34em;opacity:1;transition:opacity 1.2s ease}#mob .col .p.dim{opacity:.25}
#mob .col .p .n{color:#7d7b75;margin-bottom:.7em}
#mob .col .p .tx{font-size:18px}
@media (prefers-reduced-motion: reduce){#mob .pass,#mob .col .p,#mob .gate{transition:none}}
</style>
<script>
(function(){const MODE=window.__MOBALT;if(!MODE)return;
const strip=h=>h.replace(/<[^>]+>/g,'').replace(/&#8217;/g,'’').replace(/&amp;/g,'&');
const ITEMS=[{title:true,words:10}];
DATA.beats.forEach(b=>{const sg=DATA.seg.find(s=>s.k==='beat'&&s.i===b.i),an=DATA.annot[String(b.i)]||{};ITEMS.push({i:b.i,name:strip((DATA.names||{})[String(b.i)]||''),text:strip(b.html),words:b.words,label:DATA.gname[sg?sg.g:0],tags:(an.tags||[]).map(([k,l])=>[k,strip(l)]),does:an.does?strip(an.does):null})});
const FILE=location.pathname.split('/').pop()||'',POSKEY='tcPos:'+FILE,HREF=location.href;
const FRAMED=window.parent!==window&&/[#?&]frame/.test(HREF),GO=/[#?&]go\b/.test(HREF),PNUM=+((HREF.match(/[#?&]p(\d+)\b/)||[])[1]||0);
const SIBS=DATA.__sibs||[],ROOT=146.83,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const STILL=(document.getElementById('arrive')||{}).src||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const secStart=k=>{const it=ITEMS[k];return it.title||k===1||(ITEMS[k-1]&&!ITEMS[k-1].title&&ITEMS[k-1].label!==it.label)};
function passHTML(it,withLabel){
 if(it.title)return `<div class="ttl"><div class="lb mono">Temporary Custody · ${esc(DATA.__issue)}</div><div class="tx">${esc(DATA.__title)}<span class="dk">${esc(DATA.__deck||'')}</span></div></div>`;
 return (withLabel?`<div class="lb mono">${esc(it.label)}</div>`:'')+`<div class="tx">${esc(it.text)}</div>`+
  (it.tags.length?`<div class="chips">${it.tags.map(([k,l])=>`<span class="chip k${k}">${esc(l)}</span>`).join('')}</div>`:'')+
  (it.does?`<div class="does"><b>Does</b>${esc(it.does)}</div>`:'')}
function save(k){try{localStorage.setItem(POSKEY,String(k))}catch(_){}}
function seen(){try{localStorage.removeItem(POSKEY);const s=JSON.parse(localStorage.getItem('tcSeen')||'[]');if(!s.includes(FILE)){s.push(FILE);localStorage.setItem('tcSeen',JSON.stringify(s))}}catch(_){}}
function resumeAt(){if(PNUM){const j=ITEMS.findIndex(it=>it.i===PNUM);if(j>0)return j}let s=0;try{s=+(localStorage.getItem(POSKEY)||0)}catch(_){}return s>1&&s<ITEMS.length-1?s:0}
let left=false;function toSky(e){if(e)e.preventDefault();if(left)return;left=true;snd.fade();
 if(FRAMED){try{parent.postMessage({tc:'planetClose'},'*')}catch(_){}return}location.href='index.html#issues'}
function nextStudy(){const i=SIBS.findIndex(s=>s[1]===FILE);return i>=0?SIBS[i+1]:null}
function goNext(nx){snd.fade();if(FRAMED){try{parent.postMessage({tc:'planetNext',key:nx[1]},'*')}catch(_){}}else location.href=nx[1]+'#v2'}
function ready(){let n=0;(function f(){if(++n<3)return requestAnimationFrame(f);if(FRAMED)try{parent.postMessage({tc:'planetReady'},'*')}catch(_){}})()}
addEventListener('keydown',e=>{if(e.key==='Escape')toSky()});

/* sound: a low open fifth in the study's key and a soft bell for each passage; no noise */
const snd=(()=>{let ac=null,m=null,on=true;
 function start(){if(ac)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;try{ac=new A()}catch(_){return}m=ac.createGain();m.gain.value=0;m.connect(ac.destination);m.gain.setTargetAtTime(on?.9:0,ac.currentTime,1.2);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;const bg=ac.createGain();bg.gain.value=.05;lp.connect(bg);bg.connect(m);
  [[ROOT/2,1],[ROOT*.75,.55],[ROOT,.25]].forEach(([f,a],i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.detune.value=(i-1)*4;g.gain.value=a;o.connect(g);g.connect(lp);o.start();
   const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=.05+i*.03;lg.gain.value=a*.35;l.connect(lg);lg.connect(g.gain);l.start()})}
 const PENT=[1,9/8,5/4,3/2,5/3,2];
 function bell(k){if(!ac||!on)return;const t=ac.currentTime+.05,f=ROOT*2*PENT[(k*3)%PENT.length];
  [[f,.05,2.8],[f*2.01,.012,1.4]].forEach(([fr,a,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(m);o.start(t);o.stop(t+d+.1)})}
 function toggle(){on=!on;if(!ac)start();else m.gain.setTargetAtTime(on?.9:0,ac.currentTime,.4);return on}
 function fade(){if(ac)m.gain.setTargetAtTime(0,ac.currentTime,.2)}
 return {start,bell,toggle,fade,get on(){return on},get ac(){return ac}}})();

const root=document.createElement('div');root.id='mob';document.body.appendChild(root);
const bar=`<div class="bar"><a href="index.html#issues" class="mono back">‹ Temporary Custody</a><span class="mono iss">${esc(DATA.__issue||'')}</span></div>`;

if(MODE==='C'){
 /* the reader: everything in one column, nothing moves but the page */
 let h=bar+`<div class="col"><div class="hd">${STILL?`<img alt="" src="${STILL}">`:''}${passHTML(ITEMS[0])}</div>`;
 ITEMS.forEach((it,k)=>{if(it.title)return;if(secStart(k))h+=`<div class="sec mono">${esc(it.label)}</div>`;
  h+=`<div class="p${reduce?'':' dim'}" data-k="${k}">${it.i?`<div class="n mono">¶${it.i}${it.name?' · '+esc(it.name):''}</div>`:''}${passHTML(it,false)}</div>`});
 const nx=nextStudy();
 h+=`<div class="endp" id="mEnd"><div class="k mono">End of the study</div>${nx?`<button type="button" id="mNext">Next study<b>${esc(nx[0])}</b></button>`:''}<button type="button" id="mSky">Back to the sky</button></div></div>`;
 root.innerHTML=h;root.querySelector('.back').addEventListener('click',toSky);root.querySelector('#mSky').addEventListener('click',toSky);
 if(nx)root.querySelector('#mNext').addEventListener('click',()=>goNext(nx));
 const ps=[...root.querySelectorAll('.p')];
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('dim')}}),{root,rootMargin:'0px 0px -12% 0px'});ps.forEach(p=>io.observe(p));
 const endIO=new IntersectionObserver(es=>{if(es[0].isIntersecting)seen()},{root});endIO.observe(root.querySelector('#mEnd'));
 let st=0;root.addEventListener('scroll',()=>{clearTimeout(st);st=setTimeout(()=>{const y=root.scrollTop+innerHeight*.3;let k=0;for(const p of ps){if(p.offsetTop<=y)k=+p.dataset.k;else break}save(k)},300)},{passive:true});
 const r=resumeAt();if(r){const p=ps.find(p=>+p.dataset.k===r);if(p)requestAnimationFrame(()=>{root.scrollTop=p.offsetTop-innerHeight*.18;p.classList.remove('dim')})}
 ready();return}

/* B and D: one passage at a time, crossfading */
root.innerHTML=bar+(MODE==='N'?'<canvas class="neb" aria-hidden="true"></canvas>':MODE==='E'?`<div class="ecl"><div class="cor"></div><img alt="" src="${STILL}"><div class="rim"></div></div>`:STILL?`<img class="pl" alt="" src="${STILL}">`:'')+`<div class="pass" aria-live="polite"></div>`+
 `<div class="foot"><div class="prog"><div class="base"></div></div><div class="ctl mono"><button type="button" id="mBack">‹ Back</button><button type="button" id="mPause">Pause</button><button type="button" id="mNext">Next ›</button><button type="button" id="mSnd">Sound on</button></div></div>`+
 `<div class="gate"><button type="button" class="mono" id="mGo">Tap to begin, with sound</button><button type="button" class="mono q" id="mQuiet">or read in silence</button></div>`;
const pl=root.querySelector('.pl'),pass=root.querySelector('.pass'),prog=root.querySelector('.prog'),TK=[];
ITEMS.forEach((it,k)=>{const t=document.createElement('i');t.style.left=(k/(ITEMS.length-1)*100)+'%';if(secStart(k))t.className='g';prog.appendChild(t);TK.push(t)});
prog.addEventListener('click',e=>{const r=prog.getBoundingClientRect();show(Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(ITEMS.length-1)),true)});
function layout(){const W=innerWidth,H=innerHeight;
 if(MODE==='N'){Object.assign(pass.style,{top:'64px',bottom:'96px',display:'flex',flexDirection:'column'});return}
 if(MODE==='E'){const S=Math.min(W*.56,H*.28,280),e=root.querySelector('.ecl'),d=S/1.16,o=(S-d)/2;Object.assign(e.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H*.11)+'px'});
  Object.assign(e.querySelector('.rim').style,{left:o+'px',top:o+'px',width:d+'px',height:d+'px'});const c=d*2.1;Object.assign(e.querySelector('.cor').style,{left:(S-c)/2+'px',top:(S-c)/2+'px',width:c+'px',height:c+'px'});
  Object.assign(pass.style,{top:(H*.11+S+26)+'px',bottom:'92px'});return}
 if(MODE==='B'){const S=Math.min(W*.62,H*.3,300);if(pl)Object.assign(pl.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H*.1)+'px'});
  const top=H*.1+S+22;Object.assign(pass.style,{top:top+'px',bottom:'92px'})}
 else{const S=Math.max(W*2.3,H*1.1),vis=Math.min(H*.24,S*.2);if(pl)Object.assign(pl.style,{width:S+'px',height:S+'px',left:(W-S)/2+'px',top:(H-vis)+'px'});
  Object.assign(pass.style,{top:'64px',bottom:(vis+20)+'px',display:'flex',flexDirection:'column'})}}
addEventListener('resize',layout);layout();
function tones(cb){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(im,0,0,40,40);const d=x.getImageData(0,0,40,40).data,px=[];
  for(let i=0;i<d.length;i+=4)if(d[i+3]>220)px.push([d[i],d[i+1],d[i+2],d[i]*.3+d[i+1]*.59+d[i+2]*.11]);px.sort((a,b)=>a[3]-b[3]);
  const avg=a=>{const s=[0,0,0];a.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2]});return s.map(v=>v/Math.max(1,a.length))};
  const sat=(c,k)=>{const m=(c[0]+c[1]+c[2])/3;return c.map(v=>Math.max(0,Math.min(255,m+(v-m)*k)))};
  cb(sat(avg(px.slice(Math.floor(px.length*.75))),1.5),sat(avg(px.slice(0,Math.floor(px.length*.4))),1.6))};im.src=STILL}
if(MODE==='N')tones((hi,lo)=>{const cv=root.querySelector('.neb'),W=innerWidth*1.24,H=innerHeight*1.24,w=180,h=Math.round(w*H/W);cv.width=w;cv.height=h;const x=cv.getContext('2d'),img=x.createImageData(w,h);
  let sd=(FILE.length*7919)%1000;const P=new Float32Array(512);for(let i=0;i<512;i++){sd=(sd*16807+11)%2147483647;P[i]=sd/2147483647}
  const hs=(i,j)=>P[((i*57+j*131)%512+512)%512];const sm=t=>t*t*(3-2*t);
  const vn=(X,Y)=>{const i=Math.floor(X),j=Math.floor(Y),fx=sm(X-i),fy=sm(Y-j);const a=hs(i,j),b=hs(i+1,j),c=hs(i,j+1),d=hs(i+1,j+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
  const fbm=(X,Y)=>{let v=0,a=.5;for(let o=0;o<5;o++){v+=a*vn(X,Y);X*=2.03;Y*=2.03;a*=.5}return v};
  const deep=[12,10,24];
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=i/w*3.2,v=j/h*3.2*H/W;const q=fbm(u+1.7,v+.3),r=fbm(u+3*q+.4,v+3*q+5.2);let f=fbm(u+2.2*r,v+2.2*r);
   const cy=(j/h-.42),cx=(i/w-.5),fall=Math.max(0,1-Math.hypot(cx*1.1,cy*1.6)*1.35);let den=Math.max(0,(f-.3)*2.5)*fall;den=Math.min(1,den);const fil=Math.pow(Math.max(0,1-Math.abs(r-.55)*7),3)*fall*.6;
   const k=(j*w+i)*4,t=Math.min(1,f*1.25);for(let ch=0;ch<3;ch++){const base=lo[ch]+(hi[ch]-lo[ch])*t;img.data[k+ch]=Math.min(255,deep[ch]*(1-den)+base*den*1.15+hi[ch]*fil*.6)}
   img.data[k+3]=Math.round(Math.min(1,den*.85+fil)*240)}
  x.putImageData(img,0,0);requestAnimationFrame(()=>cv.classList.add('on'))});
if(MODE==='E')tones((hi)=>{const e=root.querySelector('.ecl'),c=hi.map(Math.round).join(',');
  e.querySelector('.cor').style.background=`radial-gradient(circle closest-side,rgba(${c},0) 45%,rgba(${c},.42) 48%,rgba(${c},.16) 56%,rgba(${c},.05) 72%,rgba(${c},0) 100%)`;
  e.querySelector('.rim').style.boxShadow=`0 0 0 1px rgba(255,244,230,.55),0 0 14px 3px rgba(${c},.45),inset 0 0 18px rgba(${c},.25)`});
let k=-1,timer=null,paused=false,started=false,ended=false;
const holdOf=it=>it.title?7:Math.min(26,4.5+it.words*.3);
function center(){/* the passage sits in the middle of its space unless it is too long, then it scrolls from the top */
 if(MODE==='D'||MODE==='N'){const inner=pass.firstElementChild;if(inner)inner.style.margin=pass.scrollHeight>pass.clientHeight+2?'0':'auto 0'}
 else{const inner=pass.firstElementChild;if(inner){inner.style.marginTop='0';const room=pass.clientHeight-inner.offsetHeight;inner.style.marginTop=room>0?(room*.35)+'px':'0'}}}
function show(j,user){if(j<0||j>=ITEMS.length)return;if(ended)ended=false;k=j;save(j);clearTimeout(timer);
 TK.forEach((t,i)=>t.classList.toggle('cur',i===j));
 pass.classList.add('out');setTimeout(()=>{pass.innerHTML=`<div>${passHTML(ITEMS[j],true)}</div>`;pass.scrollTop=0;center();pass.classList.remove('out');snd.bell(j)},reduce?0:user?450:900);
 schedule()}
function schedule(){clearTimeout(timer);if(paused||!started)return;timer=setTimeout(()=>{if(k>=ITEMS.length-1)end();else show(k+1)},(holdOf(ITEMS[k])+1)*1000)}
function end(){ended=true;seen();const nx=nextStudy();pass.classList.add('out');
 setTimeout(()=>{pass.innerHTML=`<div class="endp"><div class="k mono">End of the study</div><div class="tx">${esc(DATA.__title)}</div><button type="button" id="eA">Read again</button>${nx?`<button type="button" id="eN">Next study<b>${esc(nx[0])}</b></button>`:''}<button type="button" id="eS">Back to the sky</button></div>`;center();pass.classList.remove('out');
  pass.querySelector('#eA').onclick=()=>show(0,true);pass.querySelector('#eS').onclick=toSky;if(nx)pass.querySelector('#eN').onclick=()=>goNext(nx)},reduce?0:900)}
function begin(withSound){if(started)return;started=true;root.querySelector('.gate').classList.add('gone');
 if(withSound)snd.start();else{snd.toggle();root.querySelector('#mSnd').textContent='Sound off'}
 const r=resumeAt();show(r);}
root.querySelector('#mGo').onclick=()=>begin(true);root.querySelector('#mQuiet').onclick=()=>begin(false);
root.querySelector('.back').addEventListener('click',toSky);
root.querySelector('#mNext').onclick=()=>{if(!started)begin(true);else if(k>=ITEMS.length-1)end();else show(k+1,true)};
root.querySelector('#mBack').onclick=()=>{if(!started)begin(true);else show(Math.max(0,k-1),true)};
root.querySelector('#mPause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';schedule()};
root.querySelector('#mSnd').onclick=e=>{e.target.textContent=snd.toggle()?'Sound on':'Sound off'};
let sx=null,sy=0;root.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});
root.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
 if(Math.abs(dx)>60&&Math.abs(dx)>1.6*Math.abs(dy)){if(!started){begin(true);return}if(dx<0){if(k>=ITEMS.length-1)end();else show(k+1,true)}else show(Math.max(0,k-1),true)}},{passive:true});
/* before beginning, the title sits under the gate */
pass.innerHTML=`<div>${passHTML(ITEMS[0],true)}</div>`;requestAnimationFrame(center);
if(FRAMED&&GO)setTimeout(()=>begin(true),60);
ready();
})();
</script>
<script>
/* In place of the planet: a nebula that drifts, turns and breathes, in the planet's own colours. At each new section of
   the study the gas re-forms in a shifted colour and the sky behind it takes a new tint, so the key turns of the study
   are felt in the field. NEB picks the form:
     drift  one slow cloud mass where the planet was, three layers turning against each other
     veils  long veils of gas crossing the whole sky at different speeds, like weather seen from far off
     core   a small hot star inside a shell and two lobes of gas, the whole turning slowly on its axis
   Phones (window.__MOB) and #lite get the light form: fewer, smaller layers, 30 frames a second, no inner churn. */
(function(){const STYLE=window.__NEB;if(!STYLE)return;
const cv=document.getElementById('neb'),g=cv.getContext('2d');
const LITE=!!window.__MOB||/lite/.test(location.hash),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const RES=LITE?120:240;
let W=0,H=0,D=1;function size(){W=innerWidth;H=innerHeight;D=LITE?.5:Math.min(1.5,devicePixelRatio||1);cv.width=Math.round(W*D);cv.height=Math.round(H*D);cv.style.width=W+'px';cv.style.height=H+'px'}
addEventListener('resize',size);size();

/* ---- colour: two tones from the planet's still, turned a little at each section ---- */
let HI=[220,140,110],LO=[60,40,70];
function rgb2hsl([r,g2,b]){r/=255;g2/=255;b/=255;const mx=Math.max(r,g2,b),mn=Math.min(r,g2,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g2-b)/d+(g2<b?6:0):mx===g2?(b-r)/d+2:(r-g2)/d+4;h/=6}return [h,s,l]}
function hsl2rgb([h,s,l]){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return 255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))};return [f(0),f(8),f(4)]}
const TURN=[0,.075,-.06,.13,-.11,.04,.19,-.16];
function tone(base,gi,ds,dl){const h=rgb2hsl(base);return hsl2rgb([(h[0]+TURN[gi%TURN.length]+1)%1,Math.min(1,h[1]*ds),Math.max(.04,Math.min(.92,h[2]*dl))])}
/* muted planets (a murky river world) still need gas that reads: the bright tone keeps some colour and light */
function lift(c,smin,lmin){const h=rgb2hsl(c);return hsl2rgb([h[0],Math.max(smin,h[1]),Math.max(lmin,h[2])])}
function pal(gi){return {hi:lift(tone(HI,gi,1.15,1.05),.32,.56),lo:tone(LO,gi,1.25,1),mid:hsl2rgb((h=>[(h[0]+TURN[gi%TURN.length]+.035)%1,Math.min(1,h[1]*.9),h[2]*.7])(rgb2hsl(HI))),deep:tone(LO,gi,1,.32)}}

/* ---- noise ---- */
function noise(seed){const P=new Float32Array(1024);let s=seed*9301+49297;for(let i=0;i<1024;i++){s=(s*16807)%2147483647;P[i]=s/2147483647}
 const hs=(i,j)=>P[((i*73+j*151)%1024+1024)%1024],sm=t=>t*t*(3-2*t);
 const vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=sm(x-i),fy=sm(y-j),a=hs(i,j),b=hs(i+1,j),c=hs(i,j+1),d=hs(i+1,j+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy};
 return (x,y,o=5)=>{let v=0,a=.5,n=0;for(let k=0;k<o;k++){v+=a*vn(x,y);n+=a;x=x*2.02+3.1;y=y*2.02+1.7;a*=.5}return v/n}}
/* one layer: a shape (where the gas may be) times warped noise (how it lies), coloured between two tones */
const SHAPE={
 cloud:(u,v)=>Math.exp(-(u*u+v*v)*2.6),
 wisp:(u,v)=>Math.exp(-(u*u*1.4+v*v*3.2)*2),
 veil:(u,v)=>Math.exp(-v*v*9)*Math.min(1,(1-Math.abs(u))*3),
 shell:(u,v)=>{const r=Math.hypot(u,v);return Math.exp(-Math.pow((r-.52)/.13,2))},
 lobes:(u,v)=>Math.exp(-(u*u/.16+Math.pow((Math.abs(v)-.48)/.36,2))),
 halo:(u,v)=>Math.exp(-(u*u+v*v)*1.4)};
function layer(seed,shape,c1,c2,opt){const w=Math.round(RES*(opt.ax||1)),h=RES,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),im=x.createImageData(w,h),n=noise(seed),sh=SHAPE[shape];
 const sc=opt.scale||3,ridge=opt.ridge||0,gain=opt.gain||1;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const u=(i/w)*2-1,v=(j/h)*2-1;
  /* every layer fades to nothing well inside its own square, so no edge or corner of it can show when it turns */
  const nb=n(u*1.15+7.3,v*1.15+2.9,3),wk=shape==='veil'?1:1+(nb-.5)*1.1   /* the warp may shrink the blob, but the window below never lets gas reach the square's edge */,uu=u*wk,vv=v*wk;
  const win=shape==='veil'?Math.min(1,Math.max(0,(1-Math.abs(u))/.35))*Math.min(1,Math.max(0,(1-Math.abs(v))/.45)):(r=>{const t=Math.max(0,Math.min(1,(.96-r)/.42));return t*t*(3-2*t)})(Math.max(Math.hypot(uu,vv),Math.hypot(u,v)*1.04+.02));
  const m=sh(uu,vv)*win*win;const k=(j*w+i)*4;if(m<.01){im.data[k+3]=0;continue}
  const X=i/h*sc,Y=j/h*sc,q=n(X+5.2,Y+1.3,4),r=n(X+q*2.4+1.7,Y+q*2.4+9.2,4);let f=n(X+r*2.2,Y+r*2.2,5);
  if(ridge)f=f*(1-ridge)+ridge*Math.pow(1-Math.abs(r*2-1),3);
  const d=Math.max(0,Math.min(1,(f-.36)*2.6))*m*gain,t=Math.min(1,f*1.3);
  for(let ch=0;ch<3;ch++)im.data[k+ch]=Math.min(255,c2[ch]+(c1[ch]-c2[ch])*t);im.data[k+3]=Math.round(Math.min(1,d)*255)}
 x.putImageData(im,0,0);return c}

/* ---- the forms ---- */
const MIN=()=>Math.max(Math.min(W,H),Math.max(W,H)*.6);
const FSEED=[...(location.pathname.split('/').pop()||'x')].reduce((a,c)=>(a*31+c.charCodeAt(0))%9973,7);   // each study its own gas
function plan(gi){const p=pal(gi),sd=gi*101+7+FSEED*17,L=[];
 if(STYLE==='drift'){
  L.push({c:['cloud',p.lo,p.deep,{scale:2.2}],s:1.55,rot:.004,a:.85});
  L.push({c:['wisp',p.hi,p.lo,{scale:3.4,ridge:.5}],s:1.15,rot:-.007,a:.75});
  if(!LITE)L.push({c:['cloud',p.hi,p.mid,{scale:4.6,ridge:.7,gain:.8}],s:.8,rot:.011,a:.6});}
 else if(STYLE==='veils'){
  const n=LITE?3:5;for(let k=0;k<n;k++)L.push({c:['veil',k%2?p.hi:p.mid,k%2?p.lo:p.deep,{ax:2.6,scale:3,ridge:k%2?.55:.2}],veil:true,y:-.32+.64*k/(n-1)+(k%2?.05:-.04),s:1.9+.3*(k%3),v:(k%2?-1:1)*(6+k*3.5),a:.55+.1*(k%2)});}
 else{ // core
  L.push({c:['halo',p.deep,p.lo,{scale:2,gain:.7}],s:1.7,rot:.002,a:.7});
  L.push({c:['lobes',p.lo,p.mid,{scale:3,ridge:.4}],s:1.25,rot:.006,a:.85,axis:true});
  L.push({c:['shell',p.hi,p.lo,{scale:5,ridge:.6}],s:.7,rot:-.01,a:.85});
  if(!LITE)L.push({c:['lobes',p.hi,p.lo,{scale:5.5,ridge:.8,gain:.8}],s:1.05,rot:.006,a:.5,axis:true});}
 L.forEach((l,k)=>{l.seed=sd+k*13;l.ph=k*1.7});return {gi,p,L,ready:false}}
const sets={},queue=[];
function want(gi){if(sets[gi])return sets[gi];const s=sets[gi]=plan(gi);queue.push(s);pump();return s}
let pumping=false;function pump(){if(pumping)return;pumping=true;(function step(){const s=queue[0];if(!s){pumping=false;return}
  const l=s.L.find(l=>!l.img||(!LITE&&!l.img2));if(!l){s.ready=true;queue.shift();setTimeout(step,30);return}
  if(!l.img)l.img=layer(l.seed,...l.c);else l.img2=layer(l.seed+500,...l.c);setTimeout(step,16)})()}

/* ---- the section in hand, read from the page's own label ---- */
function secOf(){const t=(document.getElementById('where')||{}).textContent||'';const i=(DATA.gname||[]).indexOf(t);return i<0?0:i}
let cur=null,prev=null,mix=1,shift=0;HI=HI;
let pend=null;
function setSec(gi){if(cur&&cur.gi===gi){pend=null;return}const s=want(gi);if(!cur){cur=s;mix=1;return}
 if(!s.ready||(prev&&mix<1)){pend=s;return}      // keep the gas in hand until the next has formed and any exchange has finished
 prev=cur;cur=s;mix=0;pend=null;want(gi+1)}
const XF=9;   // seconds for one gas to give way to the next
const ez=x=>x*x*(3-2*x);

/* ---- drawing ---- */
let last=performance.now(),T=0,frameL=0,axis=0,axisT=0;
function drawSet(s,alpha,t){if(!s||!s.ready||alpha<=0)return;const m=MIN(),cx=W/2,cy=H/2,br=(1+.035*Math.sin(t*.21))*(s.sc||1);
 for(const l of s.L){const A=alpha*l.a;g.save();
  if(l.veil){const w=W*l.s,h=w/2.6,x=((t*l.v+l.ph*W*.37)%(W+w)+W+w)%(W+w)-w*.5,y=cy+l.y*H;g.globalAlpha=A;g.translate(0,y);g.drawImage(l.img,x-w/2,-h/2,w,h);g.drawImage(l.img,x-w/2-(W+w),-h/2,w,h);
   if(l.img2){g.globalAlpha=A*(.5+.5*Math.sin(t*.06+l.ph));g.drawImage(l.img2,x-w/2,-h/2,w,h);g.drawImage(l.img2,x-w/2-(W+w),-h/2,w,h)}g.restore();continue}
  const S=m*l.s*br;g.translate(cx+Math.sin(t*.031+l.ph)*m*.03,cy+Math.cos(t*.027+l.ph)*m*.025);g.rotate((reduce?0:t*l.rot)+(l.axis?axis:0)+l.ph);
  g.globalAlpha=A;g.drawImage(l.img,-S/2,-S/2,S,S);
  if(l.img2){g.globalAlpha=A*(.5+.5*Math.sin(t*.07+l.ph));g.drawImage(l.img2,-S/2,-S/2,S,S)}g.restore()}
 if(STYLE==='core'){const r=m*(.05+.006*Math.sin(t*1.3)),c=s.p.hi.map(Math.round).join(','),gr=g.createRadialGradient(cx,cy,0,cx,cy,r*4);
  gr.addColorStop(0,`rgba(255,250,240,${.95*alpha})`);gr.addColorStop(.12,`rgba(${c},${.6*alpha})`);gr.addColorStop(1,`rgba(${c},0)`);g.globalAlpha=1;g.fillStyle=gr;g.fillRect(cx-r*4,cy-r*4,r*8,r*8)}}
function tint(s,alpha){if(!s)return;const c=s.p.deep.map(Math.round).join(','),gr=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.hypot(W,H)*.7);
 gr.addColorStop(0,`rgba(${c},${.2*alpha})`);gr.addColorStop(.6,`rgba(${c},${.13*alpha})`);gr.addColorStop(1,`rgba(${c},${.1*alpha})`);g.globalAlpha=1;g.fillStyle=gr;g.fillRect(0,0,W,H)}
const FRAMED=document.documentElement.classList.contains('framed')||(window.parent!==window&&/[#?&]frame/.test(location.href));   // the page drops its #frame on arrival, but marks <html> framed
let fadeIn=FRAMED?.35:0,told=false;
function frame(now){requestAnimationFrame(frame);if(LITE&&now-frameL<40)return;frameL=now;const dt=Math.min(.1,(now-last)/1000);last=now;if(!reduce)T+=dt;
 setSec(secOf());if(!cur||!cur.ready)return;
 if(pend&&pend.ready&&!(prev&&mix<1))setSec(pend.gi);
 if(mix<1)mix=Math.min(1,mix+dt/XF);if(mix>=1)prev=null;const e=ez(mix);if(prev)prev.sc=1+.1*e;cur.sc=prev?.94+.06*e:1;fadeIn=Math.min(1,fadeIn+dt/3);if(FRAMED&&!told&&fadeIn>.55){told=true;try{parent.postMessage({tc:'planetReady'},'*')}catch(_){}}
 if(STYLE==='core'){const target=cur.gi*.9;axis+=(target-axis)*Math.min(1,dt*.4)}
 g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);g.globalCompositeOperation='source-over';
 tint(prev,(1-e)*fadeIn);tint(cur,e*fadeIn);
 g.globalCompositeOperation='screen';drawSet(prev,(1-e)*fadeIn,T);drawSet(cur,e*fadeIn,T);g.globalCompositeOperation='source-over'}
/* the tones come from the planet's still once it has loaded */
const st=document.getElementById('arrive');
function start(){try{const c=document.createElement('canvas');c.width=c.height=40;const x=c.getContext('2d');x.drawImage(st,0,0,40,40);const d=x.getImageData(0,0,40,40).data,px=[];
  for(let i=0;i<d.length;i+=4)if(d[i+3]>220)px.push([d[i],d[i+1],d[i+2],d[i]*.3+d[i+1]*.59+d[i+2]*.11]);px.sort((a,b)=>a[3]-b[3]);
  const avg=a=>{const s=[0,0,0];a.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2]});return s.map(v=>v/Math.max(1,a.length))};
  if(px.length>20){HI=avg(px.slice(Math.floor(px.length*.7)));LO=avg(px.slice(0,Math.floor(px.length*.45)))}}catch(_){}
 want(0);requestAnimationFrame(frame);setTimeout(()=>{(DATA.gname||[]).forEach((_,i)=>want(i))},2500)}
if(st&&st.complete&&st.naturalWidth)start();else if(st){st.addEventListener('load',start);st.addEventListener('error',start)}else start();
})();
</script>
