html,body{margin:0;height:100%;background:#05060a;overflow:hidden;color:#e9e6dc}
body{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#planet,#hair,#back{position:fixed;inset:0;width:100%;height:100%;display:block}#back{z-index:0;pointer-events:none}
#planet{z-index:1}#hair{z-index:2;pointer-events:none}
#sky{z-index:0}
.ui{position:fixed;z-index:3;font-family:'Liberation Mono','DejaVu Sans Mono',monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8d8b84}
.ui a,.ui button{all:unset;cursor:pointer;color:#8d8b84;padding:.5em 0;transition:color .2s}
.ui a:hover,.ui button:hover,.ui a:focus-visible,.ui button:focus-visible{color:#e9e6dc}
.ui a:focus-visible,.ui button:focus-visible{outline:1px solid #8d8b84;outline-offset:3px}
#top{left:24px;top:18px}
#ctl{right:24px;bottom:22px;display:flex;gap:1.8em}
#where{left:24px;bottom:22px;padding:.5em 0;color:#5d5c58}
#rail{position:fixed;z-index:3;left:24px;right:24px;bottom:0;height:20px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(233,230,220,.16)}
#rail .fill{position:absolute;left:0;bottom:0;height:1px;background:rgba(233,230,220,.5);width:0;transition:width .5s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:rgba(233,230,220,.28);margin-left:-.5px;transition:background .2s,height .2s}
#rail i.g{height:10px;background:rgba(233,230,220,.62)}
#rail i.cur{background:#ee4a64;height:10px;width:2px;margin-left:-1px}
#rail i.hov{background:#e9e6dc}
#tip{position:fixed;z-index:4;bottom:64px;transform:translateX(-50%);white-space:nowrap;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.85);border:1px solid rgba(233,230,220,.18);padding:.45em .8em;display:none;pointer-events:none}
#tip b{font-weight:400;color:#ee4a64;margin-right:.8em}
#ctl{bottom:30px!important}#where{bottom:30px!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#flat{position:fixed;inset:0;z-index:2;pointer-events:none}
.fl{position:absolute;left:0;top:0;text-align:center;opacity:0;will-change:transform,opacity,filter}
.fl .lb{font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#d8d5cc;margin-bottom:.9em;text-shadow:0 0 10px #05060a,0 0 4px #05060a,0 0 2px #05060a,0 0 1px #000}
.fl .tx{font-family:'TeX Gyre Pagella',Palatino,serif;color:#f1eee6;line-height:1.36;text-shadow:0 0 14px rgba(5,6,10,.85),0 0 4px rgba(5,6,10,.9),0 1px 1px rgba(5,6,10,.9)}
.fl.ttl .tx{font-size:1.5em;line-height:1.12}.fl .dk{display:block;font-style:italic;font-size:.6em;line-height:1.4;margin-top:.7em;color:#d8d4ca}
#begin{position:fixed;left:0;right:0;bottom:16%;z-index:4;text-align:center;transition:opacity .8s}#begin.gone{opacity:0;pointer-events:none}
#bBegin{all:unset;cursor:pointer;font-family:'Liberation Mono',monospace;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#cfccc2;padding:.8em 1.2em;animation:bp 2.6s ease-in-out infinite}#bBegin:hover,#bBegin:focus-visible{color:#fff}@keyframes bp{50%{opacity:.5}}
html.framed,html.framed body{background:transparent!important}html.framed #sky{display:none!important}
.leaving #flat,.leaving .ui,.leaving #rail,.leaving #hair,.leaving #begin,.leaving #tip{opacity:0!important;transition:opacity .5s!important}
#endc{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .9s}
#endc.on{opacity:1;pointer-events:auto}
#endc .box{text-align:center;font-family:'Liberation Mono',monospace;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:#8d8b84;background:radial-gradient(closest-side,rgba(5,6,10,.82),rgba(5,6,10,0));padding:60px 80px}
#endc .k{color:#ee4a64;margin-bottom:1.2em}#endc .t{font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:26px;color:#e9e6dc;margin-bottom:1.6em}
#endc button{all:unset;cursor:pointer;display:block;margin:.9em auto;color:#cfccc2;padding:.3em .6em}#endc button:hover,#endc button:focus-visible{color:#ee4a64}
#endc button b{font-weight:400;font-family:'TeX Gyre Pagella',Palatino,serif;text-transform:none;letter-spacing:0;font-size:16px;color:#e9e6dc;margin-left:.6em}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:5;font-family:'Liberation Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfccc2;background:rgba(5,6,10,.8);border:1px solid rgba(233,230,220,.18);padding:.6em 1em;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;pointer-events:auto}#toast button{all:unset;cursor:pointer;color:#ee4a64;margin-left:1.2em}
#nogl{display:none;position:fixed;inset:0;z-index:4;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:'TeX Gyre Pagella',Palatino,serif;font-size:22px;line-height:1.5}
@media (max-width:600px){#where{display:none}#ctl{left:0;right:0;justify-content:center}}
</style>

<script>
/* Phones: the planet readthrough in a gentler form. MOB picks the form:
   S calm still  as A, but the planet is its still picture: no shader, no turning
   N nebula  no planet: a slow nebula in the planet's colours behind the passage
   E eclipse  the planet as a dark disc with a lit rim, the passage beneath

qhoX1mhtbEqYIAAAAAAA1uFZG/TNmCeC43cWU+Cj6CVquAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" style="display:none;position:fixed;z-index:1;pointer-events:none;transition:opacity .6s">
<script>
const DATA={"intro": [], "beats": [{"i": 1, "html": "The novel opens with a prologue set in eastern Oregon between 1929 and 1936. Jack is not in it, and nothing in it names him.", "words": 25}, {"i": 2, "html": "It tells the story of Harmon Wilder and Annemarie Levitt. He is a runaway from Oakland, she a sixteen-year-old runaway from Portland, and they blaze into the town of Iona on a stolen motorcycle in 1929.", "words": 36}, {"i": 3, "html": "She must have met him on one of her night trips downtown, and one night she didn’t come home.", "words": 19}, {"i": 4, "html": "Annemarie has the baby at a home for unwed mothers in Bend and comes back to Iona without him.", "words": 19}, {"i": 5, "html": "Harmon writes to orphanages and State homes all over Oregon, looking for a child named Wilder or Levitt. He gives up after a while.", "words": 24}, {"i": 6, "html": "The child never appears in the prologue. It ends with two sentences.", "words": 12}, {"i": 7, "html": "<span class=\"q\" data-q=\"She was twenty-four at the time.\">“She was twenty-four at the time.”<\/span> <span class=\"q\" data-q=\"The Indians buried her.\">“The Indians buried her.”<\/span>", "words": 10}, {"i": 8, "html": "A few weeks after Harmon dies, Annemarie kills herself. She has lived among the Indians for years, and they <span class=\"mo\" data-k=\"burial\">bury<\/span> her.", "words": 21}, {"i": 9, "html": "The prologue names no one else who attends to her. The only link to Jack is the surname.", "words": 18}, {"i": 10, "html": "The first chapter introduces Jack Levitt, who is seventeen in 1947, the year Part One opens. A child born in 1930 would be the same age.", "words": 26}, {"i": 11, "html": "Jack’s story presses against the same absence.", "words": 7}, {"i": 12, "html": "Jack’s account of the orphanage comes in Chapter 8, in a San Francisco hotel room where he drinks all morning and all afternoon.", "words": 23}, {"i": 13, "html": "The children were taught, all week long, that good and evil were a question of feeling. In the novel’s words, <span class=\"q\" data-q=\"if it felt good, it was bad, if it felt bad, it was good\">“if it felt good, it was bad, if it felt bad, it was good”<\/span>.", "words": 35}, {"i": 14, "html": "The food tasted poor and was called nourishing. The candy tasted beautiful and was called a sin. Work was called good, and the children’s bodies told them it was a lie. Each lesson names a thing and reverses what it feels like.", "words": 42}, {"i": 15, "html": "The preachers said God loved them especially because they were orphans.", "words": 11}, {"i": 16, "html": "The passage holds nothing back. Jack remembers <span class=\"q\" data-q=\"near-rage\">“near-rage”<\/span> at being ordered to play, and <span class=\"q\" data-q=\"a knot of anything but joy in the center of him\">“a knot of anything but joy in the center of him”<\/span>.", "words": 26}, {"i": 17, "html": "Beneath every lesson the children read one <span class=\"mo\" data-k=\"rules\">rule<\/span>, that <span class=\"q\" data-q=\"force and force alone governed\">“force and force alone governed”<\/span>.", "words": 16}, {"i": 18, "html": "The rules sat in no single place. When the man in charge dies of a heart attack in the yard, the boys expect to be <span class=\"mo\" data-k=\"freedom\">set free<\/span>.", "words": 28}, {"i": 19, "html": "Very quickly another administrator arrives, <span class=\"q\" data-q=\"different in appearance only\">“different in appearance only”<\/span>.", "words": 10}, {"i": 20, "html": "Jack’s conclusion is the one the essay takes for its own. <span class=\"q\" data-q=\"You could kill them all and the rules would remain.\">“You could kill them all and the rules would remain.”<\/span>", "words": 21}, {"i": 21, "html": "The orphanage teaches Jack that what a thing feels like and what it’s called have come apart. A world organized this way gives a self nothing to grip.", "words": 28}, {"i": 22, "html": "The reform school intensifies the lesson, and its extreme form is the hole. Jack goes there after beating a night guard.", "words": 21}, {"i": 23, "html": "He stays <span class=\"mo\" data-k=\"time\">126 days<\/span> without light, in a concrete cell about seven feet long and four feet wide, with no windows.", "words": 21}, {"i": 24, "html": "Food and water come through a slot in the door, not every day, and sometimes the food is dosed with soap powder.", "words": 22}, {"i": 25, "html": "<span class=\"q\" data-q=\"After a while time ceased to exist.\">“After a while time ceased to exist.”<\/span>", "words": 7}, {"i": 26, "html": "First the present went, so that there was only the movement of his thoughts from past to future. Then the past stopped being real, and the future went with it, until he was left alone inside his own mind.", "words": 39}, {"i": 27, "html": "Comfort and discomfort stopped applying.", "words": 5}, {"i": 28, "html": "In the dark, Jack pictures how it will end. He will die in the cell, and the staff will put him in a wooden coffin and <span class=\"q\" data-q=\"bury it somewhere, without a marker\">“bury it somewhere, without a marker”<\/span>.", "words": 33}, {"i": 29, "html": "They will move his papers from the ACTIVE file to the INACTIVE file, and later <span class=\"mo\" data-k=\"burial\">burn the folder<\/span>. They will be relieved to close it.", "words": 26}, {"i": 30, "html": "A new boy is brought into the hole, sobbing, perhaps twelve years old. He calls for his mother and screams for hours, and he cries out that his stomach hurts.", "words": 30}, {"i": 31, "html": "The night guard says, <span class=\"q\" data-q=\"He’s only fakin\">“He’s only fakin”<\/span>, and leaves.", "words": 10}, {"i": 32, "html": "Jack and the other boys scream at the guard in rage, because they know he was afraid to open the cell without a partner.", "words": 24}, {"i": 33, "html": "By morning the boy is dead of a burst appendix. There is an investigation, and the night guard is fired.", "words": 20}, {"i": 34, "html": "A State Senator reads the punishment records and says that Jack has been in the cell 87 days at that point. When the door opens, Jack attacks him.", "words": 28}, {"i": 35, "html": "The guards pull him off, the Senator goes back to Salem, and <span class=\"q\" data-q=\"the investigation went into file thirteen\">“the investigation went into file thirteen”<\/span>.", "words": 19}, {"i": 36, "html": "A cry goes <span class=\"mo\" data-k=\"word\">uncredited<\/span>, and a death goes into a file.", "words": 12}, {"i": 37, "html": "Billy Lancing, sixteen, gets off a bus from Seattle in Portland. At about that time Jack, seventeen, runs down the steps to a poolhall, broke and locked out of his hotel room.", "words": 32}, {"i": 38, "html": "Billy puts a small blue canvas overnight bag into a ten-cent locker at the Greyhound depot. Inside are his clothes and fifteen ten-dollar bills, the money he has won and scrimped and saved to make his <span class=\"mo\" data-k=\"freedom\">break<\/span> from home.", "words": 39}, {"i": 39, "html": "In Chapter 3 Jack sits on a high stool and watches Billy play keno at the poolhall. He sees at once that Billy is a natural.", "words": 26}, {"i": 40, "html": "He wishes he had <span class=\"q\" data-q=\"some talent, like Billy’s for pool\">“some talent, like Billy’s for pool”<\/span>, one that would make him <span class=\"q\" data-q=\"as busy with himself as Billy seemed to be\">“as busy with himself as Billy seemed to be”<\/span>.", "words": 26}, {"i": 41, "html": "He is a good fighter, and he sets that aside, because every man ought to be able to defend himself. In the next breath the wish turns back to money.", "words": 30}, {"i": 42, "html": "Later in the same chapter, in a one-pocket game against Bobby Case, Jack points at Kol Mano and says, <span class=\"q\" data-q=\"Ten dollars on Billy\">“Ten dollars on Billy”<\/span>.", "words": 24}, {"i": 43, "html": "He doesn’t have ten dollars. Billy looks up with <span class=\"q\" data-q=\"unveiled surprise\">“unveiled surprise”<\/span> and asks whether Jack is betting on him. Jack says yes.", "words": 22}, {"i": 44, "html": "For a moment something passes between them that Jack can’t identify. The novel calls it <span class=\"q\" data-q=\"an unexpected warmth, a communication\">“an unexpected warmth, a communication”<\/span>, and Jack feels himself <span class=\"q\" data-q=\"forced to break his eyes away\">“forced to break his eyes away”<\/span>.", "words": 32}, {"i": 45, "html": "It’s an early sign of what the two of them will be to each other.", "words": 15}, {"i": 46, "html": "Years later at San Quentin they are cell partners.", "words": 9}, {"i": 47, "html": "In Chapter 16 Billy says, <span class=\"q\" data-q=\"I’m tellin you I love you.\">“I’m tellin you I love you.”<\/span> He asks Jack to say it, <span class=\"q\" data-q=\"In words\">“In words”<\/span>, and then to kiss him once.", "words": 26}, {"i": 48, "html": "Jack can’t speak. He loves Billy and wants to say so, but <span class=\"q\" data-q=\"he did not mean the word the way Billy obviously meant it\">“he did not mean the word the way Billy obviously meant it”<\/span>.", "words": 25}, {"i": 49, "html": "He is embarrassed. To the kiss he says, “No.”", "words": 9}, {"i": 50, "html": "The essay reads this moment further. What Jack lacks is the capacity to give the <span class=\"mo\" data-k=\"word\">words<\/span> inside the moment that asks for them.", "words": 23}, {"i": 51, "html": "The institutions organized that capacity out of him before he was old enough to build it.", "words": 16}, {"i": 52, "html": "Later, in a poolhall on Market Street in San Francisco, Jack asks the man at the counter whether the house still holds Billy Lancing’s cue.", "words": 25}, {"i": 53, "html": "It does, in a numbered slot, under a layer of dust. Jack lifts it out. Asked whether it’s his, he says the man it belongs to is dead.", "words": 28}, {"i": 54, "html": "Then he says to this stranger, <span class=\"q\" data-q=\"I loved him\">“I loved him”<\/span>, and <span class=\"q\" data-q=\"But, see, I never told him about it\">“But, see, I never told him about it”<\/span>.", "words": 20}, {"i": 55, "html": "The narration calls this admitting it <span class=\"q\" data-q=\"in the only possible set of words he could use\">“in the only possible set of words he could use”<\/span>. The next sentence reads, <span class=\"q\" data-q=\"Still, he did not feel any better.\">“Still, he did not feel any better.”<\/span>", "words": 28}, {"i": 56, "html": "The words come late, to the wrong listener, and they pay nothing back.", "words": 13}, {"i": 57, "html": "Chapter Twenty-Five opens with a passage unlike anything else in the book. Jack’s marriage is failing.", "words": 16}, {"i": 58, "html": "The narration stays in the third person and moves into the conditional. <span class=\"mo\" data-k=\"time\">Later<\/span>, after it was all over, he <span class=\"q\" data-q=\"would marvel\">“would marvel”<\/span>. <span class=\"q\" data-q=\"By then he would realize\">“By then he would realize”<\/span>, and <span class=\"q\" data-q=\"By then he would understand\">“By then he would understand”<\/span>.", "words": 36}, {"i": 59, "html": "Other chapters glance ahead in a clause (<span class=\"q\" data-q=\"Afterward, later, he knew\">“Afterward, later, he knew”<\/span> in Chapter 16), but only here does a run of sentences hold the mode.", "words": 26}, {"i": 60, "html": "It looks ahead to the time after Jack has lost his wife and son.", "words": 14}, {"i": 61, "html": "By then he would realize that the <span class=\"mo\" data-k=\"freedom\">freedom<\/span> he had always yearned for and never understood was beyond <span class=\"q\" data-q=\"his or any man’s reach\">“his or any man’s reach”<\/span>.", "words": 24}, {"i": 62, "html": "The passage calls it <span class=\"q\" data-q=\"a freedom from connection, from fear, from trouble\">“a freedom from connection, from fear, from trouble”<\/span> and,   if(it.does){let bw,bh,bx,by;
   ({x:bx,y:by,w:bw,h:bh}=g.does);
   cloud(gasFor(bw*1.5,bh*1.5,'drift','storm',l.k),bx,by,bw,bh,drift,ga);
   if(ta>.01){hg.save();hg.globalAlpha=ta;hg.textAlign='center';hg.textBaseline='alphabetic';
    const fs=mob?15:17;hg.font=`italic ${fs}px 'TeX Gyre Pagella'`;ls(hg,'0px');
    const lines=wrapC(hg,it.does,bw-30),lh=fs*1.42,top=by-(lines.length*lh+22)/2;
    hg.font=`${mob?10:11}px 'Liberation Mono'`;ls(hg,'.24em');hg.fillStyle='#ee4a64';hg.fillText('DOES',bx+drift*.3,top+10);
    hg.font=`italic ${fs}px 'TeX Gyre Pagella'`;ls(hg,'0px');hg.fillStyle='#e9e6dc';hg.shadowColor='rgba(5,6,10,.9)';hg.shadowBlur=8;
    lines.forEach((ln,i)=>hg.fillText(ln,bx+drift*.3,top+22+lh*(i+.8)));hg.restore()}}
 }}
function drawHairs(g,M){
 hg.setTransform(DPR,0,0,DPR,0,0);hg.clearRect(0,0,W,H);if(intro<.3)return;
 // n = M^T p
 const tv=p=>[M[0][0]*p[0]+M[1][0]*p[1]+M[2][0]*p[2],M[0][1]*p[0]+M[1][1]*p[1]+M[2][1]*p[2],M[0][2]*p[0]+M[1][2]*p[1]+M[2][2]*p[2]];
 hg.lineCap='round';hg.lineWidth=.6;
 for(const h of hairs){const b=tv(h.b);if(b[2]<-.03)continue;
  const a=tv(h.a),L=h.len;
  const tip=[b[0]*(1+L*h.lean)+a[0]*L,b[1]*(1+L*h.lean)+a[1]*L,b[2]*(1+L*h.lean)+a[2]*L];
  const mid=[b[0]*(1+L*.7)+a[0]*L*.3*h.curl,b[1]*(1+L*.7)+a[1]*L*.3*h.curl,b[2]*(1+L*.7)+a[2]*L*.3*h.curl];
  if(tip[2]<-.02&&b[2]<.05)continue;
  const X=v=>g.cx+v[0]*g.R,Y=v=>g.cy-v[1]*g.R;
  const edge=1-Math.max(0,b[2]);
  hg.strokeStyle=`rgba(255,${Math.round(205+40*edge)},${Math.round(150+50*edge)},${((.06+.6*Math.pow(edge,3))*Math.min(1,(intro-.3)/.5)).toFixed(3)})`;
  hg.beginPath();hg.moveTo(X(b),Y(b));hg.quadraticCurveTo(X(mid),Y(mid),X(tip),Y(tip));hg.stroke()}}
