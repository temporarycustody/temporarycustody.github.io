<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>About · Temporary Custody</title>
<meta name="description" content="Temporary Custody: Everything we hold, we hold for a time. About the series, by B Alexander Keyes.">
<style>
:root{
  --paper:#f2f1ea; --card:#fbfbf6; --ink:#111111; --ink-mid:#2f2e2a; --ink-light:#6a6962; --ink-faint:#9a988f;
  --rule-thin:#cfcdc4; --rule-hair:#e0ded6; --crimson:#b8102c;
  --prose:'TeX Gyre Schola','Century Schoolbook L',Georgia,serif;
  --mono:'Liberation Mono','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;margin:0;background:#fff;overflow:hidden}
body{position:fixed;inset:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1080px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#grain{position:absolute;inset:0;opacity:.55;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.44  0 0 0 0 0.40  0 0 0 .05 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.pl{position:absolute;display:block;height:auto;transition:left .9s ease,top .9s ease,width .9s ease,opacity .9s ease;pointer-events:none}
.pl.big{width:var(--plw,660px);left:calc((1080px - var(--plw,660px)) / 2);top:calc(390px - var(--plw,660px) / 3)}
.pl.small{left:420px;top:40px;width:240px}
.pl.wide{left:370px;top:30px;width:340px}
#pl{opacity:1}#pls{opacity:0}
.scat #pl{opacity:0}.scat #pls{opacity:1}
.mast{position:absolute;left:0;right:0;top:700px;text-align:center;transition:opacity .6s}
.pub{line-height:50px;font-family:var(--prose);font-size:34px;letter-spacing:.26em;margin-right:-.26em;color:var(--ink)}
.iss{margin-top:10px;line-height:37px;font-family:var(--prose);font-style:italic;font-size:26px;color:var(--ink-light)}
.sign{position:absolute;left:0;right:0;top:690px;text-align:center;font-family:var(--prose);font-size:47px;line-height:1.5;color:var(--ink);transition:opacity .6s}
.sign span{display:block}
.psec{position:absolute;left:64px;top:44px;font-family:var(--mono);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);transition:opacity .6s}
.tx{position:absolute;left:64px;width:952px;top:290px;height:680px;display:flex;flex-direction:column;justify-content:center;gap:30px;font-family:var(--prose);font-size:47px;line-height:1.46;color:var(--ink-mid)}
.tx.short{font-size:64px;line-height:1.28;color:var(--ink)}
.tx.title{top:260px;height:720px}
.tx .ln{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.tx .ln.in{opacity:1;transform:none}
.tx .ln.em{color:var(--ink)}
.hide{opacity:0!important;pointer-events:none}
#ui{position:absolute;pointer-events:none;font-family:var(--mono);color:var(--ink-faint)}
#ui .hit{pointer-events:auto}
#hint{position:absolute;left:0;right:0;top:79%;text-align:center;letter-spacing:.2em;text-transform:uppercase;line-height:1.9;opacity:0;transition:opacity .6s}
#hint b{display:block;font-weight:400;color:var(--ink-mid)}
#hint.on{opacity:1}
#ctrl{position:absolute;right:3.2%;bottom:4.6%;display:flex;gap:1.6em;letter-spacing:.18em;text-transform:uppercase}
#ctrl button,#ctrl a{all:unset;cursor:pointer;color:var(--ink-faint);padding:.5em 0;transition:color .2s}
#ctrl button:hover,#ctrl button:focus-visible,#ctrl a:hover,#ctrl a:focus-visible{color:var(--ink)}
#ctrl button:focus-visible,#ctrl a:focus-visible{outline:1px solid var(--ink-faint);outline-offset:3px}
#ctrl button.on{color:var(--ink-mid)}
#rail{position:absolute;left:0;right:0;bottom:0;height:18px;cursor:pointer}
#rail .base{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--rule-hair)}
#rail .fill{position:absolute;left:0;bottom:0;height:2px;background:var(--ink-faint);width:0;transition:width .35s}
#rail i{position:absolute;bottom:0;width:1px;height:5px;background:var(--rule-thin);margin-left:-.5px}
#rail i.g{height:9px;background:var(--ink-faint)}
#rail i.cur{background:var(--crimson);height:9px;width:2px;margin-left:-1px}
#tip{position:absolute;bottom:22px;transform:translateX(-50%);white-space:nowrap;background:var(--card);border:1px solid var(--rule-thin);padding:.3em .7em;letter-spacing:.08em;color:var(--ink-mid);display:none}
#ui.tall #ctrl{bottom:auto;top:calc(100% + 26px);left:0;right:0;justify-content:center}
#ui.tall #rail{bottom:-16px}
#ui.narrow #hint{letter-spacing:.1em;padding:0 6%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.pl,.tx .ln,.mast,.sign,.psec{transition:none}}

html,body{background:var(--paper)!important}
#scene{position:absolute;left:0;top:0;width:1080px;height:2760px;transition:transform 1.5s cubic-bezier(.4,.1,.2,1),opacity .6s;pointer-events:none}
#scene svg{position:absolute;left:0;top:0;overflow:visible}
#scene .bx{position:absolute;background:var(--card);border:2.5px solid #111;box-shadow:12px 14px 0 #dedcd3;padding:20px 24px;font:28px/1.38 var(--prose);color:#222}
#scene .bx.red{box-shadow:12px 14px 0 #ecd3d6}
#scene .bx.ink{background:#111;color:#fbfbf6;display:flex;align-items:center}
#scene .bx.ink .bt{width:100%}
#scene .bx.ink .n + .bt{align-self:flex-start}
#scene .bx.dbl{border-top:7px double #111;border-bottom:7px double #111;font-style:italic}
#scene .bx .tab{position:absolute;left:-2.5px;top:-35px;background:#111;color:#fbfbf6;font:700 14px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;padding:9px 13px}
#scene .bx.red .tab{background:var(--crimson)}
#scene .bx.grey .tab{background:#6a6962}
#scene .bx.dbl .tab{top:-42px}
#scene .bx .n{position:absolute;left:18px;top:12px;font:700 20px var(--mono);color:#e05b6c}
#scene .bx .n + .bt{padding-top:30px}
#scene .ul{background:linear-gradient(#b3182c,#b3182c) 0 100%/100% 3px no-repeat;padding-bottom:2px}
#scene .t{position:absolute;font:28px/1.4 var(--prose);color:#222}
#scene .mono{font-family:var(--mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#6a6962;position:absolute;white-space:nowrap}
#scene .mono.r{color:#b3182c}
#scene .chip{position:absolute;border:2px solid #6a6962;background:var(--card);font:19px/1 var(--mono);color:#2a2a2a;padding:15px 0;text-align:center;white-space:nowrap}
#scene .rv{opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s ease}
#scene .rv.on{opacity:1;transform:none}
#scene .dr{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease}
#scene .dr.on{stroke-dashoffset:0}
#scene .wp{clip-path:inset(0 0 100% 0);transition:clip-path 1.5s ease}
#scene .wp.on{clip-path:inset(0 0 0 0)}
#scene .wpu{clip-path:inset(100% 0 0 0);transition:clip-path 1.5s ease}
#scene .wpu.on{clip-path:inset(0 0 0 0)}
#scene .hd{opacity:0;transition:opacity .3s ease 1s}
#scene .hd.on{opacity:1}
#scene .sx{transform:scaleX(0);transform-origin:0 50%;transition:transform .8s ease}
#scene .sx.on{transform:scaleX(1)}
@media (prefers-reduced-motion:reduce){#scene,#scene .rv,#scene .dr,#scene .wp,#scene .wpu,#scene .hd,#scene .sx{transition:none!important}}
</style>

  /* rail */
  const rail = $('rail'), fill = rail.querySelector('.fill'), tip = $('tip');
  const ticks = S.map((s, j) => { const i = document.createElement('i'); i.style.left = (j / last * 100) + '%'; if (j === 0 || j === 2 || j === 5 || j === 8) i.className = 'g'; rail.appendChild(i); return i; });
  const railIndex = ev => { const r = rail.getBoundingClientRect(); return Math.max(0, Math.min(last, Math.round((ev.clientX - r.left) / r.width * last))); };
  rail.addEventListener('mousemove', ev => { const j = railIndex(ev); tip.textContent = S[j].name; tip.style.left = (j / last * 100) + '%'; tip.style.display = 'block'; });
  rail.addEventListener('mouseleave', () => tip.style.display = 'none');
  rail.addEventListener('click', ev => { ev.stopPropagation(); begin(); go(railIndex(ev)); });
  rail.addEventListener('keydown', ev => { if (ev.key === 'ArrowRight') { ev.preventDefault(); advance(); } if (ev.key === 'ArrowLeft') { ev.preventDefault(); back(); } });

  /* sound: one quiet bed, a soft bell at each paragraph */
  let ctx = null, master = null, muted = false, began = false;
  const b64 = id => { const s = atob($(id).textContent.trim()), u = new Uint8Array(s.length); for (let k = 0; k < s.length; k++) u[k] = s.charCodeAt(k); return u; };
  function initAudio() {
    if (ctx) { if (ctx.state !== 'running') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);
    ctx.decodeAudioData(b64('a_edge').buffer, buf => {
      const ch = buf.getChannelData(0); let off = 0; while (off < 6000 && Math.abs(ch[off]) < 1e-4) off++;
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      src.loopStart = off / buf.sampleRate; src.loopEnd = off / buf.sampleRate + 16.0;
      const g = ctx.createGain(); g.gain.value = 0; src.connect(g); g.connect(master); src.start(0, src.loopStart);
      g.gain.setTargetAtTime(1, ctx.currentTime, 0.8);
    }, () => {});
  }
  function bell() {
    if (!ctx || muted) return; const t = ctx.currentTime;
    [[1, .5], [2.76, .22], [5.4, .1], [8.93, .05]].forEach(([m, a]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = 392 * m;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(a * .22, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + 3.2 / Math.sqrt(m));
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 3.4);
    });
  }

  /* stage */
  let idx = 0, mode = 'step', timers = [], playT = 0;
  const clearT = () => { timers.forEach(clearTimeout); timers = []; };
  function render(j, withSound) {
    clearT(); const s = S[j];
    const big = !!s.open;
    $('pl').className = 'pl ' + (big ? 'big' : 'small');
    $('pl').style.opacity = big ? 1 : 0;
    $('mast').classList.toggle('hide', !s.open);
    showScene(j, withSound && !reduce);
    if (withSound && s.bell) timers.push(setTimeout(bell, 200));
    idx = j; paint(); announce(j);
  }
  function announce(j) { const s = S[j]; sr.textContent = s.open ? 'Temporary Custody. About.' : s.sign ? 'Best, B Alexander' : txtOf(s); }
  function paint() {
    fill.style.width = (idx / last * 100) + '%'; ticks.forEach((t, j) => t.classList.toggle('cur', j === idx));
    const h = $('hint');
    if (idx === 0 && mode === 'step' && !began) { h.innerHTML = `<b>${VERB} to begin, with sound</b>`; h.classList.add('on'); }
    else if (idx === last && mode === 'step') { h.innerHTML = `<b>${VERB} to begin again</b>`; h.classList.add('on'); }
    else h.classList.remove('on');
    $('bPlay').textContent = mode === 'play' ? 'Pause' : 'Play'; $('bPlay').classList.toggle('on', mode === 'play');
    rail.setAttribute('aria-valuemin', 1); rail.setAttribute('aria-valuemax', last + 1); rail.setAttribute('aria-valuenow', idx + 1); rail.setAttribute('aria-valuetext', S[idx].name);
  }
  function begin() { began = true; initAudio(); }
  function go(j) { if (mode === 'play') { mode = 'step'; clearTimeout(playT); } render(Math.max(0, Math.min(last, j)), true); }
  function advance() { begin(); if (mode === 'play') { pause(); return; } if (idx >= last) { render(0, false); return; } render(idx + 1, true); }
  function back() { begin(); if (mode === 'play') pause(); if (idx > 0) render(idx - 1, false); }
  const dwell = j => { const s = S[j]; const n = (s.lines || []).length; return 2200 + txtOf(s).length * 52 + (s.sign ? 0 : 0) + Math.max(0, n - 1) * 1000 + (s.open ? 1500 : 0) + (s.sign ? 2500 : 0) + (j === 3 ? 2500 : 0) + (j === 7 ? 1500 : 0); };
  function tick() { if (mode !== 'play') return; if (idx >= last) { mode = 'step'; paint(); return; } render(idx + 1, true); playT = setTimeout(tick, dwell(idx)); }
  function play() { begin(); if (idx >= last) render(0, false); mode = 'play'; paint(); clearTimeout(playT); playT = setTimeout(tick, dwell(idx)); }
  function pause() { mode = 'step'; clearTimeout(playT); paint(); }

  document.addEventListener('click', ev => { if (ev.target.closest('#ctrl,#rail')) return; advance(); });
  let tx0 = null, ty0 = 0, swallow = false;
  document.addEventListener('touchstart', ev => { if (ev.touches.length === 1) { tx0 = ev.touches[0].clientX; ty0 = ev.touches[0].clientY; } }, { passive: true });
  document.addEventListener('touchend', ev => {
    if (tx0 === null) return; const dx = ev.changedTouches[0].clientX - tx0, dy = ev.changedTouches[0].clientY - ty0; tx0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) { swallow = true; setTimeout(() => swallow = false, 400); dx < 0 ? advance() : back(); }
  }, { passive: true });
  document.addEventListener('click', ev => { if (swallow) { swallow = false; ev.stopImmediatePropagation(); } }, true);
  document.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('#ctrl')) { if (ev.key === ' ' || ev.key === 'Enter') return; }
    if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(ev.key)) { ev.preventDefault(); advance(); }
    else if (['ArrowLeft', 'PageUp'].includes(ev.key)) { ev.preventDefault(); back(); }
    else if (ev.key === 'Home') go(0); else if (ev.key === 'End') go(last);
    else if (ev.key === 'p' || ev.key === 'P') mode === 'play' ? pause() : play();
    else if (ev.key === 'm' || ev.key === 'M') $('bSound').click();
  });
  $('bBack').addEventListener('click', ev => { ev.stopPropagation(); back(); });
  $('bPlay').addEventListener('click', ev => { ev.stopPropagation(); mode === 'play' ? pause() : play(); });
  $('bSound').addEventListener('click', ev => {
    ev.stopPropagation(); muted = !muted; begin();
    if (master) master.gain.setTargetAtTime(muted ? 0 : 1, ctx.currentTime, 0.08);
    ev.currentTarget.textContent = muted ? 'Sound off' : 'Sound on'; ev.currentTarget.classList.toggle('on', !muted);
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') pause(); });
  render(0, false);
  window.__ab = { go, advance, back, play, pause, state: () => ({ idx, mode, began, ctx: ctx ? ctx.state : null }) };
  window.__ready = true;
})();
</script>
</body>
</html>
