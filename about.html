:root{--paper:#f2f1ea;--card:#fbfbf6;--ink:#111111;--crimson:#b8102c;--sky:#05060a;--light:#e9e6dc;--mono:'Liberation Mono','DejaVu Sans Mono',monospace;--prose:'TeX Gyre Schola','Century Schoolbook L',Georgia,serif}
html,body{margin:0;height:100%;background:var(--sky);overflow:hidden;color:var(--light)}
#sky{position:fixed;inset:0;display:block}
#lines{position:fixed;inset:0;pointer-events:none;overflow:visible}
#lines .fig{stroke:rgba(214,222,245,.42);stroke-width:1;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.1s ease}
#lines .fig.on{stroke-dashoffset:0}
#lines .lead{fill:none;stroke:#e6ebff;stroke-width:1;stroke-dasharray:2 5;filter:drop-shadow(0 0 3px rgba(170,190,255,.8));opacity:0;transition:opacity .5s ease .25s}
#lines .lead.on{opacity:.75}
#lay{position:fixed;inset:0;pointer-events:none}
.mast{position:fixed;left:24px;top:22px;font:12px var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--light);opacity:.85}
.mast i{display:block;margin-top:.6em;font:italic 16px var(--prose);letter-spacing:.02em;text-transform:none;opacity:.85}
.bx{position:absolute;background:none;border:0;padding:0;font:21px/1.5 var(--prose);color:#ffd49a;
  text-shadow:0 0 2px rgba(5,6,10,1),0 0 3px rgba(5,6,10,.9),0 0 10px rgba(255,170,80,.45),0 0 24px rgba(255,150,60,.18);pointer-events:auto;
  opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease,visibility 0s .6s;box-sizing:border-box;z-index:2}
.bx.on{opacity:1;visibility:visible;transform:none;transition:opacity 1s ease .2s,transform 1s ease .2s,visibility 0s}
.bx p{margin:0}.bx p+p{margin-top:.7em}
.bx .tab{display:block;margin-bottom:12px;font:400 11px/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:#ffd49a;opacity:.75}
.bx.lead .big{font-size:31px;line-height:1.32;font-style:italic}
.bx .lim{display:block;margin-top:12px;font:11px var(--mono);letter-spacing:.3em;text-transform:uppercase;opacity:.65}
.bx .ul{font-style:italic;color:#ffe7c4;text-shadow:0 0 2px rgba(5,6,10,1),0 0 12px rgba(255,180,90,.75),0 0 26px rgba(255,150,60,.35)}
.bx .forms{font:13px/1.9 var(--mono);letter-spacing:.06em;opacity:.9}
.bx .three{font-size:17px;opacity:.85}
.bx .dbl{font-style:italic;font-size:22px;margin-top:.8em}
.bx.ink ol{margin:0;padding:0 0 0 1.5em;font-size:19px}.bx.ink li{margin:.1em 0 .55em}.bx.ink li::marker{font:400 12px var(--mono);color:#ffd49a}
.bx.ink .sig{margin-top:14px;font-size:20px}
.mk{position:absolute;z-index:1;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;background:none;cursor:pointer;pointer-events:none;opacity:0;transition:opacity .5s}
.mk.seen{pointer-events:auto;opacity:1}
.mk i{position:absolute;inset:4px;border:1px solid rgba(233,230,220,.5);border-radius:50%;transition:transform .5s,border-color .5s}
.mk.cur i{transform:scale(1.35);border-color:rgba(233,230,220,.95)}
.mk span{position:absolute;left:34px;top:50%;translate:0 -50%;white-space:nowrap;font:10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--light);opacity:.6}
.mk.lt span{left:auto;right:34px}
.mk.cur span{opacity:0}
.mk:focus-visible i{border-color:#fff;outline:1px solid #fff;outline-offset:3px}
#hint{position:fixed;left:24px;bottom:22px;font:11px var(--mono);letter-spacing:.24em;text-transform:uppercase;opacity:.6;transition:opacity .8s}#hint.gone{opacity:0}
.ctl{position:fixed;right:20px;bottom:14px;display:flex;gap:18px;align-items:center}
.ctl button,.ctl a,.ctl span{background:none;border:0;color:var(--light);font:11px var(--mono);letter-spacing:.24em;text-transform:uppercase;opacity:.7;cursor:pointer;padding:8px 0;text-decoration:none}
.ctl span{opacity:.45;cursor:default}
.ctl button:hover,.ctl a:hover{opacity:1}
.ctl button:focus-visible,.ctl a:focus-visible{outline:1px solid var(--light);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){.mk span{display:none}.bx{font-size:18px}.bx.lead .big{font-size:24px}.bx .three{font-size:15px}.bx .dbl{font-size:18px}.bx.ink ol{font-size:16px}
  #hint{left:0;right:0;bottom:56px;text-align:center}.ctl{left:12px;right:12px;justify-content:space-between;gap:8px}.ctl button,.ctl a,.ctl span{letter-spacing:.12em;white-space:nowrap;font-size:10px}.mast{left:16px;top:16px}}
@media (prefers-reduced-motion:reduce){.bx,.bx.on,#lines .fig,#lines .lead,.mk,.mk i{transition:none!important}}
</style></head><body>

/* ---- sound: a low, slow-beating pad under the sky, a bell at each star (higher at the top of the figure, lower at the foot),
